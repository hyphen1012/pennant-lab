name: Canonical VIP HTTP settlement
on:
  pull_request:
    paths:
      - 'scripts/canonical-vip-http-check.cjs'
      - 'server/game-authority.cjs'
      - 'server/headless-engine.cjs'
      - 'server/purchase-registry.cjs'
      - 'server/purchase-rights.cjs'
      - 'server/service-runtime.cjs'
      - '.github/workflows/canonical-vip-http.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/canonical-vip-http-check.cjs
