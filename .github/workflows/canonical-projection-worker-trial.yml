name: Canonical projection worker trial
on:
  pull_request:
    paths:
      - 'server/projection-worker-trial.cjs'
      - 'server/headless-engine.cjs'
      - 'server/canonical-state-codec.cjs'
      - 'scripts/canonical-projection-worker-trial-check.cjs'
      - 'scripts/canonical-projection-staging-check.cjs'
      - 'server/game-authority.cjs'
      - 'server/service-runtime.cjs'
      - 'server/game-admission.cjs'
      - 'scripts/canonical-worker-http-admission-check.cjs'
      - '.github/workflows/canonical-projection-worker-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/canonical-projection-worker-trial-check.cjs
      - run: node scripts/canonical-projection-staging-check.cjs
      - run: node scripts/canonical-worker-http-admission-check.cjs
