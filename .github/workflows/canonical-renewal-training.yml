name: Canonical renewal and training
on:
  push:
    paths:
      - 'scripts/canonical-renewal-training-check.cjs'
      - 'server/headless-engine.cjs'
      - '.github/workflows/canonical-renewal-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renewal-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/canonical-renewal-training-check.cjs
