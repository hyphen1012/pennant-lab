name: Roster UX focused browser audit
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/scenes/camp-rest.svg'
      - 'scripts/roster-ux-browser-check.cjs'
      - '.github/workflows/roster-ux-browser.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/pl-roster-http.log 2>&1 &
          node scripts/roster-ux-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-ux-mobile
          path: test-results/roster-ux/
