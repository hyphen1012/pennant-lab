name: PENNANT LAB verification
on:
  push:
    branches: [main, feature/v0.7.0-manager-gm-ai]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.cjs
      - run: node scripts/smoke.cjs
        if: always()
      - run: node scripts/transfer-check.cjs
        if: always()

      - run: node scripts/stadium-check.cjs
        if: always()
      - run: node scripts/farm-check.cjs
        if: always()

      - run: node scripts/sponsor-check.cjs
        if: always()
      - run: node scripts/commerce-check.cjs
        if: always()

      - run: node scripts/annual_training.cjs
        if: always()

      - run: node scripts/daily-wage-stint-check.cjs
        if: always()

      - run: node scripts/gm-season-trade-check.cjs
        if: always()

      - run: node scripts/staff-legacy-check.cjs
        if: always()

      - run: node scripts/rival-learning-check.cjs
        if: always()

      - run: node scripts/fa-recruit-learning-check.cjs
        if: always()

      - run: node scripts/club-services-check.cjs
        if: always()

      - run: node scripts/care-finance-cinema-check.cjs
        if: always()

      - run: node scripts/season-skip-check.cjs
        if: always()

      - run: node scripts/club-honors-check.cjs
        if: always()

      - run: node scripts/club-rewards-check.cjs
        if: always()

      - run: node scripts/cpu-economy-check.cjs
        if: always()
