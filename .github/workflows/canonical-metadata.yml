name: Canonical metadata storage
on:
  push:
    paths: ['server/**','mobile/src/account-client.cjs','scripts/canonical-metadata-check.cjs','scripts/canonical-admission-check.cjs','scripts/canonical-read-projection-check.cjs','.github/workflows/canonical-metadata.yml']
  pull_request:
    paths: ['server/**','mobile/src/account-client.cjs','scripts/canonical-metadata-check.cjs','scripts/canonical-admission-check.cjs','scripts/canonical-read-projection-check.cjs','.github/workflows/canonical-metadata.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/canonical-metadata-check.cjs
      - run: node scripts/canonical-service-check.cjs
      - run: node scripts/canonical-game-session-check.cjs

      - run: node scripts/canonical-admission-check.cjs

      - run: node scripts/canonical-read-projection-check.cjs
