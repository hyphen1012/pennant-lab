name: Canonical trade browser
on:
  pull_request:
    paths:
      - 'index.html'
      - 'mobile/**'
      - 'server/**'
      - 'scripts/canonical-trade-browser-check.cjs'
      - '.github/workflows/canonical-trade-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright esbuild
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix mobile install
      - run: npm --prefix mobile run prepareWeb
        env:
          PL_CANONICAL_UI_PILOT: '1'
          PL_ACCOUNT_API_URL: https://fixture.invalid
          PL_OAUTH_AUTHORIZE_URL: https://fixture.invalid/authorize
          PL_OAUTH_TOKEN_URL: https://fixture.invalid/token
          PL_OAUTH_ISSUER: https://fixture.invalid
          PL_OAUTH_CLIENT_ID: fixture
          PL_OAUTH_SCOPE: openid
          PL_OAUTH_REDIRECT_URI: jp.pennantlab.game://auth/callback
      - run: |
          python3 -m http.server 8765 > /tmp/pl-trade-http.log 2>&1 &
          node scripts/canonical-trade-browser-check.cjs
