name: GM tenure isolated domain trial
on:
  pull_request:
    paths:
      - 'server/gm-tenure-trial.cjs'
      - 'server/gm-archive-adapter-trial.cjs'
      - 'scripts/gm-archive-adapter-trial-check.cjs'
      - 'scripts/gm-tenure-trial-check.cjs'
      - '.github/workflows/gm-tenure-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/gm-tenure-trial-check.cjs
      - run: node scripts/gm-archive-adapter-trial-check.cjs
