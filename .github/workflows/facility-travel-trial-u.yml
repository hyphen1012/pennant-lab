name: Trial U targeted travel benefit review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/facility-trial-u*.cjs'
      - 'scripts/year-cycle-trial-u.cjs'
      - '.github/workflows/facility-travel-trial-u.yml'
jobs:
  natural-investment:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: [1937, 4391, 8821]
    env:
      FACILITY_SEED: ${{ matrix.seed }}
      FIXED_TEAM: -1
      STOP_AFTER_FACILITY: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/facility-trial-r-check.cjs
      - run: node scripts/facility-trial-u-check.cjs
      - run: node scripts/cpu-economy-check.cjs
      - run: |
          mkdir -p test-results
          set -o pipefail
          node scripts/year-cycle-trial-u.cjs 55 "$FACILITY_SEED" | tee test-results/facility-cycle-u.log
          node scripts/facility-endurance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facility-travel-trial-u-${{ matrix.seed }}
          path: test-results/
