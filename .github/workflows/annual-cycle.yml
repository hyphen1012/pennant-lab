name: Annual cycle and adaptive AI comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'scripts/year-cycle-check.cjs'
      - '.github/workflows/annual-cycle.yml'
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        seed: [1937,4391,8821,5107,12011]
        fixed: [-1,0]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FIXED_TEAM: ${{ matrix.fixed }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          mkdir -p test-results
          set -o pipefail
          node scripts/year-cycle-check.cjs 10 ${{ matrix.seed }} | tee test-results/year-cycle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: year-cycle-${{ matrix.seed }}-${{ matrix.fixed }}
          path: test-results/

