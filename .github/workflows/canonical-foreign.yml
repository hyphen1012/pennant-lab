name: Canonical foreign recruitment
on:
  push:
    paths:
      - 'server/headless-engine.cjs'
      - 'scripts/canonical-foreign-check.cjs'
      - '.github/workflows/canonical-foreign.yml'
  pull_request:
    paths:
      - 'server/headless-engine.cjs'
      - 'scripts/canonical-foreign-check.cjs'
      - '.github/workflows/canonical-foreign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foreign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/canonical-foreign-check.cjs
