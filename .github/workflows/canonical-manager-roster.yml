name: Canonical manager and roster review
on:
  push:
    paths: ['server/headless-engine.cjs','scripts/canonical-manager-roster-check.cjs','.github/workflows/canonical-manager-roster.yml']
  pull_request:
    paths: ['server/headless-engine.cjs','scripts/canonical-manager-roster-check.cjs','.github/workflows/canonical-manager-roster.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/canonical-manager-roster-check.cjs
