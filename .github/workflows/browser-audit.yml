name: Mobile viewport browser audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/browser-audit.cjs'
      - '.github/workflows/browser-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/pl-http.log 2>&1 &
          node scripts/browser-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-viewport-audit
          path: test-results/browser/
