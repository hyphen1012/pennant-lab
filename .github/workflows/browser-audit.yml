name: Mobile viewport browser audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'scripts/browser-audit.cjs'
      - 'scripts/startup-browser-check.cjs'
      - 'assets/startup/**'
      - '.github/workflows/browser-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/browser-audit.cjs'
      - 'scripts/startup-browser-check.cjs'
      - 'assets/startup/**'
      - '.github/workflows/browser-audit.yml'

concurrency:
  group: browser-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright esbuild
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/pl-http.log 2>&1 &
          node scripts/save-idb-browser-check.cjs
          node scripts/cloud-game-browser-check.cjs
          node scripts/startup-browser-check.cjs
          node scripts/browser-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-viewport-audit
          path: test-results/browser/
