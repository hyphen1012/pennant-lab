name: Natural facility level 20 endurance
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/year-cycle-check.cjs'
      - 'scripts/facility-endurance.cjs'
      - '.github/workflows/facility-endurance.yml'
jobs:
  natural-investment:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: [1937, 4391, 8821]
    env:
      FACILITY_SEED: ${{ matrix.seed }}
      FIXED_TEAM: -1
      STOP_AFTER_FACILITY: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify capital allocation regression
        run: node scripts/cpu-economy-check.cjs
      - run: |
          mkdir -p test-results
          set -o pipefail
          node scripts/year-cycle-check.cjs 55 "$FACILITY_SEED" | tee test-results/facility-cycle.log
          node scripts/facility-endurance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natural-facility-endurance-${{ matrix.seed }}
          path: test-results/

