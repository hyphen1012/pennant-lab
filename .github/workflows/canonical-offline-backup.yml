name: Canonical offline backup trial
on:
  pull_request:
    paths:
      - 'server/offline-backup-trial.cjs'
      - 'server/encrypted-backup-trial.cjs'
      - 'scripts/canonical-offline-backup-check.cjs'
      - 'scripts/canonical-recovery-rights-check.cjs'
      - 'server/service-runtime.cjs'
      - '.github/workflows/canonical-offline-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/canonical-offline-backup-check.cjs

      - run: node scripts/canonical-recovery-rights-check.cjs
