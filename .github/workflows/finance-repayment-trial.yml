name: Finance repayment trial
on:
  pull_request:
    paths:
      - 'server/finance-repayment-trial.cjs'
      - 'scripts/finance-repayment-trial-check.cjs'
      - '.github/workflows/finance-repayment-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/finance-repayment-trial-check.cjs
