name: Native mobile debug build
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm test
      - run: npm run prepareWeb
      - run: npx cap add android
      - run: node configure-native.cjs
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pennant-lab-android-test
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run prepareWeb
      - run: npx cap add ios
      - run: node configure-native.cjs
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: pennant-lab-ios-simulator
          path: mobile/build-ios/Build/Products/Debug-iphonesimulator/App.app
