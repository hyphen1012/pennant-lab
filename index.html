      body=`<section class="panel"><h3 class="panel-title">年度別成績</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>年度</th><th>球団</th>${pitch?'<th>登板</th><th>投球回</th><th>防御率</th><th>勝</th><th>敗</th><th>奪三振</th>':'<th>試合</th><th>打率</th><th>安打</th><th>本塁打</th><th>打点</th><th>盗塁</th>'}</tr></thead><tbody>${rows.map(s=>{const st=s.stats,tm=getTeam(s.teamId);return `<tr><td>${s.year}</td><td>${tm?h(tm.short):'FA'}</td>${pitch?`<td>${st.g}</td><td>${Math.floor(st.outs/3)}.${st.outs%3}</td><td>${st.outs?(st.er*27/st.outs).toFixed(2):'--.--'}</td><td>${st.w}</td><td>${st.l}</td><td>${st.k}</td>`:`<td>${st.g}</td><td>${st.ab?(st.h/st.ab).toFixed(3).replace(/^0/,''):'---'}</td><td>${st.h}</td><td>${st.hr}</td><td>${st.rbi}</td><td>${st.sb}</td>`}</tr>`}).join('')}</tbody></table></div><p class="tiny">v0.1以前に終了した年度の成績は保存されていないため、復元できません。</p></section>`;
    }
    if(ui.playerDetailTab==='memo')body=`<section class="panel"><h3 class="panel-title">GMメモ</h3><p class="small">この選手について残したメモはセーブデータに保存されます。</p><textarea class="player-memo" data-change="player-memo" data-id="${p.id}" placeholder="来季の構想・育成方針・補強候補などを記録">${h(p.memo)}</textarea><div class="tiny">入力欄から離れると保存されます。</div></section>`;
    return `<div class="detail-back"><button class="ghost-btn" data-action="close-player">‹ 戻る</button></div><div class="player-profile"><div class="player-club">${t?h(t.name):'自由契約選手'} <span>${namePos(p.pos)}</span></div><div class="profile-row">${portrait(p)}<div><h2>${themedPlayerName(p)} <small>(${p.age})</small></h2><div class="profile-meta">${positionFull(p.pos)} · ${throwBat(p)} · ${fmtSalary(p.salary)}</div><div class="profile-meta">総合 ${rating(p)} · 愛着 ♥${p.affinity}</div></div></div></div><div class="player-detail-condition">${conditionBar(p)}<p class="tiny">コンディションは現在の疲労度です。投手能力の「体力」とは別に管理されます。</p></div><div class="subtabs detail-tabs">${[['abilities','能力'],['growth','能力推移'],['stats','成績'],['memo','メモ']].map(([key,label])=>`<button class="subtab ${ui.playerDetailTab===key?'active':''}" data-action="detail-tab" data-sub="${key}">${label}</button>`).join('')}</div>${body}`;
  }

  function navbar(){return gameNav()}
  function header(){return gameHeader()}
  function renderStart(){return titleScreen()}
  function teamChoice(t){return `<button class="team-card ${leagueClass(t.league)}" data-action="select-team" data-id="${t.id}">${teamBadge(t)}<div style="min-width:0"><strong>${h(t.name)}</strong><br>${leagueTag(t.league)}</div></button>`}
  function progressButtons(){
    if(game.day>=143)return `<button class="btn primary full" data-action="next-season">🏆 表彰・精算して${game.year+1}年へ進む</button>`;
    const mode=game.playbackMode||'normal',options=[['normal','通常 2秒/日'],['fast','倍速 1秒/日'],['skip','日程スキップ']];
    return `<div class="calendar-playback">
      <div class="small">日程の進行速度（休養日も日付が進みます）</div>
      <div class="calendar-speed">${options.map(([v,text])=>`<button class="chip ${mode===v?'active':''}" data-action="playback-mode" data-mode="${v}" aria-pressed="${mode===v}">${text}</button>`).join('')}</div>
      </div>
      ${advanceTargetRemaining()?`<button class="btn primary full" data-action="resume-calendar">▶ 前回の続きから</button>`:''}
      <div class="actions" style="margin-top:9px"><button class="btn primary" data-action="advance-day">▶ 1日進める</button><button class="btn soft" data-action="advance" data-days="7">7試合</button><button class="btn soft" data-action="advance" data-days="30">30試合</button></div>
      <button class="btn outline full" style="margin-top:9px" data-action="advance" data-days="143">シーズン終了まで進行</button>`;
  }
  function lastGamePanel(){
    const t=myTeam(),g=gameByTeam(t.id);
    if(!g)return `<div class="empty">シーズンはまだ始まっていません。</div>`;
    const opp=getTeam(g.home===t.id?g.away:g.home);
    const myScore=g.home===t.id?g.homeScore:g.awayScore;
    const otherScore=g.home===t.id?g.awayScore:g.homeScore;
    const tone=myScore>otherScore?'green':myScore<otherScore?'red':'';
    const result=myScore>otherScore?'勝利':myScore<otherScore?'敗戦':'引分';
    return `<div class="box-result"><div class="card-flex"><div><span class="tag ${tone}">${result}</span> <span class="small">${g.year}年 第${g.day}戦 / vs ${h(opp.name)}</span><div class="score-big">${myScore} - ${otherScore}</div></div><button class="btn sm outline" data-action="game-details" data-id="${g.id}">詳細を見る</button></div></div>`;
  }
  function homeScreen(){
    const t=myTeam(),ranking=rankings(t.league),position=ranking.findIndex(x=>x.id===t.id)+1;
    const next=game.day>=143?null:game.schedule[game.day].find(m=>m.home===t.id||m.away===t.id);
    const opp=next?getTeam(next.home===t.id?next.away:next.home):null;
    return `<h2 class="page-title">球団ホーム</h2><p class="page-sub">${game.year}年・第${game.day}試合終了 / 全143試合 <span class="tag ${game.day>=143?'yellow':'blue'}">${game.day===143?'シーズン終了':'レギュラーシーズン'}</span></p>
    <div class="grid3" style="margin-bottom:13px"><div class="metric"><div class="lab">順位</div><div class="val">${position}<small style="font-size:13.5px">位</small></div><div class="sub">${leagueTag(t.league)}</div></div><div class="metric"><div class="lab">勝敗</div><div class="val" style="font-size:18.7px">${t.wins}-${t.losses}</div><div class="sub">${t.ties}分 / 勝率 ${pct(t.wins,t.losses)}</div></div><div class="metric"><div class="lab">球団資金</div><div class="val" style="font-size:18.7px">${fmtMoney(t.cash)}</div><div class="sub">年俸総額 ${fmtSalary(payroll(t))}</div></div></div>
    <div class="main-cols"><div><section class="panel"><div class="panel-head"><h3 class="panel-title">${next?'次の対戦':'ペナント終了'}</h3><span class="pill">${getDayText()}</span></div>${next?`<div class="next-match"><div class="match-team">${teamBadge(t)}<strong>${h(t.short)}</strong></div><div class="vs">VS</div><div class="match-team">${teamBadge(opp)}<strong>${h(opp.short)}</strong></div></div><div class="small" style="text-align:center;margin-bottom:13px">${next.home===t.id?'ホーム':'ビジター'}　/　先発予定：${h(getPlayer(t.rotation[t.starterIndex%t.rotation.length])?.name||'未定')}</div>`:`<p class="small">シーズン終了。順位が確定しました。翌シーズンに進むと選手が成長・引退し、新人が補充されます。</p>`}<div class="progress-bar" style="margin-bottom:14px"><div class="progress-inner" style="width:${game.day/143*100}%"></div></div>${progressButtons()}</section>
    <section class="panel"><div class="panel-head"><h3 class="panel-title">直近の試合</h3></div>${lastGamePanel()}</section></div>
    <div><section class="panel"><div class="panel-head"><h3 class="panel-title league-heading ${leagueClass(t.league)}">${leagueName(t.league)}順位表</h3><button class="btn sm outline" data-action="tab" data-tab="standings">すべて見る</button></div>${standingTable(t.league,true)}</section><section class="panel"><div class="panel-head"><h3 class="panel-title">リーグニュース</h3></div>${game.news.slice(0,5).map(e=>`<div class="event">${h(e)}</div>`).join('')}</section></div></div>`;
  }
  function standingTable(league,compact=false){
    const rows=rankings(league);
    return `<div class="table-wrap league-table ${leagueClass(league)}"><table class="data-table"><thead><tr><th>順位・球団</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th>${compact?'':'<th>得点</th><th>失点</th><th>得失点差</th>'}</tr></thead><tbody>${rows.map((t,i)=>`<tr class="${t.id===game.selectedId?'focus':''}"><td class="name"><span class="league-stand-rank">${i+1}.</span> <span class="league-club-name ${leagueClass(t.league)}">${h(t.short)}</span>${i===0&&game.day>0?' 👑':''}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.ties}</td><td class="num-strong">${pct(t.wins,t.losses)}</td>${compact?'':`<td>${t.rs}</td><td>${t.ra}</td><td>${t.rs-t.ra>0?'+':''}${t.rs-t.ra}</td>`}</tr>`).join('')}</tbody></table></div>`;
  }
  function standingsScreen(){
    return `<h2 class="page-title">順位表</h2><p class="page-sub">${game.year}年　第${game.day}/143試合終了</p><div class="control-bar"><div class="chips"><button class="chip league-tab league-east ${ui.league==='E'?'active':''}" data-action="league" data-league="E">東リーグ</button><button class="chip league-tab league-west ${ui.league==='W'?'active':''}" data-action="league" data-league="W">西リーグ</button></div></div><section class="panel league-panel ${leagueClass(ui.league)}"><div class="panel-head"><h3 class="panel-title league-heading ${leagueClass(ui.league)}">${leagueName(ui.league)}</h3><span class="pill">各球団143試合</span></div>${standingTable(ui.league)}<p class="tiny" style="margin:12px 0 0">勝率順、同率時は勝数と得失点差で順位を決定。延長12回で同点の場合は引き分け。</p></section><section class="panel"><h3 class="panel-title">過去のリーグ優勝</h3>${game.history.length?game.history.slice(0,10).map(s=>`<div class="event league-history-row"><b>${s.year}年</b>　${leagueTag('E',true)} ${h(s.east)}　/　${leagueTag('W',true)} ${h(s.west)}</div>`).join(''):'<div class="empty">最初のシーズン終了後に記録されます。</div>'}</section>`;
  }
  function currentSeasonLine(p){
    const st=p.stats;
    return isPitch(p)?`<div class="player-season-line is-pitcher" aria-label="今季投手成績">
      <span class="season-title">今季成績</span><span>登板 <strong>${st.g}</strong></span><span>防御率 <strong>${era(p)}</strong></span><span>勝敗 <strong>${st.w}-${st.l}</strong></span><span>投球回 <strong>${Math.floor(st.outs/3)}.${st.outs%3}</strong></span><span>K <strong>${st.k}</strong></span>
    </div>`:
      `<div class="player-season-line is-batter" aria-label="今季野手成績">
      <span class="season-title">今季成績</span><span>試合 <strong>${st.g}</strong></span><span>打率 <strong>${avg(p)}</strong></span><span>本塁打 <strong>${st.hr}</strong></span><span>打点 <strong>${st.rbi}</strong></span><span>盗塁 <strong>${st.sb}</strong></span>
    </div>`;
  }
  function abilityShort(label,value){return `<span class="quick-ability">${label} <b style="color:${gradeBriefColor(value)}">${gradeBrief(value)}</b></span>`}
  function nextStarterInfo(t){
    repairTeam(t);
    const next=t.rotation.length?getPlayer(t.rotation[t.starterIndex%t.rotation.length]):null;
    return next?`<div class="next-start-alert"><strong>⚾ 次の先発予定：${h(next.name)}（${gradeBrief(rating(next))}）</strong>${currentSeasonLine(next)}<small>ローテーション順を変更すると、次の先発にも反映されます。</small></div>`:'';
  }
  function rosterActions(){return `<div class="roster-fast-actions"><button class="btn outline" data-action="back-to-hq">‹ 本部に戻る</button><button class="btn primary" data-action="advance-day" ${game.day>=143?'disabled':''}>▶ この編成で次の日へ</button></div>`}
  function rosterScreen(){
    const t=myTeam();repairTeam(t);
    const menus=[['lineup','打順'],['rotation','先発'],['players','全選手']];
    return `<div class="roster-screen"><div class="roster-intro"><div><h2 class="page-title">選手・チーム編成</h2><p class="page-sub">${game.year}年 · ${game.day}試合終了時点の今季成績</p></div><button class="btn sm outline" data-action="back-to-hq">‹ 戻る</button></div><div class="control-bar"><div class="chips">${menus.map(([tab,label])=>`<button class="chip ${ui.rosterMode===tab?'active':''}" data-action="roster-mode" data-mode="${tab}">${label}</button>`).join('')}</div><span class="pill">所属 ${own(t).length}/30人</span></div>${ui.rosterMode==='lineup'?lineupScreen(t):ui.rosterMode==='rotation'?rotationScreen(t):playersScreen(t)}${rosterActions()}</div>`;
  }
  function lineupScreen(t){
    const arr=hitters(t).filter(availableForGame).sort((a,b)=>rating(b)-rating(a));
    const fielding=syncLineupFielding(t);
    return `<section class="panel lineup-wrap"><div class="panel-head"><h3 class="panel-title">スターティングメンバー</h3><span class="small">DH制・9人</span></div><p class="small">名前を押すと選手入れ替え、番号横の守備位置を押すと守備変更、▲ ▼で打順変更。能力はS〜F表示。</p>${t.lineup.map((id,i)=>{
      const p=getPlayer(id);
      if(!p)return '';
      const options=arr.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${h(x.name)}（${namePos(x.pos)}）総合${gradeBrief(rating(x))}</option>`).join('');
      return `<div class="lineup-item"><button type="button" class="lineup-n fielding-trigger tier-${fieldingTier(p,fielding[id])}" data-action="fielding-open" data-id="${id}" title="守備位置を変更：${positionFull(fielding[id]||p.pos)}" aria-label="${i+1}番 ${h(p.name)} の守備位置を変更">${i+1}<em>${namePos(fielding[id]||p.pos)}</em></button><div class="lineup-info"><select class="select" aria-label="${i+1}番打者" data-change="lineup" data-slot="${i}">${options}</select><div class="quick-abilities">${abilityShort('総合',rating(p))}${abilityShort('巧打',p.contact)}${abilityShort('長打',p.power)}${abilityShort('走力',p.speed)}${abilityShort('守備',p.defense)}</div></div><div class="lineup-buttons"><button class="btn icon sm outline" data-action="lineup-move" data-slot="${i}" data-direction="-1" ${i===0?'disabled':''} aria-label="打順を上げる">▲</button><button class="btn icon sm outline" data-action="lineup-move" data-slot="${i}" data-direction="1" ${i===8?'disabled':''} aria-label="打順を下げる">▼</button></div>${currentSeasonLine(p)}${conditionBar(p)}</div>`;
    }).join('')}<p class="tiny" style="margin:13px 0 0">※守備適性はメイン100%・サブ82%・適性外55%。DHは守備しません。守備力は相手の安打確率に影響します。</p></section>`;
  }
  function rotationScreen(t){
    const all=pitchers(t).filter(p=>p.pos==='SP'&&availableForGame(p)).sort((a,b)=>rating(b)-rating(a));
    return `${nextStarterInfo(t)}<section class="panel lineup-wrap"><div class="panel-head"><h3 class="panel-title">先発ローテーション</h3><span class="pill">5人制</span></div><p class="small">投手ごとの今季防御率・登板・勝敗を確認しながら、登板順を変更できます。</p>${t.rotation.map((id,i)=>{
      const p=getPlayer(id);if(!p)return '';
      const active=i===t.starterIndex%t.rotation.length;
      return `<div class="lineup-item"><span class="lineup-n" title="先発投手">${i+1}<em>先</em></span><div class="lineup-info"><select class="select" data-change="rotation" data-slot="${i}" aria-label="先発${i+1}番手">${all.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${h(x.name)}（${gradeBrief(rating(x))}）</option>`).join('')}</select><div class="quick-abilities">${abilityShort('総合',rating(p))}${abilityShort('球威',p.stuff)}${abilityShort('制球',p.control)}${abilityShort('体力',p.stamina)}${active?'<span class="tag green">次戦登板</span>':''}</div></div><div class="lineup-buttons"><button class="btn icon sm outline" data-action="rotation-move" data-slot="${i}" data-direction="-1" ${i===0?'disabled':''} aria-label="登板順を上げる">▲</button><button class="btn icon sm outline" data-action="rotation-move" data-slot="${i}" data-direction="1" ${i===t.rotation.length-1?'disabled':''} aria-label="登板順を下げる">▼</button></div>${currentSeasonLine(p)}${conditionBar(p)}</div>`;
    }).join('')}</section>`;
  }
  function playersScreen(t){
    const b=hitters(t).sort((a,b)=>rating(b)-rating(a)),p=pitchers(t).sort((a,b)=>rating(b)-rating(a));
    return `<div class="section-label">野手（${b.length}人）</div>${b.map(x=>playerCard(x,true)).join('')}<div class="section-label">投手（${p.length}人）</div>${p.map(x=>playerCard(x,true)).join('')}`;
  }
  function playerTable(players,pitch,withRelease=false){
    return `<div class="table-wrap"><table class="data-table"><thead><tr><th>選手名</th><th>年齢</th><th>守備</th><th>総合</th>${pitch?'<th>球威</th><th>制球</th><th>スタミナ</th>':'<th>ミート</th><th>パワー</th><th>走力</th><th>守備力</th>'}<th>年俸</th>${withRelease?'<th>操作</th>':''}</tr></thead><tbody>${players.map(p=>`<tr><td class="name">${h(p.name)}</td><td>${p.age}</td><td>${namePos(p.pos)}</td><td class="num-strong">${rating(p)}</td>${pitch?`<td>${p.stuff}</td><td>${p.control}</td><td>${p.stamina}</td>`:`<td>${p.contact}</td><td>${p.power}</td><td>${p.speed}</td><td>${p.defense}</td>`}<td>${fmtSalary(p.salary)}</td>${withRelease?`<td><button class="btn sm danger" data-action="ask-release" data-id="${p.id}">放出</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
  }
  function statScreen(){
    const selectable=[['all','全12球団'],['mine','自球団'],['E','東リーグ'],['W','西リーグ']];
    const players=game.players.filter(p=>p.teamId>=0 && (ui.statsScope==='all'||(ui.statsScope==='mine'?p.teamId===game.selectedId:getTeam(p.teamId).league===ui.statsScope)));
    const batting=ui.statsMode==='bat';
    let filtered=players.filter(p=>batting?!isPitch(p):isPitch(p));
    if(batting)filtered.sort((a,b)=>b.stats.hr-a.stats.hr || b.stats.h-a.stats.h || btrRating(b)-btrRating(a));
    else filtered.sort((a,b)=>b.stats.w-a.stats.w || b.stats.k-a.stats.k || rating(b)-rating(a));
    filtered=filtered.slice(0,30);
    return `<h2 class="page-title">個人成績ランキング</h2><p class="page-sub">毎試合の打席結果を集計して更新します。</p><div class="control-bar"><div class="chips"><button class="chip ${batting?'active':''}" data-action="stats-mode" data-mode="bat">打者</button><button class="chip ${!batting?'active':''}" data-action="stats-mode" data-mode="pitch">投手</button></div><select class="select" data-change="stats-scope">${selectable.map(([id,label])=>`<option value="${id}" ${ui.statsScope===id?'selected':''}>${id==='E'?'🔵 ':id==='W'?'🟡 ':''}${label}</option>`).join('')}</select></div><section class="panel"><div class="panel-head"><h3 class="panel-title">${batting?'打撃成績（本塁打順）':'投手成績（勝利数順）'}</h3><span class="pill">${game.day}/143 試合</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>選手</th><th>球団</th>${batting?'<th>打率</th><th>試合</th><th>打席</th><th>安打</th><th>本塁打</th><th>打点</th><th>盗塁</th>':'<th>防御率</th><th>試合</th><th>投球回</th><th>勝</th><th>敗</th><th>セーブ</th><th>奪三振</th>'}</tr></thead><tbody>${filtered.map(p=>`<tr><td class="name">${h(p.name)}</td><td><span class="league-club-name ${leagueClass(getTeam(p.teamId).league)}">${h(getTeam(p.teamId).short)}</span></td>${batting?`<td>${avg(p)}</td><td>${p.stats.g}</td><td>${p.stats.pa}</td><td>${p.stats.h}</td><td class="num-strong">${p.stats.hr}</td><td>${p.stats.rbi}</td><td>${p.stats.sb}</td>`:`<td>${era(p)}</td><td>${p.stats.g}</td><td>${(p.stats.outs/3).toFixed(1)}</td><td class="num-strong">${p.stats.w}</td><td>${p.stats.l}</td><td>${p.stats.sv}</td><td>${p.stats.k}</td>`}</tr>`).join('')}</tbody></table></div><p class="tiny" style="margin:13px 0 0">打率・防御率などは試作版の簡略ルールに基づく計算です。投球回の端数は内部ではアウト数で管理。</p></section>`;
  }

  // Shared recruitment identity/card: the same portrait, title theme and
  // overall badge will be used for FA, draft and foreign-player markets.
  function recruitmentCandidateCard(p,options={}){
    const action=options.action||'sign';
    const caption=options.actionLabel||'獲得';
    const selectAllowed=options.canSelect!==false;
    const cost=Number.isFinite(options.cost)?options.cost:signingCost(p);
    const feeTitle=options.feeLabel||'契約金';
    const visible=!playerVisualTheme(p).hidden;
    const displayRank=visible?gradeBrief(rating(p)):'???';
    return `<article class="recruit-candidate">
      <div class="recruit-player">
        ${faceMini(p,{overall:true})}
        <div class="recruit-identity">
          <strong>${themedPlayerName(p)}</strong>
          <small>${p.age}歳 · ${positionFull(p.pos)} · ${throwBat(p)}</small>
        </div>
        <div class="recruit-overall" aria-label="総合評価 ${displayRank}"

  // Recorded game tactics only: old saves without logs remain readable.
  function managerMoveLabel(move){
    return ({pinch:'代打',runner:'代走',defense:'守備固め',pitch:'投手交代'})[move.type]||'代打';
  }
  function managerMoveReport(g){
    if(!Array.isArray(g.managerMoves))return '';
    const moves=g.managerMoves;
    const renderMove=move=>{
      const p=getPlayer(move.inId),t=getTeam(move.teamId);
      return `<div class="manager-move-row">
        ${p?faceMini(p):'<span class="manager-move-fallback">⚾</span>'}
        <div><strong>${move.inning}回${h(move.side)} · ${h(t?.short||'球団')} · ${managerMoveLabel(move)} ${h(move.inName)}</strong>
        <small>${h(move.outName)}に代わって出場 · ${h(move.role||'選手')}${move.type==='pitch'&&move.midInning&&Number.isFinite(move.pitchCount)?` · ${move.pitchCount}球で交代${move.reason?' · '+h(move.reason):''}`:''}</small></div>
      </div>`;
    };
    return `<section class="panel manager-match-report">
      <div class="panel-head"><h3 class="panel-title">BENCH REPORT · 監督の采配記録</h3>
        <span class="pill">${moves.length}件</span></div>
      ${moves.length?moves.slice(0,2).map(renderMove).join(''):
        '<p class="small">この試合では選手交代の記録がありません。</p>'}
      ${moves.length>2?`<details class="manager-move-details">
        <summary aria-label="残りの采配記録を開く・閉じる">
          <span class="manager-details-closed">詳細を開く（残り${moves.length-2}件）</span>
          <span class="manager-details-open">詳細を閉じる</span>
          <span class="manager-details-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="manager-move-more">${moves.slice(2).map(renderMove).join('')}</div>
      </details>`:''}
      <p class="tiny">実際に行われた代打・代走・守備固め・投手交代を記録しています。</p>
    </section>`;
  }
  function matchReportBody(g){
    const home=getTeam(g.home),away=getTeam(g.away),n=Math.max(g.inningsH.length,g.inningsA.length);
    const boxRows=(from,to,totalColumn)=>[[away,g.inningsA,g.awayScore],[home,g.inningsH,g.homeScore]].map(([t,a,total])=>
      `<tr><th class="watch-team ${leagueClass(t.league)}">${h(t.short)}</th>${Array.from({length:to-from+1},(_,i)=>`<td class="${a[from+i-1]==null?'':'played'}">${a[from+i-1]==null?'–':a[from+i-1]}</td>`).join('')}${totalColumn?`<td class="watch-total">${total}</td>`:''}</tr>`).join('');
    const scores=`<table class="watch-table result-table"><thead><tr><th>球団</th>${Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join('')}<th>計</th></tr></thead><tbody>${boxRows(1,9,true)}</tbody></table>
      ${n>9?`<div class="watch-extra-label">延長戦</div><table class="watch-table watch-extra-table"><thead><tr><th>球団</th>${Array.from({length:n-9},(_,i)=>`<th>${i+10}</th>`).join('')}</tr></thead><tbody>${boxRows(10,n,false)}</tbody></table>`:''}`;
    let box='';
    if(g.box){
      const hitterRows=(teamId)=>g.box.bat.filter(v=>v.teamId===teamId).map(v=>`<tr><td class="name">${h(getPlayer(v.id)?.name||'選手')}</td><td>${v.ab}</td><td>${v.h}</td><td>${v.hr}</td><td>${v.rbi}</td><td>${v.bb}</td></tr>`).join('');
      const pitcherRows=(teamId)=>g.box.pitch.filter(v=>v.teamId===teamId).map(v=>`<tr><td class="name">${h(getPlayer(v.id)?.name||'投手')}</td><td>${Math.floor(v.outs/3)}.${v.outs%3}</td><td>${v.pitches??'–'}</td><td>${v.h}</td><td>${v.er}</td><td>${v.k}</td><td>${v.bb}</td></tr>`).join('');
      const ownId=game.selectedId;
      const cards=[ownId,ownId===home.id?away.id:home.id].filter(id=>id===home.id||id===away.id);
      box=cards.map((tid,index)=>`<${index?'details':'section'} class="panel"><${index?'summary':'h3'} class="panel-title">${h(getTeam(tid).name)} · 今日の個人成績 ${index?'（タップして表示）':''}</${index?'summary':'h3'}><div class="section-label review-section-heading hitter-heading" style="margin-top:9px">野手</div><div class="table-wrap"><table class="data-table review-stat-table hitter-stats"><thead><tr><th>選手</th><th>打数</th><th>安打</th><th>本</th><th>打点</th><th>四球</th></tr></thead><tbody>${hitterRows(tid)||'<tr><td colspan="6">出場なし</td></tr>'}</tbody></table></div><div class="section-label review-section-heading pitcher-heading">投手</div><div class="table-wrap"><table class="data-table review-stat-table pitcher-stats"><thead><tr><th>選手</th><th>投球回</th><th>球数</th><th>被安打</th><th>自責</th><th>奪三振</th><th>四球</th></tr></thead><tbody>${pitcherRows(tid)||'<tr><td colspan="7">出場なし</td></tr>'}</tbody></table></div></${index?'details':'section'}>`).join('');
    }else box='<p class="small">旧バージョンの試合には個別の試合成績が保存されていません。</p>';
    return `<section class="panel"><div class="panel-head"><h3 class="panel-title">イニング別スコア</h3><span class="pill">${n}回</span></div><div class="table-wrap result-table-wrap">${scores}</div><div class="divider"></div><h3 class="panel-title">主な出来事</h3>${g.events.length?g.events.map(e=>`<div class="event">${h(e)}</div>`).join(''):'<div class="event">本塁打などの特記事項はありません。</div>'}<div class="small" style="margin-top:12px">先発：${h(getPlayer(g.spAway)?.name||'選手')} / ${h(getPlayer(g.spHome)?.name||'選手')}</div></section>${managerMoveReport(g)}${box}`;
  }
  function matchReviewScreen(){

    if(!r||!g)return `<section class="panel"><h2>試合結果を読み込めませんでした</h2><button class="btn primary full" data-action="finish-review">本部へ進む</button></section>`;

      ${matchReportBody(g)}
      <button class="btn primary review-game-btn" data-action="finish-review">${game.day>=143?'結果を確認してシーズン終了へ':'結果を確認して次の日へ　›'}</button>
      <p class="review-help">結果確認中は日付を切り替えません。下のボタンで進んでください。</p></div>`;

  function resultModal(){

    return `<div class="overlay" data-action="close-overlay"><div class="dialog" role="dialog" aria-modal="true" data-stop="true"><h3>${h(c.title)}</h3><p>${h(c.body)}</p><div class="actions" style="margin-top:20px"><button class="btn outline" data-action="close-modal">キャンセル</button><button class="btn ${c.danger?'danger':'primary'}" data-action="confirm">実行する</button></div></div></div>`;

  function teamSwitchModal(){
    if(ui.confirm?.type!=='switch')return '';
    return `<div class="overlay" data-action="close-overlay"><div class="dialog" style="max-width:630px;max-height:90vh;overflow:auto" data-stop="true"><div class="panel-head"><h3 class="panel-title">操作する球団を選択</h3><button class="btn sm outline" data-action="close-modal">閉じる</button></div><p>同じセーブデータの中で担当球団を切り替えます。</p><div class="team-choice">${game.teams.map(teamChoice).join('')}</div></div></div>`;
  }
  function render(){
    const app=$('#app');if(!app)return;
    if(ui.page==='title'){app.innerHTML=titleScreen();return}
    if(ui.page==='setup'){app.innerHTML=setupScreen();return}
    const screens={hq:frontOfficeScreen,team:teamScreen,roster:rosterScreen,business:businessScreen,records:recordScreen,home:frontOfficeScreen,standings:standingsScreen,stats:statScreen,market:marketScreen,finance:financeScreen};
    app.innerHTML=`<div class="app-shell ${ui.busy&&ui.autoDay?'auto-tappable':''}">${header()}<main class="main">${game.pendingEvent?injuryAlertScreen():game.pendingReview?matchReviewScreen():ui.autoDay?(ui.dateIntro?calendarDateIntroScreen(ui.autoDay):ui.autoDay.type==='game'?dailyGameScreen(ui.autoDay):dailyNewsScreen(ui.autoDay)):game.pendingMonth?monthlyReviewScreen():ui.monthHistory?monthlyReviewScreen(true):(ui.playerDetail!=null?playerDetails():(screens[ui.tab]||frontOfficeScreen)())}</main>${game.pendingEvent||game.pendingReview||game.pendingMonth||ui.autoDay||ui.monthHistory?'':navbar()}</div>${ui.confirm?.type==='switch'?teamSwitchModal():confirmModal()}${game.pendingReview?'':resultModal()}${ui.busy&&!ui.autoDay?`<div class="calendar-running"><strong>${getDayText()}</strong><small>${game.day}/143試合</small><button class="btn outline" data-action="pause-calendar">一時停止</button></div>`:''}${ui.busy&&ui.autoDay&&ui.autoPaused?'<div class="auto-paused-toolbar" role="group" aria-label="一時停止中の操作"><span>⏸ 一時停止中</span><div class="auto-paused-actions"><button class="btn primary sm" data-action="pause-calendar">▶ 再開</button><button class="btn outline sm" data-action="auto-return-hq">⌂ 本部に戻る</button></div></div>':''}<input id="import-save-file" type="file" accept=".json,application/json" hidden>`;
  }
  function showToast(message,error=false){
    document.querySelector('.message')?.remove();
    const e=document.createElement('div');e.className='message'+(error?' err':'');e.textContent=message;document.body.appendChild(e);
    setTimeout(()=>e.remove(),3000);
  }
  async function advance(days){
    if(storageFailure){showToast('保存エラーのため進行を停止しています。バックアップを書き出してください。',true);return;}
    if(ui.busy||game.pendingReview)return;
    if(game.day>=143){showToast('今季は終了しています');return}
    ui.busy=true;render();
    await new Promise(resolve=>setTimeout(resolve,35));
    const count=Math.min(Math.max(1,Number(days)||1),143-game.day);
    for(let i=0;i<count;i++)processDay();
    const g=gameByTeam(game.selectedId);
    if(g)game.pendingReview={year:game.year,day:g.day,gameId:g.id,count};
    save();ui.busy=false;ui.detail=null;ui.playerDetail=null;render();
    window.scrollTo({top:0,behavior:'instant'});
    if(!g)showToast('試合結果を取得できませんでした',true);
  }
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b)return;
    if(event.target.closest('[data-stop]')&&b.dataset.action==='close-overlay')return;
    const act=b.dataset.action;
    if(ui.busy)return;
    if(ui.page==='game'&&game?.pendingReview){
      if(act==='finish-review'){
        game.pendingReview=null;ui.tab='hq';ui.playerDetail=null;ui.detail=null;save();render();window.scrollTo({top:0,behavior:'instant'});
        if(game.day===143)showToast(`${game.year}年の全日程が終了しました`);
      }
      return;
    }
    if(act==='back-to-hq'){ui.tab='hq';ui.playerDetail=null;render();window.scrollTo({top:0,behavior:'instant'});return}
    if(act==='new-slot'){openSlot(b.dataset.slot,true);return}
    if(act==='continue-slot'){openSlot(b.dataset.slot,false);return}
    if(act==='title'){save();ui.page='title';ui.playerDetail=null;ui.detail=null;ui.confirm=null;render();window.scrollTo(0,0);return}
    if(act==='setup-league'){ui.setupLeague=b.dataset.league;ui.selectedTeam=leagueTeams(ui.setupLeague)[0].id;render();return}
    if(act==='pick-setup-team'){ui.selectedTeam=Number(b.dataset.id);render();return}
    if(act==='team-color'){getTeam(ui.selectedTeam).color=b.dataset.color;save();render();return}
    if(act==='finish-setup'){
      game.selectedId=Number(ui.selectedTeam);game.started=true;ui.page='game';ui.tab='hq';ui.playerDetail=null;
      save();render();window.scrollTo(0,0);showToast('GM就任、おめでとうございます');return;
    }
    if(act==='select-team'){
      game.selectedId=Number(b.dataset.id);game.started=true;ui.confirm=null;ui.tab='hq';ui.page='game';save();render();window.scrollTo({top:0});return;
    }
    if(act==='team-sub'){ui.teamSub=b.dataset.sub;render();return}
    if(act==='record-sub'){ui.recordSub=b.dataset.sub;render();return}
    if(act==='business-sub'){ui.businessSub=b.dataset.sub;render();return}
    if(act==='player-detail'){ui.playerDetail=Number(b.dataset.id);ui.playerDetailTab='abilities';render();window.scrollTo(0,0);return}
    if(act==='detail-tab'){ui.playerDetailTab=b.dataset.sub;render();window.scrollTo(0,0);return}
    if(act==='close-player'){ui.playerDetail=null;render();return}
    if(act==='tab'){
      ui.playerDetail=null;ui.tab=b.dataset.tab;if(b.dataset.roster)ui.rosterMode=b.dataset.roster;
      if(ui.tab==='market'){ui.businessSub='market';ui.tab='business'}
      render();window.scrollTo({top:0,behavior:'instant'});return;
    }
    if(act==='roster-mode'){ui.rosterMode=b.dataset.mode;render();return}
    if(act==='league'){ui.league=b.dataset.league;render();return}
    if(act==='stats-mode'){ui.statsMode=b.dataset.mode;render();return}
    if(act==='advance'){void advance(b.dataset.days);return}
    if(act==='advance-day'){void advance('day');return}
    if(act==='next-season'){
      if(game.day!==143)return;
      ui.confirm={type:'next',title:`${game.year+1}年へ進みますか？`,body:'選手の成長・衰退・引退、新人補充、年俸精算を実行します。このシーズンの個人成績はリセットされます。',danger:false};render();return;
    }
    if(act==='lineup-move'||act==='rotation-move'){
      const arr=act==='lineup-move'?myTeam().lineup:myTeam().rotation;
      const a=Number(b.dataset.slot),c=a+Number(b.dataset.direction);
      if(c<0||c>=arr.length)return;
      [arr[a],arr[c]]=[arr[c],arr[a]];save();render();return;
    }
    if(act==='game-details'){ui.detail=Number(b.dataset.id);render();return}
    if(act==='close-modal'||act==='close-overlay'){ui.detail=null;ui.confirm=null;pendingImport=null;render();return}
    if(act==='switch-team'){ui.confirm={type:'switch'};render();return}
    if(act==='sign'){signPlayer(b.dataset.id);return}
    if(act==='ask-release'){
      const p=getPlayer(b.dataset.id);
      ui.confirm={type:'release',id:p.id,title:'選手を自由契約にしますか？',body:`${p.name}を放出します。獲得時の契約金は戻りません。`,danger:true};render();return;
    }
    if(act==='export-save'){
      const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const anchor=document.createElement('a');anchor.href=url;anchor.download=`PENNANT_LAB_${game.year}_day${game.day}_save.json`;
      document.body.appendChild(anchor);anchor.click();anchor.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast('バックアップを保存しました');return;
    }
    if(act==='import-save'){
      $('#import-save-file')?.click();return;
    }
    if(act==='ask-reset'){
      ui.confirm={type:'reset',title:'ゲームを最初からやり直しますか？',body:'現在のセーブデータ（シーズン成績、選手、球団資金など）がすべて消えます。元には戻せません。',danger:true};render();return;
    }
    if(act==='confirm'){
      const c=ui.confirm;ui.confirm=null;

  /* PENNANT LAB v0.9.0: manager employment, GM policy and tactical AI */
  const MANAGER_TACTICS=[
    ['bullpen','継投','早めの継投','先発を引っ張る'],
    ['steal','盗塁','積極的に走る','盗塁を抑える'],
    ['bunt','バント','送りバントを増やす','強攻を優先'],
    ['defense','守備重視','守備を堅める','打撃を優先'],
    ['youth','若手起用','若手の経験を重視','実績を優先'],
    ['pinch','代打','積極的に代打','先発を信頼']
  ];
  const MANAGER_STYLES=['堅実','積極','育成重視','守備重視','データ重視','勝負師'];
  const MANAGER_NAMES=['藤原','早川','本田','桐山','古川','浅野','山根','坂井','丸山','黒崎','工藤','城島','森下','片岡','永井','石原','小沢','村瀬'];
  const MANAGER_GIVEN=['修一','大輔','俊夫','孝之','誠一','隆','浩二','慎二','秀樹','雅彦'];
  function managerSeed(teamId,year,slot){
    return ((Number(teamId)+3)*73856093+(Number(year)-2000)*19349663+(slot+4)*83492791)>>>0;
  }
  function makeManager(teamId,year,slot=0){
    const seed=managerSeed(teamId,year,slot);
    const tendency={};
    for(let i=0;i<MANAGER_TACTICS.length;i++)tendency[MANAGER_TACTICS[i][0]]=22+((seed>>>((i%4)*7+i*37))%57);
    return {
      id:`mgr-${teamId}-${year}-${slot}`,
      name:MANAGER_NAMES[seed%MANAGER_NAMES.length]+' '+MANAGER_GIVEN[(seed>>>7)%MANAGER_GIVEN.length],
      age:40+(seed%23),style:MANAGER_STYLES[(seed>>>3)%MANAGER_STYLES.length],
      leadership:48+((seed>>>4)%43),tendency,trust:70,discontent:0,
      salary:r2(.08+((seed>>>13)%17)*.01),contractYears:slot===0?2:2+((seed>>>19)%2),
      joinedYear:year
    };
  }
  function ensureManagers(){
    if(!Array.isArray(game.managerHistory))game.managerHistory=[];
    for(const team of game.teams){
      if(!team.manager||typeof team.manager!=='object')team.manager=makeManager(team.id,game.year,0);
      if(!team.gmOrders||typeof team.gmOrders!=='object')team.gmOrders={};
      for(const [key] of MANAGER_TACTICS){
        if(!['auto','attack','safe'].includes(team.gmOrders[key]))team.gmOrders[key]='auto';
        if(!Number.isFinite(team.manager.tendency?.[key])){
          if(!team.manager.tendency)team.manager.tendency={};
          team.manager.tendency[key]=50;
        }
      }
      if(!Number.isFinite(team.manager.discontent))team.manager.discontent=0;
      if(!Number.isFinite(team.manager.trust))team.manager.trust=70;
      if(!Number.isFinite(team.manager.contractYears))team.manager.contractYears=1;
    }
  }
  function managerDecision(team,key){
    const m=team.manager;if(!m)return 50;
    const own=clamp(Number(m.tendency?.[key]??50),0,100);
    const order=team.gmOrders?.[key]||'auto';
    if(order==='auto')return own;
    return clamp(Math.round(own*.15+(order==='attack'?88:12)*.85),0,100);
  }
  function managerDisagreement(team){
    const m=team.manager;if(!m)return 0;
    return MANAGER_TACTICS.reduce((sum,[key])=>{
      const order=team.gmOrders?.[key];
      if(order==='auto')return sum;
      return sum+Math.max(0,Math.abs((order==='attack'?88:12)-Number(m.tendency[key]))-32);
    },0);
  }
  function managerDailyRelations(date){
    for(const team of game.teams){
      const m=team.manager;if(!m)continue;
      const strain=managerDisagreement(team);
      m.discontent=clamp(Math.round((m.discontent+(strain?Math.min(.7,strain*.004):-.12))*100)/100,0,100);
      m.trust=clamp(Math.round((70-m.discontent*.6)*10)/10,10,95);
      if(m.discontent>=60&&m.resignationNoticeYear!==game.year){
        m.resignationNoticeYear=game.year;
        if(team.id===game.selectedId)pushNews(`【監督報告】${m.name}監督がGM方針への不満から辞任の意向を伝えました。`,date);
      }
    }
  }

  /* A stable fictional portrait and familiar S–F scout grades for every manager. */
  function managerPortrait(manager,teamId){
    const id=String(manager.id||manager.name).split('').reduce((n,ch)=>((n*31+ch.charCodeAt(0))>>>0),17);
    return `<span class="manager-portrait">${renderFaceArtwork({
      id:id||1,name:manager.name,age:manager.age||48,pos:'OF',teamId
    },{role:'manager'})}</span>`;
  }
  function managerRatings(m){
    const lead=Number(m.leadership)||60,t=m.tendency||{};
    const seed=String(m.id||m.name).split('').reduce((v,c)=>((v*33+c.charCodeAt(0))>>>0),23);
    const bias=n=>((seed>>n)%15)-7;
    return {
      field:clamp(Math.round(lead*.58+(Number(t.youth)||50)*.22+(Number(t.defense)||50)*.20+bias(0)),38,96),
      pitch:clamp(Math.round(lead*.68+(Number(t.bullpen)||50)*.32+bias(5)),38,96),
      tactical:clamp(Math.round(lead*.77+(Number(t.bunt)||50)*.12+(Number(t.steal)||50)*.11+bias(10)),38,96),
      development:clamp(Math.round(lead*.40+(Number(t.youth)||50)*.60+bias(14)),38,96)
    };
  }

    e.stopImmediatePropagation();
    if(ui.busy||game.pendingEvent||game.pendingMonth||game.pendingReview)return;
    const key=el.dataset.key,order=el.value,t=myTeam();
    if(!MANAGER_TACTICS.some(x=>x[0]===key)||!['auto','attack','safe'].includes(order))return;
    t.gmOrders[key]=order;save();render();showToast('GM方針を保存しました');
  },true);

  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');
    if(el?.dataset.action!=='watch-skip'||!ui.busy||!ui.watchGame)return;
    e.stopImmediatePropagation();
    ui.watchSkip=true;ui.autoWait?.skip();
  },true);
  const appRoot=document.querySelector('#app');
  if(appRoot)appRoot.innerHTML='<div class="title-screen"><h2>セーブデータを読み込んでいます…</h2></div>';
  (async()=>{
    try{await load();ensureGameExtras();ui.page='title';render();}
    catch(e){
      console.warn('Unable to initialize saved data:',e);
      if(appRoot)appRoot.innerHTML='<div class="title-screen"><h2>セーブを読み込めません</h2><p>ブラウザの保存領域にアクセスできないか、データ形式が一致しません。データは自動削除されていません。</p></div>';
    }
  })();
  // Small read-only inspection surface for automated tests in development.
  window.PennantLab={getSnapshot:()=>({year:game.year,day:game.day,selectedId:game.selectedId,teams:game.teams.map(t=>({id:t.id,name:t.name,league:t.league,w:t.wins,l:t.losses,t:t.ties,cash:t.cash,lineup:[...t.lineup],rotation:[...t.rotation]})),playerCount:game.players.length,games:game.games.length,history:[...game.history],schedule:game.schedule.map(day=>day.map(m=>({...m})))}),advance,reset:()=>{localStorage.removeItem(KEY());buildFresh();ui.page='title';render()}};
})();

</script></body>
</html>
