/* PENNANT LAB 0.2 · Navy / gold GM interface */
:root{--bg:#060c17;--paper:#15243a;--ink:#f4f6fc;--muted:#9daabf;--border:#344358;--blue:#399bd7;--blueDark:#101e36;--green:#36c9a7;--red:#ee6767;--gold:#d7aa34;--shadow:0 9px 28px #0003}
*{box-sizing:border-box}
html{background:#060c17;scroll-padding-top:85px}
body{background:#060c17;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif}
button,input,textarea,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #edca5f;outline-offset:2px}
.app-shell{max-width:850px;padding-bottom:calc(90px + env(safe-area-inset-bottom));background:#070b12}
.top{position:sticky;top:0;z-index:35;padding:0;background:linear-gradient(118deg,#12203d,#1d3157 54%,#101c44);border-bottom:1px solid #775d1d;box-shadow:0 6px 18px #0007}
.top-in{max-width:850px}
.top-high{padding:13px 16px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:70px}
.app-brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{font-size:25px;border-radius:50%;width:37px;height:37px;display:grid;place-items:center;color:#fbf3d0;border:1px solid #d3a334;background:#18294d;box-shadow:inset 0 0 14px #ddad3526}
.app-brand b{font-size:16.6px;letter-spacing:-.5px;line-height:1.1;white-space:nowrap;font-weight:950}
.app-brand small{font-size:7.3px;letter-spacing:1.3px;color:#88aed7;display:block;white-space:nowrap;font-weight:800;margin-top:4px}
.brand-gold,.gold-text{color:#e8bd4b}
.head-metrics{display:flex;align-items:center;justify-content:flex-end;gap:13px;text-align:center}
.head-metrics div{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.head-metrics small{font-size:9.4px;color:#d5c5a1;font-weight:800}
.head-metrics strong{font-size:14.6px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.head-metrics i{font-style:normal;font-size:9.4px;color:#9aa3c7}
.top-low{background:#0b1630ad;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:6px 15px;font-size:11.4px;white-space:nowrap}
.head-link{border:0;background:transparent;color:#cad6e8;font-size:10.4px;min-width:0;padding:4px 0}
.top-low strong{font-size:12.5px;font-weight:800}
.top-low .gold-text{font-weight:800;font-size:12.5px}
.main{padding:15px 14px 30px;min-height:calc(100vh - 205px)}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;max-width:850px;width:100%;border-top:1px solid #323c54;box-shadow:0 -8px 18px #0008;background:linear-gradient(180deg,#141e35,#050913);padding:7px 4px calc(5px + env(safe-area-inset-bottom));z-index:50}
.nav-btn{min-width:0;flex:1;font-size:11.4px;color:#a1a4b2;font-weight:750;padding:3px 0;gap:2px}
.nav-btn .nav-ico{font-size:23.9px;line-height:25px;width:42px;height:32px;display:grid;place-items:center;color:#9aa1ae;filter:grayscale(1)}
.nav-btn.active{color:#e7ba42}
.nav-btn.active .nav-ico{background:#7e632331;border:1px solid #846d35;border-radius:999px;color:#f4c342;filter:none;padding:0}
@media(min-width:850px){.app-shell{padding-bottom:100px}.top{padding:0}.bottom-nav{position:fixed;border-radius:0;padding:7px 4px 6px;max-width:850px;box-shadow:0 -8px 18px #0008}.nav-btn{font-size:11.4px;padding:3px 0;flex-direction:column}.nav-btn .nav-ico{font-size:23.9px}}
.page-title,.screen-top h2{font-size:22.9px;font-weight:900;color:#fff;margin:0 0 5px}
.screen-top{padding:11px 5px 10px}
.screen-top .small{margin:0}
.eyebrow{font-size:10.4px;color:#d4a93b;letter-spacing:2.3px;font-weight:900;margin-bottom:5px}
.panel{background:linear-gradient(147deg,#192a43,#122137);border:1px solid #364963;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 5px 18px #0002;color:#edf2fc}
.panel h2,.panel h3{color:#f4f5fa}
.panel-head{margin-bottom:13px}
.panel-title{color:#fff;font-size:15.6px}
.small,.tiny,.page-sub{color:#aab8cc}
.page-sub{margin-bottom:13px}
.pill{background:#193b45;color:#54dbbb;border:1px solid #2b5c61}
.metric{background:#1e324a;border:1px solid #31465b;color:#f7f8fb}
.metric .lab,.metric .sub{color:#a9b5c9}
.metric .val{color:#f3f6fe}
.divider{background:#33465c}
.btn{background:#20324a;color:#f1f3f9;border-radius:9px}
.btn.primary{background:linear-gradient(130deg,#f0c34f,#c99b21);color:#172139;box-shadow:0 0 13px #daa83422}
.btn.soft{background:#183652;color:#92c9f4}
.btn.outline{background:#17263b;border:1px solid #42556c;color:#d7e2f0}
.btn.danger{background:#422b37;color:#f499a1}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.actions{gap:7px}
.grid3,.grid2{gap:8px}
.grid3 .metric{padding:10px}
.grid3 .metric .val{font-size:19.8px}
.table-wrap{overflow-x:auto;border-radius:8px;max-width:100%}
.data-table{color:#eef1f9}
.data-table th{background:#101d30;color:#9aaabd;border-color:#344356}
.data-table td{border-bottom:1px solid #354459}
.data-table tr.focus{background:#263748}
.data-table tr.focus td:first-child{border-left:3px solid #dda52c}
.data-table .num-strong{color:#e6ba4e}
.chip,.subtab{background:#152339;color:#aebad1;border:1px solid #283a55;font-weight:800}
.chip.active,.subtab.active{background:linear-gradient(140deg,#deb13e,#bd8d23);color:#101829;border-color:#d4a635}
.select{border-color:#405470;background:#14273e;color:#eef3fc;max-width:100%}
.lineup-item{border-color:#34435b;gap:8px}
.lineup-n{background:#253e5b;color:#e8b842}
.lineup-meta{color:#a6b4c8}
.notice{background:#0e2a31!important;color:#a8e4d3!important;border-color:#215c5e!important}
.event{border-color:#31435b;color:#c6d2e5}
.empty{color:#a4b1c6}
.box-result{background:#111f33;border:1px solid #33445f;border-radius:9px;padding:12px}
.score-big{color:#fff}
.tag{background:#263958!important;color:#d0e5fa!important}
.tag.green{background:#153d35!important;color:#60d7b1!important}
.tag.red{background:#502c3b!important;color:#f38c9c!important}
.progress-bar{background:#2f3d55}.progress-inner{background:linear-gradient(90deg,#ce9326,#f4cc5e)}
.overlay{background:#050917c7;z-index:90}.dialog{background:#15243b;border:1px solid #50617a;color:#f5f6fa}.dialog h3{color:#fff}.dialog p{color:#b1c0d5}.loading{background:#0b1323e8;color:#eac15b}
.team-choice{grid-template-columns:repeat(2,minmax(0,1fr))}
.team-card{background:#182a43;border-color:#384b64;color:#f2f6fa}
.team-card span{color:#adc0d8}
/* 5-tab screens */
.subtabs{display:flex;gap:5px;overflow-x:auto;padding:0 0 11px;margin-bottom:8px;scrollbar-width:thin;white-space:nowrap}
.subtab{border-radius:7px;padding:10px 12px;min-height:39px;font-size:12.5px;flex:0 0 auto}
.stack{display:flex;flex-direction:column;gap:0}
.roster-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 16px;padding:15px 9px;border:1px solid #354e67;background:#162941;border-radius:13px}
.roster-summary>div{text-align:center;min-width:0;display:flex;flex-direction:column;gap:7px}
.roster-summary small{font-size:9.4px;color:#a1b2c7}
.roster-summary b{font-size:14.6px;color:#e1b947;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster-summary b span{color:#75889f;font-size:10.4px}
.section-label{font-size:13.5px;font-weight:900;color:#e8b747;border-bottom:1px solid #534520;padding:17px 3px 11px;margin-bottom:12px}
.player-card{background:linear-gradient(150deg,#1e3450,#14243c);border:1px solid #40516b;border-radius:14px;margin-bottom:11px;padding:11px 13px;color:#f4f6fc;box-shadow:0 4px 13px #0003}
.player-row{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:0;color:inherit;text-align:left;padding:0}
.avatar{flex:0 0 54px;width:54px;height:54px;border:3px solid var(--avatar-color);background:radial-gradient(circle at 45% 35%,#496b79,#14263b 72%);color:#f3dfb0;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-size:25px}
.avatar b{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border-radius:13px;background:var(--avatar-color);color:#0a182a;padding:0 8px;font-size:13.5px;min-width:32px;text-align:center}
.player-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.player-name{font-size:16.6px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-name small{font-size:11.4px;color:#b5bfd0}
.player-caption{font-size:11.4px;color:#a6b9ce;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-affinity{font-weight:950;font-size:15.6px;color:#e8af4c;white-space:nowrap}
.chev{font-size:25px;color:#8394ad;margin-left:1px}

/* Keep position + handedness visible inside the same swap control on narrow phones. */
.lineup-wrap .lineup-item{grid-template-columns:38px minmax(0,1fr) auto;column-gap:5px}
.lineup-wrap .lineup-n{width:38px;height:30px;display:flex;justify-content:center;align-items:center;gap:2px;white-space:nowrap;font-size:11.4px}
.lineup-wrap .lineup-n em{font-size:10.4px;font-style:normal;color:#f1d995}
/* Balanced roster identity: emphasize the player's portrait and name only. */
.player-pick-btn.roster-pick-btn{min-height:68px;align-items:center;padding:7px 9px;background:linear-gradient(110deg,#29415b 0%,#20354e 70%,#1a3048 100%);border-color:#58738d}
.roster-pick-btn .roster-pick-content{display:flex;flex:1;flex-direction:column;min-width:0;gap:3px}
.roster-pick-btn .face-label{display:inline-flex;align-items:center;gap:10px;min-width:0;max-width:100%;font-size:15.6px;font-weight:850;line-height:1.25}
.roster-pick-btn .face-label .face-mini{width:42px;height:42px;flex:0 0 42px}
.roster-pick-btn .face-label>span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster-pick-btn .roster-pick-meta{display:flex;flex-wrap:wrap;column-gap:7px;row-gap:2px;color:#aebed3;font-size:10.4px;line-height:1.3;font-weight:400}
.roster-pick-btn .roster-pick-meta>span{white-space:nowrap}
.roster-pick-btn .roster-pick-hand{color:#d5deeb;font-weight:700}
@media(max-width:390px){
  .player-pick-btn.roster-pick-btn{min-height:64px;padding:6px 7px}
  .roster-pick-btn .face-label{font-size:14.2px;gap:8px}
  .roster-pick-btn .face-label .face-mini{width:38px;height:38px;flex-basis:38px}
  .roster-pick-btn .roster-pick-meta{font-size:9.4px;column-gap:5px}
}

/* Editable defensive roles: a compact role chip opens the positional suitability matrix. */
.lineup-wrap .fielding-trigger{position:relative;border:1px solid #59647d;cursor:pointer;min-height:36px;padding:2px 3px}
.lineup-wrap .fielding-trigger:focus-visible{outline:2px solid #efc35a;outline-offset:2px}
.lineup-wrap .fielding-trigger::after{content:'⌄';position:absolute;bottom:0;right:2px;font-size:9px;color:#91b9dd}
.lineup-wrap .fielding-trigger.tier-sub{border-color:#d8aa4c;background:#49402a}
.lineup-wrap .fielding-trigger.tier-off{border-color:#af656a;background:#502f38;color:#ffb5b9}
.fielding-dialog{width:min(95vw,540px);max-height:88dvh;background:linear-gradient(130deg,#1a3049,#111e31);border:1px solid #8e7137;border-radius:18px;padding:16px;color:#f7f8fb;display:flex;flex-direction:column;box-shadow:0 25px 60px #000b}
.fielding-dialog .swap-head h3{margin:0;color:#e9bf57}
.fielding-dialog .small{margin:8px 0 3px;font-size:12px;line-height:1.5}
.fielding-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;overflow-y:auto;min-height:0;margin-top:9px}
.fielding-choice{display:flex;flex-direction:column;gap:5px;background:#1d344d;border:1px solid #51647c;color:#f3f6fa;border-radius:10px;padding:9px;min-width:0;text-align:left;cursor:pointer}
.fielding-choice:hover:not(:disabled){border-color:#e6c06b;background:#2a405a}
.fielding-choice.chosen{border-color:#d8b04e;background:#454128}
.fielding-choice.sub{border-color:#856f42}

.fielding-choice:disabled{opacity:.8;cursor:default}
.fielding-choice-heading{display:flex;align-items:center;justify-content:space-between;gap:7px}
.fielding-choice-heading strong{font-size:13px}
.fielding-choice-heading em{font-style:normal;color:#dbbb68;font-size:10px}
.fielding-choice small{font-size:10px;color:#b9c9da;line-height:1.45;overflow-wrap:anywhere}

.calendar-current-date{color:#e9c768;font-size:12.5px;font-weight:800;margin:8px 0}
.calendar-months{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.calendar-month{border:1px solid #3b5068;border-radius:10px;padding:9px 11px;background:#16293f}
.calendar-month>summary{cursor:pointer;color:#f4d380;font-weight:850;font-size:14px}
.calendar-day{display:grid;grid-template-columns:99px minmax(0,1fr) auto;gap:6px;align-items:center;border-bottom:1px solid #30425b;padding:6px 1px;font-size:11px;color:#a3b7d0}
.calendar-day:last-child{border:0}.calendar-day.game{color:#e8f0fc}.calendar-day.midseason{color:#e1be5c}
.month-review{display:flex;flex-direction:column;gap:15px}.month-review h2{margin:0;color:#e9bf57;font-size:23px}
.monthly-skill-row{display:grid;grid-template-columns:minmax(0,1fr) .7fr .95fr .3fr;gap:5px;padding:9px 1px;border-bottom:1px solid #3c4b62;font-size:11px}
.monthly-skill-row .up{color:#60dbbc}.monthly-skill-row .down{color:#ff9b9b}
.calendar-running{position:fixed;z-index:100;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));width:min(94vw,540px);border:1px solid #b99a50;background:#132840;color:#f8f3e9;padding:14px;border-radius:14px;box-shadow:0 8px 35px #0009;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

.calendar-playback{display:flex;flex-direction:column;gap:6px}
.calendar-speed{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
.calendar-speed .chip{font-size:11px;padding:7px 10px;border:1px solid #4c5c76;background:#23334b;color:#d7e1ef}
.calendar-speed .chip.active{background:#dfb444;border-color:#e2be65;color:#202a3b}
.calendar-running .btn{padding:8px 13px}

.month-history-button{background:#1d3048;border:1px solid #3e516c;border-radius:9px;padding:11px 10px;display:flex;align-items:center;gap:9px;width:100%;text-align:left;color:#dae5f5;font-size:12px;margin:7px 0}
.month-history-button strong{color:#f0c765;font-size:14px}.month-history-button span{flex:1}.month-history-button b{color:#efcd79;white-space:nowrap}
.month-history-year{border:1px solid #334a63;padding:8px 10px;border-radius:9px;margin-top:8px}
.month-history-year>summary{cursor:pointer;font-weight:800;color:#e6c36e;font-size:13px}

/* Rest-day PENNANT TIMES: an editorial design, not a plain stack of messages. */
.daily-newspaper{max-width:720px;margin:0 auto 18px;border:1px solid #ac8c50;border-radius:13px;background:repeating-linear-gradient(0deg,transparent,transparent 30px,#ffffff03 31px),linear-gradient(165deg,#203754 0%,#142238 55%,#102033 100%);padding:18px 17px 15px;color:#f4f1e9;box-shadow:0 16px 35px #0004}
.paper-dateline{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #ad965e;padding:0 0 9px;color:#b6c8df;font-size:9px;font-weight:800;letter-spacing:1px}
.paper-masthead{display:flex;align-items:center;gap:12px;padding:19px 0 14px;border-bottom:3px double #baa16b}
.paper-icon{flex:0 0 52px;height:52px;border:2px solid #cba962;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;color:#e0bf74;background:#e0b9631c}
.paper-masthead small{display:block;color:#c9af72;font-size:10px;font-weight:850;letter-spacing:2px}
.paper-masthead h1{font-size:clamp(20px,5.5vw,30px);font-weight:900;line-height:1.25;letter-spacing:.6px;margin:3px 0 0}
.paper-dateband{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:11px 1px 17px}
.paper-dateband strong{font-size:clamp(16px,4vw,21px);color:#f6d58a}
.paper-dateband span{border:1px solid #74a8a5;color:#a5ded0;border-radius:5px;padding:5px 9px;white-space:nowrap;font-weight:800;font-size:11px}
.paper-stories{display:flex;flex-direction:column;gap:11px}
.paper-lead{background:linear-gradient(155deg,#2a4360,#182d48);border-top:4px solid #d7af5c;border-bottom:1px solid #58708c;padding:15px 14px 14px}
.paper-kicker{font-size:10px;letter-spacing:1.2px;color:#f2cc77;font-weight:900;margin-bottom:8px}
.paper-lead h2{font-size:clamp(19px,5.2vw,27px);font-weight:900;line-height:1.42;margin:0 0 11px;color:#fff}
.paper-lead p{margin:0;color:#c6d4e7;font-size:12px;line-height:1.6}
.paper-highlight{margin-top:13px;background:#091a2b9c;border-top:1px solid #60748c;padding:9px 6px;text-align:center;color:#f6d27b;font-size:clamp(12px,3vw,16px);font-weight:900;letter-spacing:.3px}
.paper-briefs{display:grid;grid-template-columns:1fr;gap:8px}
.paper-brief{border-left:3px solid #6ca7ac;padding:11px 12px;background:#1d324a}
.paper-brief:nth-child(2){border-left-color:#d2a857}
.paper-brief h3{font-size:15px;line-height:1.45;margin:0 0 5px;color:#f3f3f4;font-weight:850}
.paper-brief p{font-size:11px;color:#bbcbdf;margin:0;line-height:1.55}
.paper-brief b{display:block;margin-top:7px;font-size:11px;color:#a3d3d0}
.daily-newspaper.columns .paper-briefs{grid-template-columns:repeat(2,minmax(0,1fr))}
.daily-newspaper.columns .paper-brief{padding:10px}
.daily-newspaper.columns .paper-brief h3{font-size:13px}
.daily-newspaper.accent .paper-lead{border-top:0;border-left:6px solid #d5a756;background:linear-gradient(130deg,#243c4e,#153649)}
.daily-newspaper.accent .paper-masthead{border-bottom-color:#74a5a0}
.daily-newspaper.feature .paper-lead h2{font-size:clamp(22px,5.8vw,30px)}
.paper-next{display:flex;gap:10px;align-items:center;border-top:1px solid #ab8b50;border-bottom:1px solid #4c5d70;margin-top:14px;padding:12px 0;color:#dde6f1;font-size:11px}
.paper-next strong{color:#dfbc67;font-size:10px;letter-spacing:1px}
.paper-next span{flex:1;text-align:right}
.paper-note{font-size:11px;color:#bed2e5;margin:8px 0 0}
.daily-playback{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:15px;padding-top:11px;border-top:1px solid #52647a;font-size:11px;color:#d9c18b}
.daily-playback .btn{padding:8px 12px;font-size:12px}
.daily-game-screen>.daily-playback{margin:15px 3px 30px}
@media(max-width:390px){.daily-newspaper{padding:13px 12px}.daily-newspaper.columns .paper-briefs{grid-template-columns:1fr}.paper-dateline{font-size:8px;letter-spacing:0}.paper-icon{flex-basis:42px;height:42px;font-size:21px}.paper-brief{padding:9px 10px}}

/* Touch anywhere on the active daily report to pause, then tap to resume. */
/* No full-page pointer / WebKit pressed-state overlay: mobile newspaper tap
   gestures should never paint a translucent flash over the entire screen. */
.app-shell.auto-tappable{touch-action:manipulation;cursor:default;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app-shell.auto-tappable,.app-shell.auto-tappable *{-webkit-tap-highlight-color:transparent}
.app-shell.auto-tappable .main,.app-shell.auto-tappable .daily-newspaper,.app-shell.auto-tappable .daily-game-screen{-webkit-user-select:none;user-select:none}
.app-shell.auto-tappable .daily-playback button{cursor:pointer}
.news-gesture-hint{display:block;flex-basis:100%;font-size:11px;letter-spacing:.2px;color:#f0d58d}
/* Muted violet distinguishes playback instructions from news and club badges. */
.paper-touch-hint{font-size:11px;font-weight:700;letter-spacing:.15px;color:#f2eaff;background:#372b4f;border:1px solid #9f8bc7;border-left:4px solid #b8a1e5;border-radius:7px;padding:9px 10px;margin:-6px 0 12px;text-align:center;line-height:1.55;box-shadow:0 2px 8px #050a1933}
.game-touch-hint{font-size:11px;color:#c9ddb9;text-align:center;background:#1a3b3b;border:1px solid #4f7567;border-radius:8px;padding:7px 9px;margin:3px auto 13px;max-width:550px}
.daily-playback:has(.news-gesture-hint){gap:6px}

/* Match box-score sections use typographic hierarchy, not extra enclosing cards. */
.review-section-heading{font-size:15px;letter-spacing:.8px;font-weight:900;padding:17px 3px 10px}
/* Subdued PowerPro-inspired green (fielders) and coral-red (pitchers). */
.review-section-heading.hitter-heading{color:#77d8a0;border-bottom:2px solid #509c71}
.review-section-heading.pitcher-heading{color:#ed8588;border-bottom:2px solid #b45f65}
.review-stat-table.hitter-stats thead th{color:#9de2b4;background:linear-gradient(90deg,#3c815b28,#3c815b0a)}
.review-stat-table.pitcher-stats thead th{color:#f4a0a2;background:linear-gradient(90deg,#963f482b,#963f480b)}
.review-stat-table.hitter-stats tbody td:nth-child(4){color:#87ddb0;font-weight:800}
.review-stat-table.pitcher-stats tbody td:nth-child(5){color:#f09a9e;font-weight:800}

/* Paused playback controls must stay visible without scrolling down a box score. */
.auto-paused-toolbar{position:fixed;z-index:110;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(94vw,560px);background:#172b43f5;border:1px solid #b99a5b;border-radius:13px;box-shadow:0 8px 32px #000a;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;color:#e9d4a1;font-size:12px;font-weight:800}
.auto-paused-actions{display:flex;gap:8px;justify-content:flex-end;flex:1}
.auto-paused-toolbar .btn{font-size:12px;padding:9px 12px;white-space:nowrap}
@media(max-width:380px){.auto-paused-toolbar{gap:5px}.auto-paused-toolbar .btn{padding:8px 9px;font-size:11px}}

/* LEAGUE IDENTITY — independent of player green/red, individual club colors.
   Catcher-like blue for East, infielder-like yellow for West. */
.league-east{--league-tone:#78bff0;--league-strong:#acdafa;--league-border:#568eae;--league-surface:#1b3952;--league-tint:#25527e24}
.league-west{--league-tone:#ead06e;--league-strong:#f5e39e;--league-border:#ae9550;--league-surface:#403a25;--league-tint:#d7b84a24}
.league-tag{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline;color:var(--league-tone);border:1px solid var(--league-border);border-radius:6px;background:var(--league-tint);padding:2px 7px;font-size:10px;font-weight:900;letter-spacing:.15px;white-space:nowrap}
.league-club-name{color:var(--league-tone);font-weight:800}
.league-heading{color:var(--league-tone)!important}
.league-panel{border-top:3px solid var(--league-border)}
.league-badge{box-shadow:0 0 0 2px var(--league-border);border:1px solid #ffffff38}
.top.league-east .top-low{border-bottom:2px solid #568eae}
.top.league-west .top-low{border-bottom:2px solid #ae9550}
.hero-stadium.league-east{border-color:#568eae}
.hero-stadium.league-west{border-color:#ae9550}
.hero-stadium .league-tag{margin-top:5px}
.setup-tabs .league-tab,.chips .league-tab{border:1px solid var(--league-border);color:var(--league-tone);background:var(--league-tint)}
.setup-tabs .league-tab.active,.chips .league-tab.active{background:var(--league-surface);color:var(--league-strong);border:1px solid var(--league-tone);box-shadow:inset 0 -2px 0 var(--league-tone)}
.choose-team.league-east,.team-card.league-east{border-left:3px solid #568eae}
.choose-team.league-west,.team-card.league-west{border-left:3px solid #ae9550}
.choose-team.league-east.chosen{border-color:#78bff0;background:#1a334a}
.choose-team.league-west.chosen{border-color:#ead06e;background:#363326}
.team-card.league-east:hover,.team-card.league-west:hover{border-color:var(--league-tone)}
.team-card .league-tag{color:var(--league-tone)}
.save-slot.has-game.league-east{border-left:4px solid #568eae}
.save-slot.has-game.league-west{border-left:4px solid #ae9550}
.save-slot .league-tag{vertical-align:middle;color:var(--league-tone)}

.league-table{border-left:3px solid var(--league-border);padding-left:5px}
.league-table .data-table th{color:var(--league-tone);background:var(--league-tint)}
.league-table .league-stand-rank{color:var(--league-strong);font-weight:900}
.league-table .data-table tr.focus{background:var(--league-tint)}
.league-table .data-table tr.focus td:first-child{border-left-color:var(--league-tone)}
.league-history-row{line-height:1.9}
.league-box.league-east{border-top:3px solid #568eae}
.league-box.league-west{border-top:3px solid #ae9550}
.league-box h3{color:var(--league-tone)}
.league-box .stand-line.mine{color:var(--league-tone);background:var(--league-tint)}
.league-champs>div.league-east{border-top:3px solid #568eae}
.league-champs>div.league-west{border-top:3px solid #ae9550}
.league-champs>div b{color:var(--league-strong)}
.award-winner.league-east{border-left:3px solid #568eae}
.award-winner.league-west{border-left:3px solid #ae9550}
.award-winner .award-medal .league-tag{font-size:11px}
.daily-newspaper .paper-lead.league-east{border-top-color:#568eae}
.daily-newspaper .paper-lead.league-west{border-top-color:#ead06e}
.daily-newspaper .paper-brief.league-east{border-left-color:#568eae}
.daily-newspaper .paper-brief.league-west{border-left-color:#ead06e}
.daily-newspaper .paper-lead.league-east .paper-kicker,.daily-newspaper .paper-brief.league-east .paper-kicker{color:#a4d9fa}
.daily-newspaper .paper-lead.league-west .paper-kicker,.daily-newspaper .paper-brief.league-west .paper-kicker{color:#f4dc89}
.daily-newspaper .paper-lead.league-east .paper-highlight{color:#a4d9fa}
.daily-newspaper .paper-lead.league-west .paper-highlight{color:#f4dc89}
.review-score .score-pair .league-club-name{color:var(--league-tone)}
.calendar-day .league-club-name{color:var(--league-tone)}
@media(max-width:380px){.league-tag{font-size:9px;padding:2px 5px}.league-table{padding-left:3px}}

/* Condition is a separate slim meter below the ONE-LINE season stat ledger. */
.lineup-wrap .lineup-item>.condition-status{grid-column:1/-1;grid-row:3;margin:0 0 4px}
.condition-status{display:flex;align-items:center;gap:7px;width:100%;min-width:0;padding:3px 2px;font-size:10px;color:#aebfd3}
.condition-status .condition-name{white-space:nowrap;font-size:10px;font-weight:750}
.condition-track{display:block;flex:1;height:6px;border-radius:6px;background:#354458;overflow:hidden;min-width:20px}
.condition-track i{display:block;height:100%;border-radius:6px;transition:width .16s}
.condition-status strong{font-size:11px;white-space:nowrap;min-width:32px;text-align:right}
.condition-note{font-size:9px;white-space:nowrap;min-width:42px;text-align:right}
.player-card>.condition-status{padding:4px 12px 7px}
@media(max-width:380px){.condition-status{gap:5px}.condition-status .condition-name{font-size:9px}.condition-note{font-size:8px}}

.injury-alert-screen{display:flex;flex-direction:column;gap:15px;max-width:680px;margin:14px auto;background:linear-gradient(145deg,#2f3043,#152339);border:1px solid #bf808a;border-top:5px solid #c58490;border-radius:15px;padding:20px;box-shadow:0 12px 36px #0006}
.injury-alert-screen>.eyebrow{color:#e4a2b0;letter-spacing:1.5px}
.injury-alert-screen h2{font-size:clamp(20px,5vw,27px);margin:0;color:#f6c7cb}
.injury-alert-date{color:#b8c8db;font-size:11px}
.injury-alert-name{font-size:19px;font-weight:900;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.injury-alert-level{background:#6b3542;border:1px solid #b7737c;border-radius:7px;padding:5px 9px;font-size:12px}
.injury-alert-copy{color:#e6e0e8;line-height:1.7;font-size:14px;margin:0}
.injury-alert-copy strong{color:#f4aeb7;font-size:17px}
.condition-status .condition-note{max-width:75px}
.player-detail-condition{margin:8px 0 13px;padding:8px 11px;border-bottom:1px solid #344960}.player-detail-condition .tiny{font-size:10px;margin:5px 0 0;color:#9fb4c8}

.manager-profile,.manager-offer{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.manager-profile>div,.manager-offer>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.manager-profile strong{font-size:18px}.manager-profile small,.manager-offer small,.manager-tactic small{display:block;color:var(--muted);font-size:11px}
.manager-face{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:#243e61;font-size:26px}
.manager-meter{margin:15px 0}.manager-tactic{display:flex;gap:9px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:11px 0}
.manager-tactic>div{min-width:0}.manager-tactic .select{width:min(52%,220px);flex-shrink:0}.manager-home .row{gap:10px}
.manager-home .row>div{display:flex;flex-direction:column}.manager-home small{color:var(--muted)}.manager-offer .btn{flex-shrink:0}
@media(max-width:410px){.manager-tactic{align-items:stretch;flex-direction:column}.manager-tactic .select{width:100%;max-width:none}}

/* v0.7.1: live-looking replay panel uses the game's dark navy / gold palette. */
.watch-game-screen{display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.watch-hero{background:radial-gradient(ellipse at 50% 75%,#213c56,#172942 70%);border-color:#7a6840}
.watch-overline{display:flex;align-items:center;gap:7px;color:#edd085;font-size:11px;font-weight:800;letter-spacing:.3px}
.watch-overline>span:last-child{margin-left:auto;color:#afc2d9;font-weight:500;letter-spacing:0}
.watch-live-dot{width:8px;height:8px;border-radius:50%;background:#ec745f;box-shadow:0 0 10px #ec745f88}
.watch-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:11px;align-items:center;margin:14px 0}
.watch-score>div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.watch-score .team-badge{margin-bottom:1px}.watch-score strong{font-size:clamp(30px,7vw,46px);color:#f6f7ff;font-variant-numeric:tabular-nums;line-height:1.15}
.watch-score .watch-club{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.watch-separator{font-size:27px;color:#dbc27d}.watch-inning-info{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.watch-inning-info small{color:#aebed3;font-size:10px;white-space:nowrap}.watch-progress{height:5px;background:#344963;border-radius:6px;overflow:hidden;margin-top:10px}
.watch-progress i{height:100%;background:linear-gradient(90deg,#d0a943,#f4d67b);display:block;transition:width .2s}
/* Keep innings 1–9 and the running total within the mobile screen (no horizontal swipe). */
.watch-scoreboard .table-wrap{width:100%;min-width:0;overflow-x:visible}
.watch-table{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;font-size:clamp(9px,2.6vw,11px);font-variant-numeric:tabular-nums}
.watch-table th,.watch-table td{min-width:0;text-align:center;padding:7px 0;border-bottom:1px solid #344962;color:#6d849d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watch-table th{color:#c4d1e1}
.watch-table th:first-child{width:clamp(42px,13vw,54px)}
.watch-table th:last-child{width:clamp(23px,7.2vw,30px)}
.watch-table td.played{color:#f6f6fb;font-weight:700}
.watch-table th.watch-team{text-align:left;padding-right:3px}
.watch-table .watch-total{color:#efc35c;font-weight:900;border-left:1px solid #51647c}
.watch-extra-label{margin:13px 0 6px;color:#edc869;font-size:11px;font-weight:850}
.watch-table.watch-extra-table{max-width:220px;margin:0 auto}
.watch-table.watch-extra-table th:first-child{width:60px}
.watch-table.watch-extra-table th:last-child{width:42px}
.watch-commentary{min-height:108px}.watch-commentary>small{color:#dfb64e;letter-spacing:1.4px;font-weight:900}
.watch-commentary h3{font-size:16px;margin:7px 0}.watch-commentary p{font-size:13px;color:#bdcbe0;margin:0}
.watch-controls{display:flex;gap:9px}.watch-controls button{flex:1;min-height:45px}.watch-hint{text-align:center;color:#8ea6bf}
@media(max-width:380px){.watch-score{gap:6px}.watch-inning-info{font-size:11px}}

/* v0.8.0 — cinematic moments. All visual motion is optional; scores come from saved matches. */
.result-table-wrap{min-width:0;overflow-x:visible}
.result-table{width:100%;table-layout:fixed;font-size:clamp(9px,2.4vw,11px)}
.review-screen .panel:has(.result-table){border-color:#665c4c}
.result-table th,.result-table td{font-variant-numeric:tabular-nums}
.result-table th.watch-team{font-weight:900}
.review-screen .event{border-left:2px solid #caa751;padding-left:10px}
.review-screen .panel-title{letter-spacing:.2px}

.game-cinematic{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:clamp(470px,69svh,720px);padding:28px 16px;border:1px solid #6e5b35;border-radius:18px;
  background:radial-gradient(ellipse at 50% 78%,#25494c 0,#132a40 37%,#091525 82%);box-shadow:inset 0 0 60px #08101cbb,0 20px 40px #03091255}
.game-cinematic::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:repeating-linear-gradient(0deg,transparent 0 36px,#ffffff05 37px 38px);mask-image:linear-gradient(transparent,#000)}
.cinema-stadium{position:absolute;inset:auto 0 -26% 0;z-index:-1;opacity:.62;height:70%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 82%,#3f6852 0,#1b4939 30%,#17314b 62%,transparent 70%)}
.cinema-field{width:63%;aspect-ratio:1;margin:20% auto 0;border:2px solid #efdfa662;transform:perspective(380px) rotateX(59deg) rotate(45deg);
  background:linear-gradient(135deg,#51755a50,#213d3580);box-shadow:0 0 0 23px #213d3555,0 0 65px #f5c67422}
.cinema-overline{position:relative;font-size:clamp(10px,2.5vw,13px);font-weight:900;letter-spacing:2.4px;color:#e3bd61;margin:0 0 12px}
.cinema-date{color:#d6e4f3;font-weight:800;font-size:clamp(14px,4vw,19px);margin-bottom:19px}
.cinema-billboard{display:grid;grid-template-columns:minmax(0,1fr) 32px minmax(0,1fr);align-items:center;gap:8px;width:100%;max-width:520px;margin:15px 0}
.cinema-team{min-width:0;display:flex;align-items:center;flex-direction:column;gap:7px}
.cinema-team .mini-logo,.cinema-team .team-logo{width:clamp(55px,17vw,83px);height:clamp(55px,17vw,83px);
  font-size:clamp(24px,7vw,42px);box-shadow:0 8px 26px #0008}
.cinema-team strong{color:#f8f9fd;font-size:clamp(18px,5vw,24px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cinema-team small{color:#a7c5d5;font-size:10px;font-weight:800;letter-spacing:1.8px}
.cinema-vs{font-size:19px;font-weight:950;color:#eaca74}
.cinema-mainword{margin:25px 0 7px;color:#f5d47e;letter-spacing:3px;line-height:1.05;font-size:clamp(34px,10vw,65px);
  font-weight:1000;text-shadow:0 3px 28px #e1ab4275;animation:cinema-word-in .7s cubic-bezier(.16,1,.3,1) both}
.cinema-footnote{color:#d0dce8;font-size:13px;line-height:1.7;margin:9px 0 15px;max-width:92%}
.cinema-skip{margin-top:15px;min-height:43px;position:relative;background:#142740bd!important;border-color:#546b80!important}
.game-cinematic-outro{background:radial-gradient(ellipse at 50% 85%,#253d4c,#0c182a 72%);justify-content:center}
.game-cinematic-outro.result-win{border-color:#ba9741;background:radial-gradient(ellipse at 50% 68%,#574b2c,#152637 68%,#0a1425)}
.game-cinematic-outro.result-loss{border-color:#647b94}
.game-cinematic-outro.result-draw{border-color:#708b8a}
.game-set-word{font-size:clamp(45px,13vw,80px);margin:30px 0 15px;color:#f9f6e9}
.cinema-verdict{font-size:clamp(35px,10vw,55px);font-weight:1000;color:#f2c75e;
  text-shadow:0 3px 25px #b183396a;animation:cinema-verdict-in .75s .15s both}
.result-loss .cinema-verdict{color:#cfdae6;text-shadow:0 2px 20px #809bbc66}
.result-draw .cinema-verdict{color:#b2d9d4;text-shadow:0 2px 20px #7dafa766}
.cinema-result-next{font-size:12px;letter-spacing:1px;color:#aabdd2;margin-top:13px}
.game-result-hero{position:relative;overflow:hidden;border:1px solid #9c8047;border-radius:17px;
  background:radial-gradient(ellipse at 50% 1%,#51432b,#20354b 51%,#112138 100%);
  text-align:center;padding:20px 15px 15px;margin-bottom:15px;isolation:isolate;animation:result-hero-in .56s both}
.result-lights{position:absolute;inset:-40% -40% auto -40%;height:95%;z-index:-1;opacity:.4;
  background:repeating-conic-gradient(from 12deg at 50% 90%,transparent 0deg 12deg,#f5db6630 13deg 22deg,transparent 23deg 37deg)}
.game-result-hero.result-loss{border-color:#5d7898;background:radial-gradient(ellipse at 50% 1%,#39485a,#1d3047 58%,#101d31 100%)}
.game-result-hero.result-draw{border-color:#6b9293;background:radial-gradient(ellipse at 50% 1%,#264d4e,#1d3448 55%,#101d31 100%)}
.result-intro{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.9px;color:#f5d795;font-weight:900;text-align:left}
.result-intro span+span{font-size:10px;color:#c0cddd;font-weight:600;letter-spacing:0}
.result-verdict{font-weight:1000;letter-spacing:4px;line-height:1.2;font-size:clamp(38px,10vw,62px);margin:20px 0 9px;
  color:#f7d26d;text-shadow:0 4px 20px #f2bc5a55}
.result-loss .result-verdict{color:#dae4ee;text-shadow:0 4px 20px #a9bdd155}
.result-draw .result-verdict{color:#b0e0dd;text-shadow:0 4px 20px #5ebaa855}
.result-score-row{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:center;gap:9px;margin:5px auto 0;max-width:530px}
.result-club{display:flex;align-items:center;flex-direction:column;min-width:0;gap:5px}
.result-club .mini-logo{width:clamp(40px,11vw,60px);height:clamp(40px,11vw,60px);font-size:clamp(19px,5vw,28px)}
.result-club strong{font-size:clamp(12px,3.7vw,16px);max-width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.result-club b{font-weight:950;line-height:1.12;font-size:clamp(44px,12vw,72px);font-variant-numeric:tabular-nums;color:#f6f8fd}
.result-mid{font-weight:900;font-size:25px;color:#d7c59a}
.result-dateline{font-size:11px;color:#b3c8d9;margin:11px 0}
.result-spotlight{border-top:1px solid #c6a05a55;margin-top:16px;padding:15px 7px 2px;text-align:left}
.result-spotlight-label{letter-spacing:1.9px;color:#f3cf79;font-size:10px;font-weight:950;margin-bottom:9px}
.result-spotlight-content{display:flex;align-items:center;gap:10px}
.result-spotlight .face-mini{width:42px;height:42px;flex:0 0 42px}
.result-spotlight-content span{display:flex;flex-direction:column;gap:2px;min-width:0}
.result-spotlight-content b{color:#fff;font-size:17px;line-height:1.2}
.result-spotlight-content small{color:#cfdae7;font-size:11px}
.result-key-event{font-size:12px;color:#f0d79d;border-top:1px solid #c6a05a44;padding-top:12px;margin-top:13px}
.watch-scoring-flash{margin-top:13px;border:1px solid #d7b45d77;border-radius:9px;padding:8px 12px;background:#b38b2e30;
  font-weight:950;color:#f5d475;font-size:18px;text-align:center;animation:watch-run-in .48s both}
.watch-scoring-flash small{display:block;font-size:11px;font-weight:700;letter-spacing:0;color:#f0e4c4;margin-top:2px}
.watch-moment-list{margin:12px 0 0;padding-top:10px;border-top:1px solid #38506d;display:flex;flex-direction:column;gap:8px}
.watch-moment-list div{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.5}
.watch-moment-list span{color:#ecc766;flex:0 0 40px;font-weight:800}
.watch-moment-list b{color:#dbe7f4;font-weight:650}
.daily-newspaper{animation:result-hero-in .36s both}
.injury-alert-screen{animation:cinema-word-in .5s both}
.desk-task,.nav-btn,.subtab,.chip,.btn,.save-slot{transition:transform .13s ease,filter .16s ease,background-color .18s ease}
.desk-task:active,.nav-btn:active,.subtab:active,.chip:active,.btn:active:not(:disabled),.save-slot:active{transform:scale(.982)}
.main>.game-cinematic,.main>.review-screen{animation:result-hero-in .38s both}
@keyframes cinema-word-in{from{opacity:0;transform:translateY(14px) scale(.93);filter:blur(3px)}to{opacity:1;transform:translateY(0) scale(1);filter:none}}
@keyframes cinema-verdict-in{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:scale(1)}}
@keyframes result-hero-in{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes watch-run-in{0%{opacity:0;transform:scale(.92)}65%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){
  .game-cinematic *,.game-result-hero,.watch-scoring-flash,.daily-newspaper,.injury-alert-screen,
  .main>.game-cinematic,.main>.review-screen{animation:none!important;transition:none!important}
  .desk-task,.nav-btn,.subtab,.chip,.btn,.save-slot{transition:none!important;transform:none!important}
}
@media(max-width:370px){
  .cinema-billboard{gap:4px;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr)}
  .result-score-row{gap:4px;grid-template-columns:minmax(0,1fr) 21px minmax(0,1fr)}
  .result-intro{font-size:9px}.result-intro span+span{font-size:9px}
  .game-cinematic{padding-left:10px;padding-right:10px}
}


/* v0.8.1 — consistent fictional manager portraits, scouted abilities, and in-game GM controls. */
.manager-sheet,.manager-orders-panel,.manager-candidates{border-color:#455976}
.manager-sheet{background:linear-gradient(145deg,#20324e,#172940 66%,#172840)}
.manager-profile{padding:6px 0 14px;gap:12px;align-items:center}
.manager-portrait{display:grid;place-items:center;width:64px;height:64px;flex:0 0 64px;border-radius:50%;
  background:linear-gradient(130deg,#e9c069,#a47d31);box-shadow:0 4px 14px #060c1944}
.manager-portrait .face-mini{width:58px;height:58px;flex-basis:58px;border:0;display:grid;border-radius:50%}
.manager-identity strong{font-size:clamp(17px,4.5vw,22px);line-height:1.2;color:#fff}
.manager-identity small{display:block;margin-top:3px;color:#b5c9dc;font-size:11px}
.manager-grade-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:14px 0 5px}
.manager-grade{padding:9px 3px 8px;background:#10233c;border:1px solid #314a65;border-radius:10px;text-align:center;min-width:0}
.manager-grade small{display:block;color:#aebfd2;font-size:clamp(9px,2.5vw,11px);white-space:nowrap;margin-bottom:4px}
.manager-grade b{display:block;font-weight:950;font-size:clamp(20px,6vw,29px);line-height:1.25}
.manager-relations{display:flex;gap:8px;margin:13px 0 0}
.manager-relations>div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;
  min-width:96px;border:1px solid #3c536a;border-radius:99px;background:#18334a}
.manager-relations span{color:#b7cad9;font-size:11px}
.manager-relations b{color:#e8d284;font-size:14px;font-variant-numeric:tabular-nums}
.manager-relations .is-warning{border-color:#985d62;background:#462d3a}.manager-relations .is-warning b{color:#ffaab1}
.manager-warning{font-size:12px;line-height:1.65;color:#f3c9bd;border-left:3px solid #d47d75;
  background:#482e3b;padding:9px 12px;border-radius:5px;margin:12px 0}
.manager-renew-box{padding:13px;border:1px solid #7b6b47;background:#39352b;border-radius:11px;margin-top:13px}
.manager-renew-box strong{font-size:13px;color:#f2d38d}.manager-renew-box p{color:#d8c9aa;margin:6px 0 12px}
.manager-renew-box .btn{width:100%}
.manager-strategy{padding:14px 0;border-bottom:1px solid #3b506a}
.manager-strategy-head{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.manager-strategy-head>strong{color:#f2f6fd;font-size:14px}
.manager-traits{display:flex;flex-wrap:wrap;gap:5px 14px}
.manager-traits span{font-size:11px;color:#9fb3ca}.manager-traits b{font-size:11px;color:#e5effb;font-weight:850}
.manager-options{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}
.manager-option{min-height:40px;padding:8px 4px;border:1px solid #53647d;background:#14283f;color:#bcc9dc;
  border-radius:9px;font:inherit;font-size:clamp(10px,2.8vw,12px);font-weight:800;cursor:pointer;
  transition:background-color .15s,border-color .15s,transform .12s}
.manager-option:active{transform:scale(.97)}
.manager-option.selected{background:linear-gradient(125deg,#e9c052,#b88b24);border-color:#f0d47c;color:#15243b;box-shadow:0 0 14px #e8b73c33}
.manager-candidates .manager-offer{gap:9px;padding:15px 0;align-items:center}
.manager-candidates .manager-portrait{width:44px;height:44px;flex:0 0 44px}
.manager-candidates .manager-portrait .face-mini{width:40px;height:40px;flex-basis:40px}
.manager-candidate-info{min-width:0;display:flex;flex-direction:column;flex:1;gap:2px}
.manager-candidate-info>strong{font-size:14px;color:#f5f6fc}
.manager-candidate-info>small{font-size:10px;color:#aebfd3;line-height:1.35}
.manager-candidate-info .manager-grade-strip{margin:5px 0 0;gap:3px}
.manager-candidate-info .manager-grade{padding:5px 1px 3px;border-radius:7px}
.manager-candidate-info .manager-grade small{font-size:8px;letter-spacing:-.3px}
.manager-candidate-info .manager-grade b{font-size:17px}
.manager-candidates .manager-offer .btn{padding:7px 8px;font-size:11px}
@media(max-width:390px){
  .manager-sheet,.manager-orders-panel,.manager-candidates{padding-left:12px;padding-right:12px}
  .manager-candidates .manager-offer{gap:6px}
  .manager-candidates .manager-portrait{width:37px;height:37px;flex-basis:37px}
  .manager-candidates .manager-portrait .face-mini{width:33px;height:33px;flex-basis:33px}
  .manager-candidate-info .manager-grade small{font-size:7.4px}
}
@media(prefers-reduced-motion:reduce){.manager-option{transition:none;transform:none}}


/* v0.8.2 — readable, personalized GM desk briefings; amounts and injuries are the real saved data. */
.gm-briefing-screen{max-width:670px;margin:3px auto 22px;padding:0;display:flex;flex-direction:column;gap:15px;background:transparent;border:0}
.gm-briefing-top{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:12px 14px;border:1px solid #4c617e;border-radius:12px;
  background:linear-gradient(110deg,#253f62,#172b46);font-size:10px;font-weight:950;letter-spacing:1.2px;color:#bbd9ee}
.gm-briefing-priority{color:#ffe9dc;background:#983b42;border:1px solid #d87d80;border-radius:99px;padding:4px 9px;letter-spacing:0}
.gm-briefing-normal{color:#85e3c4;background:#1d4c47;border:1px solid #327c6f;border-radius:99px;padding:4px 9px;letter-spacing:0}
.gm-briefing-paper,.gm-month-head{border:1px solid #52718e;border-radius:17px;overflow:hidden;background:#1b2d44;box-shadow:0 12px 33px #030b1c4d}
.gm-briefing-sender{display:flex;align-items:center;gap:10px;min-width:0;padding:13px 15px;background:#223a55;border-bottom:1px solid #405d77}
.gm-briefing-sender .face-mini{width:42px;height:42px;flex:0 0 42px;border-color:#f0be59}
.gm-briefing-sender>div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.gm-briefing-sender b{font-size:13px;color:#fff;line-height:1.35}
.gm-briefing-sender small{font-size:10px;color:#a8c0d7}
.gm-briefing-sender time{font-size:10px;color:#b3c8d8;white-space:nowrap}
.gm-briefing-body{padding:22px 17px}
.gm-briefing-body .eyebrow{font-size:10px;color:#f0bf6a;letter-spacing:1.4px;margin-bottom:9px}
.gm-briefing-body h2{font-size:clamp(20px,5.4vw,27px);font-weight:950;line-height:1.25;color:#fff;margin:0 0 12px}
.gm-briefing-lead{font-size:12px;line-height:1.9;color:#c4d4e6;margin:12px 0}
.gm-medical-player{display:flex;align-items:center;gap:9px;background:#24374f;border:1px solid #52647a;
  padding:13px 10px;border-radius:12px;margin:19px 0 15px}
.gm-medical-player .face-mini{width:41px;height:41px;flex:0 0 41px}
.gm-medical-player>div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.gm-medical-player strong{font-size:16px;color:#fff}.gm-medical-player span{font-size:10px;color:#a8bdcf}
.gm-medical-player>b{padding:4px 8px;border-radius:7px;white-space:nowrap;background:#653846;color:#ffd1d1;font-size:11px}
.gm-medical-days{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 14px;
  border-top:1px solid #40536e;border-bottom:1px solid #40536e}
.gm-medical-days small{font-size:12px;color:#c1d3e3}
.gm-medical-days strong{font-weight:950;font-size:31px;line-height:1.1;color:#f4b9b4}
.gm-medical-days em{font-size:13px;font-style:normal;margin-left:4px;color:#cbd6e5}
.gm-briefing-confirm{min-height:53px;letter-spacing:.4px;font-size:15px;box-shadow:0 4px 20px #dbb34822}
.gm-month-report{max-width:760px;margin:0 auto;padding-bottom:25px}
.gm-month-report .gm-briefing-top{margin-bottom:12px}
.gm-month-head{padding-bottom:16px;margin-bottom:15px}
.gm-month-head>.eyebrow,.gm-month-head>h2,.gm-month-head>p{margin-left:17px;margin-right:17px}
.gm-month-head>.eyebrow{margin-top:17px;font-size:11px;color:#f0c96c}
.gm-month-head h2{font-size:clamp(18px,5vw,27px);color:#f4f8fd;margin-top:5px;margin-bottom:8px}
.gm-month-head p{font-size:12px;color:#bad0e2;line-height:1.7;margin-top:0}
.gm-month-head p strong{color:#f4d074}
.gm-month-report .grid3{margin:11px 0 15px}
.gm-month-report .metric{background:#1b3452;border-color:#416480}
.gm-month-report .metric .lab{color:#b7c5d7}.gm-month-report .metric .val{color:#f4d27b}
.gm-month-report .panel{border-color:#405675}
.gm-month-report .panel-title{color:#f3d28a}
.gm-month-report .monthly-skill-row{line-height:1.6}
@media(prefers-reduced-motion:reduce){.gm-briefing-screen,.gm-month-report{animation:none}}
@media(max-width:365px){
 .gm-briefing-sender{padding:10px 9px;gap:7px}.gm-briefing-sender time{font-size:9px}
 .gm-briefing-sender .face-mini{width:35px;height:35px;flex-basis:35px}
 .gm-briefing-body{padding:17px 12px}

<body><div id="app"></div><script>
/* PENNANT LAB v0.2 — original v0.1 simulation retained with a new mobile GM interface. */
(() => {
  'use strict';
  const LEGACY_KEY='pennant_lab_v01_save';
  const SLOT_PREFIX='pennant_lab_v04_slot_';
  let activeSlot=Number(localStorage.getItem('pennant_lab_v02_active')||1);
  if(![1,2,3].includes(activeSlot))activeSlot=1;
  const KEY=()=>SLOT_PREFIX+activeSlot;
  // Local storage stores small slot summaries only; full saves live in IndexedDB.
  const DB_NAME='pennant_lab_v04_saves',DB_STORE='slots';
  let dbPromise=null,saveQueue=Promise.resolve(),storageFailure=false;
  function openDatabase(){
    if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
      if(!window.indexedDB){reject(new Error('This browser does not support IndexedDB'));return;}
      const req=window.indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'slot'});};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('Cannot open database'));
      req.onblocked=()=>reject(new Error('Database upgrade is blocked'));
    }).catch(err=>{dbPromise=null;throw err});
    return dbPromise;
  }
  async function readDatabaseSlot(slot){
    const db=await openDatabase();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,'readonly'),req=tx.objectStore(DB_STORE).get(Number(slot));
      req.onsuccess=()=>resolve(req.result?.data??null);
      req.onerror=()=>reject(req.error||new Error('Failed to read save'));
      tx.onabort=()=>reject(tx.error||new Error('Read transaction aborted'));
    });
  }
  async function writeDatabaseSlot(slot,data){
    const db=await openDatabase();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put({slot:Number(slot),data});
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error('Failed to save'));
      tx.onabort=()=>reject(tx.error||new Error('Save transaction aborted'));
    });
  }
  function validateSave(data){
    return !!(data&&data.v===VERSION&&Array.isArray(data.teams)&&data.teams.length===12
      &&Array.isArray(data.players)&&Array.isArray(data.schedule)
      &&data.schedule.length===SEASON_GAMES&&Number.isInteger(data.day)
      &&data.day>=0&&data.day<=SEASON_GAMES);
  }
  function slotPreview(data){
    return {v:data.v,started:data.started,year:data.year,day:data.day,gmName:data.gmName,
      selectedId:data.selectedId,teams:data.teams.map(t=>({
        id:t.id,name:t.name,short:t.short,letter:t.letter,wins:t.wins,cash:t.cash
      }))};
  }
  const VERSION = 2;
  const SEASON_GAMES = 143;
  const INTERLEAGUE_GAMES = 18;
  const POSITIONS = ['C','1B','2B','3B','SS','OF','SP','RP','CP'];
  const TEAMS = [
    ['札幌ノーススターズ','札幌','ノース','E','#3b82d5','N'],
    ['仙台ヴォルテックス','仙台','仙台','E','#8168c2','V'],
    ['東京フェニックス','東京','東京','E','#e06444','P'],
    ['横浜コメッツ','横浜','横浜','E','#318eaa','C'],
    ['新潟スワンズ','新潟','新潟','E','#43987d','S'],
    ['長野アルパインズ','長野','長野','E','#7f8b9e','A'],
    ['名古屋ギアーズ','名古屋','名古屋','W','#b87c28','G'],
    ['京都ムーンズ','京都','京都','W','#915ab2','M'],
    ['大阪スパークス','大阪','大阪','W','#db4d63','S'],
    ['神戸タイダルズ','神戸','神戸','W','#2874b3','T'],
    ['広島ブレイヴス','広島','広島','W','#c95b3c','B'],
    ['福岡ボルツ','福岡','福岡','W','#269c91','B']
  ];
  const SURNAMES = ['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','佐々木','山口','松本','井上','木村','林','清水','斎藤','池田','橋本','森','石川','前田','藤田','小川','岡田','後藤','長谷川','村上','近藤','石井','坂本','遠藤','青木','藤井','西村','福田','太田','三浦','原田','中野','野口','宮本','大野','安藤','島田','高木','平野','川口','杉本','松井','菊地','星野','桜井','片山','福井','堀田','黒田'];
  const GIVEN = ['翔太','健太','拓海','陽翔','大輝','悠真','航平','直樹','裕太','優斗','俊介','一真','竜也','隼人','亮介','悠斗','優希','和也','大地','慎吾','颯太','龍之介','拓也','祐樹','颯','健吾','翔','遥斗','蓮','陸','誠','隆太','壮真','武志','悠人','海斗','智也','直人','弘樹','晴也'];
  const $ = s => document.querySelector(s);
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  const r1=v=>Math.round(v*10)/10;
  const r2=v=>Math.round(v*100)/100;
  const h=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // All monetary values are stored internally in 億円 units; only the display is converted.
  // 0.56 -> 5600万円, 1.56 -> 1億5600万円, 20.38 -> 20億3800万円.
  const fmtMoney=v=>{
    const totalMan=Math.round(Math.abs(Number(v)||0)*10000);
    const oku=Math.floor(totalMan/10000),man=totalMan%10000;
    const amount=oku?`${oku}億${man?`${man}万円`:'円'}`:`${totalMan}万円`;
    return (Number(v)<0?'-':'')+amount;
  };
  const fmtSalary=fmtMoney;
  const pct=(w,l)=> (w+l ? (w/(w+l)).toFixed(3).replace(/^0/, '') : '.000');
  const avg=p=>p.stats.ab ? (p.stats.h/p.stats.ab).toFixed(3).replace(/^0/,''):'---';
  const era=p=>p.stats.outs ? (p.stats.er*27/p.stats.outs).toFixed(2) : '--.--';
  const namePos=pos=>({'C':'捕','1B':'一','2B':'二','3B':'三','SS':'遊','OF':'外','LF':'左','CF':'中','RF':'右','DH':'DH','SP':'先','RP':'中','CP':'抑'}[pos]||pos);
  const positionFull=pos=>({'C':'捕手','1B':'一塁手','2B':'二塁手','3B':'三塁手','SS':'遊撃手','OF':'外野手','LF':'左翼手','CF':'中堅手','RF':'右翼手','DH':'指名打者','SP':'先発投手','RP':'中継ぎ投手','CP':'抑え投手'}[pos]||pos);
  // Stable fictional attributes: existing v0.4 players get the same profile on every load.
  function derivedBatHand(p){
    const seed=((Number(p.id)||0)*47+19)%100;
    if(seed<5)return '両';
    if(p.hand==='左')return seed<86?'左':'右';
    return seed<27?'左':'右';
  }
  function derivedSubPos(p){
    const options={'C':['1B'],'1B':['3B','OF'],'2B':['SS','3B'],'3B':['1B','2B'],'SS':['2B','3B'],'OF':['1B'],'SP':['RP'],'RP':['SP','CP'],'CP':['RP']};
    const id=Number(p.id)||0;
    if((id*41+17)%100>=28)return null;
    const list=options[p.pos]||[];
    return list.length?list[(id*13+7)%list.length]:null;
  }
  const throwBat=p=>`${p.hand||'右'}投${p.batHand||derivedBatHand(p)}打`;
  let game;
  let pendingImport=null;
  let ui={page:'title',tab:'hq',teamSub:'players',businessSub:'finance',recordSub:'standings',rosterMode:'lineup',league:'E',statsMode:'bat',statsScope:'all',detail:null,playerDetail:null,playerDetailTab:'abilities',selectedTeam:2,setupLeague:'E',confirm:null,toast:null,busy:false};

  function rand(){
    let x=game.seed|0; x^=x<<13; x^=x>>>17; x^=x<<5;
    game.seed=(x>>>0)||1937;
    return (game.seed>>>0)/4294967296;
  }
  const ri=(a,b)=>a+Math.floor(rand()*(b-a+1));
  const pick=a=>a[Math.floor(rand()*a.length)];
  const roll=(base,span=12)=>clamp(Math.round(base+(rand()+rand()+rand()-1.5)*span),24,98);
  const newStats=pitch=>pitch
    ? {g:0,gs:0,outs:0,er:0,h:0,bb:0,k:0,w:0,l:0,sv:0,pitches:0,bf:0}
    : {g:0,pa:0,ab:0,h:0,doubles:0,triples:0,hr:0,rbi:0,r:0,bb:0,k:0,sb:0};
  const isPitch=p=>['SP','RP','CP'].includes(p.pos);
  const rating=p=>isPitch(p) ? Math.round(p.stuff*.43+p.control*.35+p.stamina*.22) : Math.round(p.contact*.33+p.power*.27+p.speed*.14+p.defense*.16+p.arm*.1);
  const btrRating=p=>Math.round(p.contact*.47+p.power*.37+p.speed*.16);
  const nextId=()=>game.nextId++;

  function createPlayer(teamId,pos,rookie=false){
    const p={id:nextId(),teamId,pos,age:rookie?ri(18,23):ri(20,36),name:`${pick(SURNAMES)} ${pick(GIVEN)}`,talent:ri(43,96),hand:pick(['右','右','右','左']),salary:0};
    p.batHand=derivedBatHand(p);p.subPos=derivedSubPos(p);
    const caliber=ri(-12,18);
    if(isPitch(p)){
      p.stuff=roll(57+caliber,25);p.control=roll(55+caliber,24);p.stamina=roll(pos==='SP'?72:pos==='CP'?48:52,21);

    const validHit=new Set(allHit.map(p=>p.id));

  const fieldBasePosition=role=>['LF','CF','RF'].includes(role)?'OF':role;

  function syncLineupFielding(team){

  function scheduleForSeason(){
    // Each club plays 25 x 5 intraleague + 3 x 6 interleague = 143 games.
    const leagueRound=(ids)=>{
      let a=ids.slice(),rounds=[];
      for(let i=0;i<5;i++){
        const pairs=[];
        for(let j=0;j<3;j++)pairs.push([a[j],a[5-j]]);
        rounds.push(pairs);
        a=[a[0],a[5],a[1],a[2],a[3],a[4]];
      }
      return rounds;
    };
    const eastIds=leagueTeams('E').map(t=>t.id),westIds=leagueTeams('W').map(t=>t.id);
    const east=leagueRound(eastIds),west=leagueRound(westIds);
    // Each intra-league pair plays 25 times: alternate the hosting club and
    // distribute the odd 25th home game so every club gets 62/63 league homes.
    const hostPair=(pair,ids,cycle)=>{
      const ia=ids.indexOf(pair[0]),ib=ids.indexOf(pair[1]);
      const low=Math.min(ia,ib),high=Math.max(ia,ib),gap=high-low;
      const lowGetsExtra=gap<3||(gap===3&&low%2===0);
      const extra=ids[lowGetsExtra?low:high],other=pair.find(id=>id!==extra);
      const home=cycle%2===0?extra:other,away=home===extra?other:extra;
      return {home,away,kind:'league'};
    };
    const intraleague=Array.from({length:125},(_,i)=>{
      const cycle=Math.floor(i/5),round=i%5;
      return [...east[round].map(pair=>hostPair(pair,eastIds,cycle)),
              ...west[round].map(pair=>hostPair(pair,westIds,cycle))];
    });

    const interleague=Array.from({length:INTERLEAGUE_GAMES},(_,i)=>{
      const cycle=Math.floor(i/6),rotation=i%6;
      return eastIds.map((eid,j)=>{
        const wid=westIds[(j+rotation)%6];
        const eastHome=cycle===0||(cycle===2&&rotation%2===0);

      });
    });

    if(days.length!==SEASON_GAMES)throw Error('Schedule length mismatch');
    return days;

  function calendarForSeason(year){
    // Japanese-style seasonal rhythm: late-March opening, Mondays and alternate
    // Thursdays off, and a four-day midseason break after the 73rd game.
    // All dates are UTC civil dates, independent of the viewer's timezone.
    const cycle=((year-2027)%4+4)%4;
    const midseason=cycle===1?'world':cycle===3?'international':'allstar';
    const endMarch=new Date(Date.UTC(year,2,31));
    const daysBack=(endMarch.getUTCDay()-5+7)%7; // Friday on/before March 31
    const firstMs=Date.UTC(year,2,31-daysBack),dayMs=86400000;
    const days=[];let gameNo=0,interlude=0;
    for(let offset=0;gameNo<SEASON_GAMES&&offset<290;offset++){
      const date=new Date(firstMs+offset*dayMs),weekday=date.getUTCDay();
      const iso=date.toISOString().slice(0,10),week=Math.floor(offset/7);
      let type='rest',reason='';
      if(interlude>0){type='midseason';reason=midseason;interlude--;}
      else if(weekday===1){reason='定期休養日';}
      else if(weekday===4&&week%2===1){reason='移動・調整日';}

  // Newspaper articles use only simulated game outcomes and recorded player stats.

  function matchOutcome(g){
    const mine=g.home===game.selectedId?g.homeScore:g.awayScore;
    const theirs=g.home===game.selectedId?g.awayScore:g.homeScore;
    return {mine,theirs,tone:mine>theirs?'win':mine<theirs?'loss':'draw',
      label:mine>theirs?'勝利':mine<theirs?'敗戦':'引き分け'};
  }
  function highlightPlayer(g){
    if(!g.box?.bat?.length)return null;
    const winner=g.homeScore>g.awayScore?g.home:g.awayScore>g.homeScore?g.away:game.selectedId;
    const candidates=g.box.bat.filter(x=>x.teamId===winner);
    if(!candidates.length)return null;
    return candidates.slice().sort((a,b)=>{
      const score=x=>x.hr*5+x.rbi*3+x.h*1.3+x.sb*.8+x.bb*.4;
      return score(b)-score(a)||b.h-a.h;
    })[0]||null;
  }

  function watchInningFrames(g){
    if(!g)return [];
    const frames=[],length=Math.max(g.inningsA?.length||0,g.inningsH?.length||0);
    for(let i=0;i<length;i++){
      const away=g.inningsA?.[i],home=g.inningsH?.[i];
      if(Number.isFinite(away))frames.push({inning:i+1,side:'表',teamId:g.away,runs:away});
      if(Number.isFinite(home))frames.push({inning:i+1,side:'裏',teamId:g.home,runs:home});
    }
    return frames;
  }
  // Split only real, verified scoring plate appearances into replay moments.
  // Legacy saves without play data remain inning-by-inning, never fabricated.
  function watchReplaySteps(g){
    const source=Array.isArray(g.scoringPlays)?g.scoringPlays:[];
    return watchInningFrames(g).flatMap(frame=>{
      const plays=source.filter(p=>p&&p.inning===frame.inning&&p.teamId===frame.teamId
        &&Number.isFinite(p.runs)&&p.runs>0&&typeof p.batterName==='string');
      const verified=plays.reduce((n,p)=>n+p.runs,0)===frame.runs;
      return [...(verified?plays.map(p=>({...frame,phase:'score',play:p})):[]),
        {...frame,phase:'end'}];
    });
  }
  function watchScoringTitle(play){
    const n=Number(play.rbi||play.runs)||1;
    if(play.kind==='hr')return n===1?'ソロホームラン':n===4?'満塁ホームラン':String(n)+'ランホームラン';
    if(play.kind==='single')return n+'点タイムリーヒット';
    if(play.kind==='double')return n+'点タイムリー二塁打';
    if(play.kind==='triple')return n+'点タイムリー三塁打';
    if(play.kind==='walk')return '押し出し四球';
    if(play.kind==='out')return 'アウトの間に1点';
    return play.runs+'点を記録';
  }

  /* v0.8.8: inning-by-inning pitching staff. No pitcher re-enters after removal. */
  function managerPitcherChoice(team,inning,lead,context){
    const state=context.pitching[team.id];
    const incumbent=state.current;
    if(!incumbent)return null;
    const outs=incumbent.stats.outs-(context.outsBefore.get(incumbent.id)||0);
    const pitchCount=context.pitchCounts?.[team.id]?.get(incumbent.id)||0;
    const ratingPitch=managerRatings(team.manager).pitch;
    const aggressive=managerDecision(team,'bullpen');
    const latePressure=(inning>=8&&lead>=-2&&lead<=4);
    // Manager competence changes when pressure and observed workload justify a change.
    const desired=incumbent.pos==='SP'
      ?(aggressive>=70?5:aggressive>=40?6:7)+(ratingPitch<52?1:0)
      :(incumbent.pos==='CP'?2:3);
    const tiring=incumbent.pos==='SP'?outs>=18:outs>=6;
    const overworked=incumbent.pos==='SP'?(outs>=24||pitchCount>=100):(outs>=9||pitchCount>=37);
    const exhausted=incumbent.energy<26||(incumbent.pos==='SP'&&pitchCount>=86&&incumbent.energy<55);
    const change=overworked||exhausted||(inning>desired&&(tiring||(outs>=3&&latePressure)))
      ||(incumbent.pos==='SP'&&inning>=desired&&tiring);
    if(!change)return incumbent;
    const available=pitchers(team).filter(p=>p.id!==incumbent.id
      &&['RP','CP'].includes(p.pos)&&availableForGame(p)&&!state.used.has(p.id));
    if(!available.length)return incumbent;
    const preferCloser=inning>=9&&lead>=1&&lead<=3;
    const relievers=available.map(p=>{
      const hand=effectiveSkill(p,'stuff')*.58+effectiveSkill(p,'control')*.42;
      const type=(p.pos==='CP'?(preferCloser?16:inning<8?-18:-6):(preferCloser?-4:4));
      const energy=clamp((p.energy-65)*.14,-8,6);
      const pressure=latePressure?ratingPitch*.025:0;
      return {p,score:hand+type+energy+pressure};
    }).sort((x,y)=>y.score-x.score||x.p.id-y.p.id);
    const chosen=relievers[0].p;
    state.used.add(chosen.id);
    state.current=chosen;
    if(context.managerMoves)context.managerMoves.push({
      type:'pitch',inning,side:team.id===context.awayId?'裏':'表',
      teamId:team.id,outId:incumbent.id,outName:incumbent.name,
      inId:chosen.id,inName:chosen.name,role:'投手',

  /* v0.9.0 — Pitch counts are accumulated from actual plate appearances.

     handedness is only a modest tiebreaker, not a fabricated baseball event. */
  function managerMidInningPitcherChoice(team,inning,lead,bases,outs,batter,context){
    if(!context||inning<5)return context?.pitching?.[team.id]?.current||null;
    const state=context.pitching[team.id],incumbent=state.current;
    if(!incumbent)return null;
    const count=context.pitchCounts[team.id].get(incumbent.id)||0;
    const gm=managerDecision(team,'bullpen'),managerPitch=managerRatings(team.manager).pitch;
    const runners=bases.filter(Boolean).length;
    const tight=lead>=-3&&lead<=3;
    const pressure=tight&&(runners>=2||runners===1&&outs>=1)&&inning>=6;
    const limit=incumbent.pos==='SP'
      ?clamp(Math.round(82+(incumbent.stamina-65)*.38+(managerPitch-65)*.14-(gm-50)*.18),68,103)
      :incumbent.pos==='CP'?29:34;
    if(count<limit && !(pressure&&count>=limit-12))return incumbent;
    if(incumbent.pos==='SP'&&inning<=5&&count<105)return incumbent;
    const pool=pitchers(team).filter(p=>p.id!==incumbent.id
      &&['RP','CP'].includes(p.pos)&&availableForGame(p)&&!state.used.has(p.id));
    if(!pool.length)return incumbent;
    const batterHand=batter?.batHand|| (batter?derivedBatHand(batter):'右');
    const closerTime=inning>=9&&lead>=1&&lead<=3;
    const options=pool.map(p=>{
      const core=effectiveSkill(p,'stuff')*.58+effectiveSkill(p,'control')*.42;
      const sameHand=batterHand!=='両'&&p.hand===batterHand?4.5:0;
      const role=p.pos==='CP'?(closerTime?15:inning<8?-16:-4):(closerTime?-4:3);
      const rest=clamp((p.energy-65)*.10,-8,5);
      return {p,score:core+sameHand+role+rest};
    }).sort((a,b)=>b.score-a.score||a.p.id-b.p.id);
    const chosen=options[0].p;
    state.used.add(chosen.id);
    state.current=chosen;
    context.pitchCounts[team.id].set(chosen.id,0);
    if(context.managerMoves)context.managerMoves.push({
      type:'pitch',inning,side:team.id===context.awayId?'裏':'表',
      teamId:team.id,outId:incumbent.id,outName:incumbent.name,
      inId:chosen.id,inName:chosen.name,role:'投手',
      midInning:true,pitchCount:count,outs,
      reason:pressure?'走者を背負った場面での継投':'球数による継投',
      managerId:team.manager?.id||null,managerName:team.manager?.name||'監督'
    });
    return chosen;
  }
  /* v0.8.7: GM sets pregame tactics; the manager chooses actual game-day players.
     Substitution is local to this match and never rewrites the GM's saved lineup. */
  function liveDefenseScore(team,activeLineup){
    if(!activeLineup||activeLineup.every((p,i)=>p?.id===team.lineup[i]))return teamDefenseScore(team);
    const roles=syncLineupFielding(team);
    let total=0,weight=0;
    for(const [role,w] of Object.entries(FIELD_WEIGHTS)){
      const slot=team.lineup.findIndex(id=>roles[id]===role);
      const substitute=slot>=0?activeLineup[slot]:null;
      total+=w*(substitute?effectiveFielding(substitute,role):20);
      weight+=w;
    }

  function pinchHitterChoice(team,current,pitcher,slot,bases,inning,context){
    if(!context||inning<7||!current||context.changed[team.id].has(slot))return null;
    const appetite=managerDecision(team,'pinch');
    const quota=appetite>=68?2:appetite>=36?1:0;
    if(context.pinchUsed[team.id]>=quota || (inning===7&&appetite<68))return null;
    // Preserve a late lead; a tying or winning run situation encourages action.
    if(context.scoreDiff>0||(context.scoreDiff< -5 && appetite<78))return null;
    const originalId=team.lineup[slot],role=team.fieldingRoles?.[originalId];
    if(!role)return null; // Never allow an unknown defensive position.
    const youth=managerDecision(team,'youth');
    const managerField=managerRatings(team.manager).field;
    const hasRunners=bases.some(Boolean);
    const strength=p=>effectiveSkill(p,'contact')*(hasRunners?.57:.72)
      +effectiveSkill(p,'power')*(hasRunners?.43:.28);
    const source=context.bench[team.id].filter(p=>availableForGame(p)
      &&(role==='DH'||fieldingTier(p,role)!=='off'));
    if(!source.length)return null;
    const sorted=source.map(p=>({
      player:p,score:strength(p)+(youth>=62&&p.age<=25?Math.min(5,(youth-55)*.16):0)
    })).sort((a,b)=>b.score-a.score||a.player.id-b.player.id);
    const best=sorted[0];

  function managerPinchBatter(team,batters,indexes,inning,bases,pitcher,context){
    if(!context)return batters[indexes[team.id]%batters.length];
    const slot=indexes[team.id]%batters.length,current=batters[slot];
    const chosen=pinchHitterChoice(team,current,pitcher,slot,bases,inning,context);
    if(!chosen)return current;
    batters[slot]=chosen;
    context.bench[team.id]=context.bench[team.id].filter(p=>p.id!==chosen.id);
    context.changed[team.id].add(slot);
    context.pinchUsed[team.id]++;
    if(context.managerMoves)context.managerMoves.push({
      inning,side:team.id===context.awayId?'表':'裏',teamId:team.id,
      outId:current.id,outName:current.name,inId:chosen.id,inName:chosen.name,
      type:'pinch',slot,role:team.fieldingRoles[team.lineup[slot]],
      managerId:team.manager?.id||null,managerName:team.manager?.name||'監督'
    });

  /* v0.8.8: In-game runner replacement preserves the actual base, batting
     slot and future defensive role. Never re-enter a replaced player. */
  function managerPinchRunner(team,bases,inning,appear,context){
    if(!context||inning<7||context.scoreDiff>2||context.scoreDiff< -4)return;
    const intent=managerDecision(team,'steal');
    const quota=intent>=68?2:intent>=38?1:0;
    if(context.runnerUsed[team.id]>=quota)return;
    const active=context.activeLineups[team.id];
    const roles=team.fieldingRoles||{};
    const candidates=bases.map((runner,base)=>({runner,base,slot:active.findIndex(p=>p?.id===runner?.id)}))
      .filter(x=>x.runner&&x.slot>=0&&!context.changed[team.id].has(x.slot));
    for(const current of candidates){
      const role=roles[team.lineup[current.slot]];
      if(!role)continue;
      const bench=context.bench[team.id].filter(p=>availableForGame(p)
        &&(role==='DH'||fieldingTier(p,role)!=='off'));
      const fast=bench.sort((a,b)=>effectiveSkill(b,'speed')-effectiveSkill(a,'speed')
        ||a.id-b.id)[0];
      if(!fast)return;
      const gain=effectiveSkill(fast,'speed')-effectiveSkill(current.runner,'speed');
      const minGain=clamp(12-(intent-50)*.09-(managerRatings(team.manager).field-60)*.04,7,18);

      if(inheritedPitcher)context.runnerResponsibility.set(fast.id,inheritedPitcher);
      context.runnerResponsibility?.delete(current.runner.id);
      active[current.slot]=fast;
      context.bench[team.id]=context.bench[team.id].filter(p=>p.id!==fast.id);
      context.changed[team.id].add(current.slot);
      context.runnerUsed[team.id]++;
      if(!appear.run.has(fast.id)&&!appear.bat.has(fast.id)&&!appear.def.has(fast.id))fast.stats.g++;
      appear.run.add(fast.id);
      if(context.managerMoves)context.managerMoves.push({
        type:'runner',inning,side:team.id===context.awayId?'表':'裏',teamId:team.id,
        outId:current.runner.id,outName:current.runner.name,
        inId:fast.id,inName:fast.name,slot:current.slot,role,
        managerId:team.manager?.id||null,managerName:team.manager?.name||'監督'

  }
  /* Defense-only substitution between half-innings. Positions are preserved,
     no substitution can come from a used player or create a missing fielder. */
  function managerDefenseUpgrade(team,inning,lead,context,appear){
    if(!context||inning<7||lead<1||lead>5)return;
    const intent=managerDecision(team,'defense');
    const quota=intent>=68?2:intent>=40?1:0;
    if(context.defenseUsed[team.id]>=quota)return;
    const active=context.activeLineups[team.id],roles=team.fieldingRoles||{};
    const options=[];
    for(let i=0;i<active.length;i++){
      if(context.changed[team.id].has(i))continue;
      const previous=active[i],role=roles[team.lineup[i]];
      if(!previous||!role||role==='DH')continue;
      for(const p of context.bench[team.id]){
        if(!availableForGame(p)||fieldingTier(p,role)==='off')continue;
        const improvement=effectiveFielding(p,role)-effectiveFielding(previous,role);
        const minimum=clamp(9-(intent-50)*.10-(managerRatings(team.manager).field-60)*.06,4,13);
        if(improvement>=minimum)options.push({slot:i,role,previous,p,improvement});
      }
    }
    options.sort((a,b)=>b.improvement-a.improvement||a.p.id-b.p.id);
    const chosen=options[0];if(!chosen)return;
    active[chosen.slot]=chosen.p;
    context.bench[team.id]=context.bench[team.id].filter(p=>p.id!==chosen.p.id);
    context.changed[team.id].add(chosen.slot);
    context.defenseUsed[team.id]++;
    if(!appear.bat.has(chosen.p.id)&&!appear.run.has(chosen.p.id)&&!appear.def.has(chosen.p.id))chosen.p.stats.g++;
    appear.def.add(chosen.p.id);
    if(context.managerMoves)context.managerMoves.push({
      type:'defense',inning:team.id===context.awayId?inning:inning+1,
      side:team.id===context.awayId?'裏':'表',teamId:team.id,
      outId:chosen.previous.id,outName:chosen.previous.name,
      inId:chosen.p.id,inName:chosen.p.name,slot:chosen.slot,role:chosen.role,
      managerId:team.manager?.id||null,managerName:team.manager?.name||'監督'
    });

  }
  function halfInning(batTeam,fieldTeam,pitcher,batters,indexes,inning,targetScore,appear,events,scoringPlays,context){

        }else if(bases[0]&&out<2&&rand()<.075){out+=2;pstat.outs+=2;bases[0]=null}
        else{

  function simulateGame(match){

    const inningsH=[],inningsA=[],events=[];

      bench:{

  function calendarScreen(){
    const cal=game.calendar||calendarForSeason(game.year);
    const midName={allstar:'オールスター',world:'世界シリーズ',international:'国際代表大会'}[cal.midseason];
    const groups=new Map();
    for(const d of cal.days){const m=monthKey(d.date);if(!groups.has(m))groups.set(m,[]);groups.get(m).push(d)}
    const next=calendarNextDay(),myId=game.selectedId;
    return `<section class="panel"><h3 class="panel-title">${game.year}年 年間日程</h3>
      <p class="small">${formatCalendarDate(cal.startDate)}〜${formatCalendarDate(cal.endDate)} ／ 143試合（リーグ125＋交流18）</p>
      <div class="year-record"><b>${game.day}/143試合</b></div>
      <p class="small">次の日：${next?formatCalendarDate(next.date):'全日程終了'}</p>
      <p class="small">交流戦：第56〜73戦 ／ 中盤：${midName}の休止期間 ※大会試合は未実装</p>
      <div class="calendar-months">
      ${[...groups.entries()].map(([key,days])=>`<details class="calendar-month" ${key===(next?monthKey(next.date):monthKey(cal.endDate))?'open':''}>
        <summary>${Number(key.slice(-2))}月　${days.filter(d=>d.type==='game').length}試合${game.monthlyArchive?.some(x=>x.year===game.year&&x.id===key)?' ✓月次報告':''}</summary>

          return `<div class="calendar-day ${d.type}"><span>${formatCalendarDate(d.date)}</span><span>${d.type==='game'?'第'+d.gameNo+'戦　'+(opp?`<span class="league-club-name ${leagueClass(opp.league)}">${h(opp.short)}</span>`:''):d.type==='midseason'?midName+'休止':d.reason}</span><strong>${result?result.homeScore+'-'+result.awayScore:''}</strong></div>`;
        }).join('')}
      </details>`).join('')}</div></section>`;
  }
  function archiveScreen(){
    const items=(game.seasonArchive||[]).slice().sort((a,b)=>b.year-a.year);
    if(!items.length)return `<section class="panel"><h3 class="panel-title">歴代球団史</h3><p class="small">最初のシーズンを終えると年度別記録が蓄積されます。過去年度は削除しません。</p></section>`;
    const first=items[items.length-1].year;
    const decades=new Map();
    for(const item of items){
      const group=Math.floor((item.year-first)/10);
      if(!decades.has(group))decades.set(group,[]);
      decades.get(group).push(item);
    }
    const groups=[...decades.entries()].sort((a,b)=>b[0]-a[0]);
    return `<section class="panel"><h3 class="panel-title">歴代球団史</h3><p class="small">${items.length}シーズン保存済み。10年ごとに振り返れます。</p>
      ${groups.map(([group,years],i)=>`<details class="panel" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:800">${first+group*10}〜${first+group*10+9}年　(${years.length}シーズン)</summary>
      ${years.map(s=>{
        const me=s.standings?.E?.concat(s.standings?.W||[]).find(t=>t.id===s.myTeamId);
        const east=s.standings?.E?.[0],west=s.standings?.W?.[0];
        const champion=s.postseason?.championId;
        const final=champion==null?'記録なし':(s.standings?.E||[]).concat(s.standings?.W||[]).find(t=>t.id===champion)?.name||'不明';
        return `<div class="event"><b>${s.year}年　${me?h(me.name):'球団不明'}　${me?me.rank+'位':'—'}</b><p class="small" style="margin:4px 0"> ${me?me.wins+'勝 '+me.losses+'敗 '+me.ties+'分':''}</p><p class="tiny" style="margin:0">${leagueTag('E',true)} 優勝：${east?h(east.name):'—'} ／ ${leagueTag('W',true)} 優勝：${west?h(west.name):'—'}<br>日本一：${h(final)}／個人表彰：${s.awards?.length||0}件</p></div>`;
      }).join('')}</details>`).join('')}
      </section>`;
  }
