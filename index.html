/* PENNANT LAB 0.2 · Navy / gold GM interface */
:root{--bg:#060c17;--paper:#15243a;--ink:#f4f6fc;--muted:#9daabf;--border:#344358;--blue:#399bd7;--blueDark:#101e36;--green:#36c9a7;--red:#ee6767;--gold:#d7aa34;--shadow:0 9px 28px #0003}
*{box-sizing:border-box}
html{background:#060c17;scroll-padding-top:85px}
body{background:#060c17;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif}
button,input,textarea,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #edca5f;outline-offset:2px}
.app-shell{max-width:850px;padding-bottom:calc(90px + env(safe-area-inset-bottom));background:#070b12}
.top{position:sticky;top:0;z-index:35;padding:0;background:linear-gradient(118deg,#12203d,#1d3157 54%,#101c44);border-bottom:1px solid #775d1d;box-shadow:0 6px 18px #0007}
.top-in{max-width:850px}
.top-high{padding:13px 16px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:70px}
.app-brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{font-size:24px;border-radius:50%;width:37px;height:37px;display:grid;place-items:center;color:#fbf3d0;border:1px solid #d3a334;background:#18294d;box-shadow:inset 0 0 14px #ddad3526}
.app-brand b{font-size:16px;letter-spacing:-.5px;line-height:1.1;white-space:nowrap;font-weight:950}
.app-brand small{font-size:7px;letter-spacing:1.3px;color:#88aed7;display:block;white-space:nowrap;font-weight:800;margin-top:4px}
.brand-gold,.gold-text{color:#e8bd4b}
.head-metrics{display:flex;align-items:center;justify-content:flex-end;gap:13px;text-align:center}
.head-metrics div{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.head-metrics small{font-size:9px;color:#d5c5a1;font-weight:800}
.head-metrics strong{font-size:14px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.head-metrics i{font-style:normal;font-size:9px;color:#9aa3c7}
.top-low{background:#0b1630ad;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:6px 15px;font-size:11px;white-space:nowrap}
.head-link{border:0;background:transparent;color:#cad6e8;font-size:10px;min-width:0;padding:4px 0}
.top-low strong{font-size:12px;font-weight:800}
.top-low .gold-text{font-weight:800;font-size:12px}
.main{padding:15px 14px 30px;min-height:calc(100vh - 205px)}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;max-width:850px;width:100%;border-top:1px solid #323c54;box-shadow:0 -8px 18px #0008;background:linear-gradient(180deg,#141e35,#050913);padding:7px 4px calc(5px + env(safe-area-inset-bottom));z-index:50}
.nav-btn{min-width:0;flex:1;font-size:11px;color:#a1a4b2;font-weight:750;padding:3px 0;gap:2px}
.nav-btn .nav-ico{font-size:23px;line-height:25px;width:42px;height:32px;display:grid;place-items:center;color:#9aa1ae;filter:grayscale(1)}
.nav-btn.active{color:#e7ba42}
.nav-btn.active .nav-ico{background:#7e632331;border:1px solid #846d35;border-radius:999px;color:#f4c342;filter:none;padding:0}
@media(min-width:850px){.app-shell{padding-bottom:100px}.top{padding:0}.bottom-nav{position:fixed;border-radius:0;padding:7px 4px 6px;max-width:850px;box-shadow:0 -8px 18px #0008}.nav-btn{font-size:11px;padding:3px 0;flex-direction:column}.nav-btn .nav-ico{font-size:23px}}
.page-title,.screen-top h2{font-size:22px;font-weight:900;color:#fff;margin:0 0 5px}
.screen-top{padding:11px 5px 10px}
.screen-top .small{margin:0}
.eyebrow{font-size:10px;color:#d4a93b;letter-spacing:2.3px;font-weight:900;margin-bottom:5px}
.panel{background:linear-gradient(147deg,#192a43,#122137);border:1px solid #364963;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 5px 18px #0002;color:#edf2fc}
.panel h2,.panel h3{color:#f4f5fa}
.panel-head{margin-bottom:13px}
.panel-title{color:#fff;font-size:15px}
.small,.tiny,.page-sub{color:#aab8cc}
.page-sub{margin-bottom:13px}
.pill{background:#193b45;color:#54dbbb;border:1px solid #2b5c61}
.metric{background:#1e324a;border:1px solid #31465b;color:#f7f8fb}
.metric .lab,.metric .sub{color:#a9b5c9}
.metric .val{color:#f3f6fe}
.divider{background:#33465c}
.btn{background:#20324a;color:#f1f3f9;border-radius:9px}
.btn.primary{background:linear-gradient(130deg,#f0c34f,#c99b21);color:#172139;box-shadow:0 0 13px #daa83422}
.btn.soft{background:#183652;color:#92c9f4}
.btn.outline{background:#17263b;border:1px solid #42556c;color:#d7e2f0}
.btn.danger{background:#422b37;color:#f499a1}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.actions{gap:7px}
.grid3,.grid2{gap:8px}
.grid3 .metric{padding:10px}
.grid3 .metric .val{font-size:19px}
.table-wrap{overflow-x:auto;border-radius:8px;max-width:100%}
.data-table{color:#eef1f9}
.data-table th{background:#101d30;color:#9aaabd;border-color:#344356}
.data-table td{border-bottom:1px solid #354459}
.data-table tr.focus{background:#263748}
.data-table tr.focus td:first-child{border-left:3px solid #dda52c}
.data-table .num-strong{color:#e6ba4e}
.chip,.subtab{background:#152339;color:#aebad1;border:1px solid #283a55;font-weight:800}
.chip.active,.subtab.active{background:linear-gradient(140deg,#deb13e,#bd8d23);color:#101829;border-color:#d4a635}
.select{border-color:#405470;background:#14273e;color:#eef3fc;max-width:100%}
.lineup-item{border-color:#34435b;gap:8px}
.lineup-n{background:#253e5b;color:#e8b842}
.lineup-meta{color:#a6b4c8}
.notice{background:#0e2a31!important;color:#a8e4d3!important;border-color:#215c5e!important}
.event{border-color:#31435b;color:#c6d2e5}
.empty{color:#a4b1c6}
.box-result{background:#111f33;border:1px solid #33445f;border-radius:9px;padding:12px}
.score-big{color:#fff}
.tag{background:#263958!important;color:#d0e5fa!important}
.tag.green{background:#153d35!important;color:#60d7b1!important}
.tag.red{background:#502c3b!important;color:#f38c9c!important}
.progress-bar{background:#2f3d55}.progress-inner{background:linear-gradient(90deg,#ce9326,#f4cc5e)}
.overlay{background:#050917c7;z-index:90}.dialog{background:#15243b;border:1px solid #50617a;color:#f5f6fa}.dialog h3{color:#fff}.dialog p{color:#b1c0d5}.loading{background:#0b1323e8;color:#eac15b}
.team-choice{grid-template-columns:repeat(2,minmax(0,1fr))}
.team-card{background:#182a43;border-color:#384b64;color:#f2f6fa}
.team-card span{color:#adc0d8}

.subtab{border-radius:7px;padding:10px 12px;min-height:39px;font-size:12px;flex:0 0 auto}
.stack{display:flex;flex-direction:column;gap:0}

.roster-summary b span{color:#75889f;font-size:10px}
.section-label{font-size:13px;font-weight:900;color:#e8b747;border-bottom:1px solid #534520;padding:17px 3px 11px;margin-bottom:12px}
.player-card{background:linear-gradient(150deg,#1e3450,#14243c);border:1px solid #40516b;border-radius:14px;margin-bottom:11px;padding:11px 13px;color:#f4f6fc;box-shadow:0 4px 13px #0003}

.player-caption{font-size:11px;color:#a6b9ce;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  function repairTeam(team){
    const allHit=hitters(team).sort((a,b)=>btrRating(b)-btrRating(a));
    const allSP=pitchers(team).filter(p=>p.pos==='SP').sort((a,b)=>rating(b)-rating(a));
    const validHit=new Set(allHit.map(p=>p.id));
    const validSP=new Set(allSP.map(p=>p.id));
    let l=[...new Set((team.lineup||[]).filter(id=>validHit.has(id)))];
    for(const p of allHit){if(l.length>=9)break;if(!l.includes(p.id))l.push(p.id)}
    let rotation=[...new Set((team.rotation||[]).filter(id=>validSP.has(id)))];
    for(const p of allSP){if(rotation.length>=5)break;if(!rotation.includes(p.id))rotation.push(p.id)}
    team.lineup=l.slice(0,9);team.rotation=rotation.slice(0,5);
  }

  function scheduleForSeason(){
    const leagueRound=(ids)=>{
      let a=ids.slice(),rounds=[];
      for(let i=0;i<5;i++){
        const pairs=[];
        for(let j=0;j<3;j++)pairs.push([a[j],a[5-j]]);
        rounds.push(pairs);
        a=[a[0],a[5],a[1],a[2],a[3],a[4]];
      }
      return rounds;
    };
    const east=leagueRound(leagueTeams('E').map(t=>t.id));
    const west=leagueRound(leagueTeams('W').map(t=>t.id));
    return Array.from({length:120},(_,i)=>{
      const reverse=Math.floor(i/5)%2===1;
      return [east[i%5],west[i%5]].flat().map(pair=>{
        const [a,b]=reverse?[pair[1],pair[0]]:pair;
        return {home:a,away:b};
      });
    });
  }

  function choosePitcher(t,inning,starter,lead){
    const pen=pitchers(t).filter(p=>p.pos==='RP').sort((a,b)=>rating(b)-rating(a));
    const closer=pitchers(t).find(p=>p.pos==='CP');
    if(inning<=5||!pen.length)return starter;
    if(inning===6)return pen[2]||pen[0];
    if(inning===7)return pen[1]||pen[0];
    if(inning===8)return pen[0];
    if(lead>=1&&lead<=3&&closer)return closer;
    return pen[(inning-9)%pen.length]||starter;
  }
  function halfInning(batTeam,fieldTeam,pitcher,batters,indexes,inning,targetScore,appear,events){
    let out=0,run=0,bases=[null,null,null],pa=0,walkOff=false;
    const bst=batTeam.id,field=fieldTeam.id;
    const pstat=pitcher.stats;
    if(!appear.pitch.has(pitcher.id)){pstat.g++;appear.pitch.add(pitcher.id)}
    const scoreRunner=(runner)=>{run++;if(runner)runner.stats.r++;pstat.er++};
    while(out<3&&pa<35){
      pa++;const batter=batters[indexes[bst]%batters.length];indexes[bst]++;
      if(!batter)break;
      const st=batter.stats;
      if(!appear.bat.has(batter.id)){st.g++;appear.bat.add(batter.id)}
      st.pa++;
      const pWalk=clamp(.078+(batter.contact-55)*.00035-(pitcher.control-55)*.0008,.035,.15);
      const pStrike=clamp(.213-(batter.contact-55)*.0010+(pitcher.stuff-55)*.0014,.085,.34);
      const pHit=clamp(.245+(batter.contact-55)*.00175-(pitcher.stuff-55)*.0010,.135,.38);
      let r=rand(),rbi=0;
      if(r<pWalk){
        st.bb++;pstat.bb++;
        if(bases[0]){
          if(bases[1]){
            if(bases[2]){scoreRunner(bases[2]);rbi++}
            bases[2]=bases[1];
          }
          bases[1]=bases[0];
        }
        bases[0]=batter;
      }else if(r<pWalk+pStrike){
        st.ab++;st.k++;pstat.k++;pstat.outs++;out++;
      }else if(r<pWalk+pStrike+pHit){
        st.ab++;st.h++;pstat.h++;
        const old=bases.slice();bases=[null,null,null];
        const hrChance=clamp(.055+(batter.power-50)*.0020-(pitcher.stuff-55)*.0004,.01,.21);
        const extr=rand();
        if(extr<hrChance){
          st.hr++;
          for(const runner of old)if(runner){scoreRunner(runner);rbi++}
          scoreRunner(batter);rbi++;
          if(events.length<20)events.push(`${inning}回 ${batTeam.short} ${batter.name}が${rbi}ラン本塁打`);
        }else if(extr<hrChance+.022){
          st.triples++;
          for(const runner of old)if(runner){scoreRunner(runner);rbi++}
          bases[2]=batter;
        }else if(extr<hrChance+.23){
          st.doubles++;
          for(const runner of [old[2],old[1]])if(runner){scoreRunner(runner);rbi++}
          if(old[0]){if(rand()<.50){scoreRunner(old[0]);rbi++}else bases[2]=old[0]}
          bases[1]=batter;
        }else{
          if(old[2]){scoreRunner(old[2]);rbi++}
          if(old[1]){
            if(rand()<clamp(.38+old[1].speed*.004, .4,.83)){scoreRunner(old[1]);rbi++}
            else bases[2]=old[1];
          }
          if(old[0]){
            if(!bases[2]&&rand()<.16+old[0].speed*.0024)bases[2]=old[0];
            else bases[1]=old[0];
          }
          bases[0]=batter;
        }
      }else{
        st.ab++;
        if(bases[0]&&out<2&&rand()<.075){out+=2;pstat.outs+=2;bases[0]=null}
        else{
          if(bases[2]&&out<2&&rand()<.085){scoreRunner(bases[2]);rbi++;bases[2]=null}
          out++;pstat.outs++;
        }
      }
      st.rbi+=rbi;
      if(bases[0]&&!bases[1]&&bases[0].speed>=63&&rand()<(bases[0].speed-57)*.00125){
        bases[1]=bases[0];bases[0]=null;bases[1].stats.sb++;
      }
      if(targetScore!=null && run+targetScore.current > targetScore.away){walkOff=true;break}
    }
    return {run,walkOff};
  }
  function simulateGame(match){
    const home=getTeam(match.home),away=getTeam(match.away);
    const lineupH=lineUpOf(home),lineupA=lineUpOf(away);
    const spHome=getPlayer(home.rotation[home.starterIndex%home.rotation.length]);
    const spAway=getPlayer(away.rotation[away.starterIndex%away.rotation.length]);
    home.starterIndex++;away.starterIndex++;
    const watchBox=(home.id===game.selectedId||away.id===game.selectedId);
    const watchPlayers=watchBox?[...new Map([...lineupH,...lineupA,...pitchers(home),...pitchers(away)].map(p=>[p.id,p])).values()]:[];
    const preStats=watchBox?new Map(watchPlayers.map(p=>[p.id,{...p.stats}])):null;
    const startOutsH=spHome.stats.outs,startOutsA=spAway.stats.outs;
    spHome.stats.gs++;spAway.stats.gs++;
    const appear={bat:new Set(),pitch:new Set()};
    const indexes={[home.id]:0,[away.id]:0};
    const inningsH=[],inningsA=[],events=[];
    let homeScore=0,awayScore=0;
    let closerH=null,closerA=null;
    for(let i=1;i<=12;i++){
      const awayPitcher=choosePitcher(home,i,spHome,homeScore-awayScore);
      const top=halfInning(away,home,awayPitcher,lineupA,indexes,i,null,appear,events);
      inningsA.push(top.run);awayScore+=top.run;
      if(awayPitcher.pos==='CP')closerH=awayPitcher;
      if(i>=9&&homeScore>awayScore){inningsH.push(null);break}
      const homePitcher=choosePitcher(away,i,spAway,awayScore-homeScore);
      const bot=halfInning(home,away,homePitcher,lineupH,indexes,i,{current:homeScore,away:awayScore},appear,events);
      inningsH.push(bot.run);homeScore+=bot.run;
      if(homePitcher.pos==='CP')closerA=homePitcher;
      if(i>=9&&(homeScore!==awayScore||bot.walkOff))break;
    }
    home.rs+=homeScore;home.ra+=awayScore;away.rs+=awayScore;away.ra+=homeScore;
    let outcome='draw';
    if(homeScore>awayScore){home.wins++;away.losses++;outcome='home'}
    else if(awayScore>homeScore){away.wins++;home.losses++;outcome='away'}
    else{home.ties++;away.ties++}
    if(outcome!=='draw'){
      const winner=outcome==='home'?home:away,loser=outcome==='home'?away:home;
      const wSP=outcome==='home'?spHome:spAway,lSP=outcome==='home'?spAway:spHome;
      const reliever=pitchers(winner).find(p=>p.pos==='RP'&&appear.pitch.has(p.id));
      const wPitch=(wSP.stats.outs-(outcome==='home'?startOutsH:startOutsA)>=15 ? wSP : reliever)||wSP;
      wPitch.stats.w++;lSP.stats.l++;
      const clos=outcome==='home'?closerH:closerA;
      if(clos&&clos.id!==wPitch.id&&Math.abs(homeScore-awayScore)<=3)clos.stats.sv++;
    }
    const result={id:game.games.length+1,year:game.year,day:game.day+1,home:home.id,away:away.id,homeScore,awayScore,inningsH,inningsA,events:events.slice(0,8),outcome,spHome:spHome.id,spAway:spAway.id};
    if(watchBox){
      const delta=(p,k)=>Number(p.stats[k]||0)-Number(preStats.get(p.id)?.[k]||0);
      result.box={
        bat:watchPlayers.filter(p=>!isPitch(p)&&delta(p,'pa')>0).map(p=>({id:p.id,teamId:p.teamId,pa:delta(p,'pa'),ab:delta(p,'ab'),h:delta(p,'h'),hr:delta(p,'hr'),rbi:delta(p,'rbi'),bb:delta(p,'bb'),k:delta(p,'k'),sb:delta(p,'sb')})),
        pitch:watchPlayers.filter(p=>isPitch(p)&&delta(p,'g')>0).map(p=>({id:p.id,teamId:p.teamId,outs:delta(p,'outs'),er:delta(p,'er'),h:delta(p,'h'),k:delta(p,'k'),bb:delta(p,'bb'),w:delta(p,'w'),l:delta(p,'l'),sv:delta(p,'sv')}))
      };
    }
    game.games.push(result);
    return result;
  }
  function processDay(){

  function nextSeason(){
    if(game.day!==120)return;

    for(const p of game.players){
      if(p.teamId===null)continue;
      p.age++;
      const retire=p.age>=41 || (p.age>=36&&rand()<((p.age-34)*.11));
      if(retire){p.teamId=-1;retireTotal++;continue}
      const delta=p.age<=25?ri(-2,4):p.age<=30?ri(-2,3):p.age<=34?ri(-4,2):ri(-6,1);
      const potentialBonus=p.talent>80&&p.age<=27?1:0;
      const skills=isPitch(p)?['stuff','control','stamina']:['contact','power','speed','defense','arm'];
      skills.forEach(k=>p[k]=clamp(p[k]+delta+potentialBonus,22,99));
      p.salary=r2(clamp(p.salary*.72+Math.pow(rating(p)/70,3)*.095,.05,2.5));

      for(const [pos,count] of Object.entries(positionNeeds)){
        let owned=own(t).filter(p=>p.pos===pos).length;
        while(owned<count){addPlayer(t.id,pos,true);owned++}
      }
      const rank=finalRank[t.id];
      const revenue=r2(8.5 + ((finalWins[t.id]/120)*6) + (rank===0?2.5:rank===1?1.2:0));
      const wages=payroll(t);
      t.cash=r2(t.cash+revenue-wages);
      t.wins=0;t.losses=0;t.ties=0;t.rs=0;t.ra=0;t.starterIndex=0;
      repairTeam(t);
    }
    game.year++;game.day=0;game.games=[];game.schedule=scheduleForSeason();
    captureOveralls();
    while(freeAgents().length<22)addPlayer(null,pick(POSITIONS),true);

  }

    return `<div class="setup-screen"><div class="setup-head">${appLogo()}<button class="ghost-btn" data-action="title">‹ データ選択</button></div><div class="step-pill">NEW FRANCHISE · 01 / 02</div><h2>就任する球団を選ぶ</h2><p class="small">架空12球団。GMとして好きな球団を率いてペナント制覇を目指します。</p><div class="setup-tabs"><button class="subtab ${ui.setupLeague==='E'?'active':''}" data-action="setup-league" data-league="E">東リーグ</button><button class="subtab ${ui.setupLeague==='W'?'active':''}" data-action="setup-league" data-league="W">西リーグ</button></div><div class="choose-team-list">${leagueTeams(ui.setupLeague||'E').map(t=>`<button class="choose-team ${ui.selectedTeam===t.id?'chosen':''}" data-action="pick-setup-team" data-id="${t.id}">${teamBadge(t)}<span>${h(t.name)}</span><span>${ui.selectedTeam===t.id?'✓':'›'}</span></button>`).join('')}</div><div class="setup-settings"><h3>GM・球団設定</h3><label>GM名<input type="text" maxlength="22" data-change="gm-name" value="${h(game.gmName||'GM')}" placeholder="例：山田 GM"></label><label>球団名<input type="text" maxlength="30" data-change="team-name" value="${h(t.name)}"></label><div class="setup-swatch"><span>チームカラー</span>${['#2e88d2','#c8485e','#30b698','#daab34','#946cd6','#ef8555'].map(c=>`<button class="color-dot ${t.color===c?'selected':''}" style="background:${c}" data-action="team-color" data-color="${c}" aria-label="${c}"></button>`).join('')}</div></div><div class="setup-bottom"><button class="btn primary full" data-action="finish-setup">この球団でGMに就任する　›</button><p class="tiny">球団名・カラーはゲーム内だけの設定です。</p></div></div>`;
  }
  function gameNav(){
    const items=[['team','⚾','チーム'],['roster','♟','編成'],['hq','▦','本部'],['business','▣','経営'],['records','▥','記録']];
    return `<nav class="bottom-nav" aria-label="メインメニュー">${items.map(([id,ico,label])=>`<button class="nav-btn ${ui.tab===id||((ui.tab==='market')&&id==='hq')?'active':''}" data-action="tab" data-tab="${id}" aria-label="${label}"><span class="nav-ico">${ico}</span><span>${label}</span></button>`).join('')}</nav>`;
  }
  function gameHeader(){
    const t=myTeam(),rank=rankings(t.league).findIndex(x=>x.id===t.id)+1;
    return `<header class="top"><div class="top-in"><div class="top-high">${appLogo()}<div class="head-metrics"><div><small>選手</small><strong>${own(t).length}<i>/30</i></strong></div><div><small>ファン</small><strong>${(game.fans/10000).toFixed(1)}万人</strong></div><div><small>評価</small><strong>${game.ownerRating}</strong></div></div></div><div class="top-low"><button data-action="title" class="head-link">⌂ データ選択</button><strong>${game.year}年 · ${game.pendingReview?`第${game.pendingReview.day}戦 結果確認`:game.day>=120?'シーズン終了':`第${game.day+1}戦`}</strong><span class="gold-text">¥ ${r2(t.cash).toFixed(2)}億円</span></div></div></header>`;
  }
  function statBadge(v,label){return `<div class="ability-cell"><small>${label}</small><strong style="color:${rankColor(v)}">${grade(v)}</strong><em>${v}</em></div>`}
  function playerCard(p,actions=false){
    ensurePlayerExtras(p);
    const stats=isPitch(p)?[['球威',p.stuff],['制球',p.control],['変化',Math.round((p.stuff+p.control)/2)],['体力',p.stamina],['精神',p.talent]]:[['巧打',p.contact],['長打',p.power],['走力',p.speed],['守備',p.defense],['精神',p.talent]];
    const rosterGrading=ui.tab==='roster';
    const abilityCards=stats.map(([label,num])=>rosterGrading?`<div class="ability-cell"><small>${label}</small><strong style="color:${gradeBriefColor(num)}">${gradeBrief(num)}</strong></div>`:statBadge(num,label)).join('');
    return `<div class="player-card"><button class="player-row" data-action="player-detail" data-id="${p.id}">${portrait(p)}<span class="player-main"><span class="player-name">${h(p.name)} <small>(${p.age})</small></span><span class="player-caption">${namePos(p.pos)} · ${p.hand}投　${p.salary.toFixed(2)}億円</span></span><span class="player-affinity">♥ ${p.affinity}</span><span class="chev">›</span></button><button class="abilities" data-action="player-detail" data-id="${p.id}">${abilityCards}</button>${actions?`<div class="player-card-action"><button class="btn sm outline" data-action="player-detail" data-id="${p.id}">詳細・成績</button><button class="btn sm danger" data-action="ask-release" data-id="${p.id}">戦力外</button></div>`:''}</div>`;
  }
  function teamScreen(){
    const t=myTeam(),position=rankings(t.league).findIndex(x=>x.id===t.id)+1;
    const sub=[['players','チームメンバー'],['lineup','野手構想'],['rotation','投手構想'],['overview','球団情報']];
    let content='';
    if(ui.teamSub==='lineup')content=lineupScreen(t);
    else if(ui.teamSub==='rotation')content=rotationScreen(t);
    else if(ui.teamSub==='overview')content=`<section class="panel"><h3 class="panel-title">${h(t.name)}</h3><div class="metrics-grid"><div><small>リーグ順位</small><strong>${position}位</strong></div><div><small>勝敗</small><strong>${t.wins}勝 ${t.losses}敗</strong></div><div><small>野手</small><strong>${hitters(t).length}名</strong></div><div><small>投手</small><strong>${pitchers(t).length}名</strong></div></div></section>${standingsScreen()}`;
    else content=`<div class="roster-summary"><div><small>支配下</small><b>${own(t).length}<span> / 30</span></b></div><div><small>投手</small><b>${pitchers(t).length}</b></div><div><small>野手</small><b>${hitters(t).length}</b></div><div><small>年俸総額</small><b>${fmtMoney(payroll(t))}</b></div></div><div class="section-label">野手 ${hitters(t).length}名</div>${hitters(t).sort((a,b)=>rating(b)-rating(a)).map(p=>playerCard(p)).join('')}<div class="section-label">投手 ${pitchers(t).length}名</div>${pitchers(t).sort((a,b)=>rating(b)-rating(a)).map(p=>playerCard(p)).join('')}`;
    return `<div class="screen-top"><div class="eyebrow">CLUB MANAGEMENT</div><h2>${h(t.name)}</h2><p class="small">${t.league==='E'?'東':'西'}リーグ · ${position}位　${t.wins}勝 ${t.losses}敗 ${t.ties}分</p></div><div class="subtabs">${sub.map(([key,label])=>`<button class="subtab ${ui.teamSub===key?'active':''}" data-action="team-sub" data-sub="${key}">${label}</button>`).join('')}</div><div class="stack">${content}</div>`;
  }
  function frontOfficeScreen(){
    const t=myTeam(),last=gameByTeam(t.id),next=game.day<120?game.schedule[game.day].find(m=>m.home===t.id||m.away===t.id):null;
    const opp=next?getTeam(next.home===t.id?next.away:next.home):null;
    return `<section class="hero-stadium"><div class="eyebrow">HOME BALLPARK · ${game.year}</div><div class="hero-team">${teamBadge(t,'logo')}<div><h2>${h(t.name)}</h2><small>GM ${h(game.gmName||'GM')}</small></div></div><div class="hero-row"><span>東西ペナント</span><b>${game.day}/120 試合</b></div><div class="hero-record"><strong>${t.wins} <small>勝</small></strong><strong>${t.losses} <small>敗</small></strong><strong>${t.ties} <small>分</small></strong></div><div class="hero-progress"><span style="width:${game.day/120*100}%"></span></div><div class="hero-foot"><span>球団資金 <strong>${fmtMoney(t.cash)}</strong></span><span>次の相手 <strong>${opp?h(opp.short):'シーズン終了'}</strong></span></div></section>
    <section class="panel desk-panel"><div class="desk-heading"><div><div class="eyebrow">GM DESK</div><h3>業務一覧</h3><small>判断と決断が球団の未来を変える</small></div><button class="btn primary" data-action="advance" data-days="1" ${game.day>=120?'disabled':''}>▶ 1試合進める</button></div><button class="desk-task" data-action="tab" data-tab="roster" data-roster="lineup"><span>⚾</span><span><b>スタメン・先発の確認</b><small>打順とローテーションを組む</small></span><em> › </em></button><button class="desk-task" data-action="tab" data-tab="market"><span>✦</span><span><b>自由契約選手の獲得</b><small>${freeAgents().length}名が所属先を探しています</small></span><em> › </em></button><button class="desk-task" data-action="tab" data-tab="business"><span>¥</span><span><b>予算・年俸をチェック</b><small>今季の支払予定を確認する</small></span><em> › </em></button></section>
    <section class="panel"><div class="panel-head"><h3 class="panel-title">日程を進める</h3><span class="pill">${getDayText()}</span></div>${progressButtons()}</section><section class="panel"><div class="panel-head"><h3 class="panel-title">直近の試合結果</h3></div>${lastGamePanel()}</section><section class="panel"><div class="panel-head"><h3 class="panel-title">リーグ順位</h3><button class="btn sm outline" data-action="tab" data-tab="records">順位表を見る</button></div>${standingTable(t.league,true)}</section><section class="panel"><h3 class="panel-title">クラブニュース</h3>${game.news.slice(0,6).map(n=>`<div class="event">${h(n)}</div>`).join('')}</section>`;
  }
  function businessScreen(){return `<div class="screen-top"><div class="eyebrow">BUSINESS & FINANCE</div><h2>球団経営</h2></div><div class="subtabs">${[['finance','収支・予算'],['market','補強市場']].map(([key,label])=>`<button class="subtab ${ui.businessSub===key?'active':''}" data-action="business-sub" data-sub="${key}">${label}</button>`).join('')}</div>${ui.businessSub==='market'?marketScreen():financeScreen()}`}
  function recordScreen(){return `<div class="screen-top"><div class="eyebrow">LEAGUE ARCHIVE</div><h2>記録・順位</h2></div><div class="subtabs">${[['standings','順位表'],['stats','個人成績']].map(([key,label])=>`<button class="subtab ${ui.recordSub===key?'active':''}" data-action="record-sub" data-sub="${key}">${label}</button>`).join('')}</div>${ui.recordSub==='stats'?statScreen():standingsScreen()}`}
  function playerDetails(){
    const p=getPlayer(ui.playerDetail);if(!p){ui.playerDetail=null;return teamScreen()}
    ensurePlayerExtras(p);
    const t=p.teamId>=0?getTeam(p.teamId):null,pitch=isPitch(p);
    const abilities=pitch?[['球威',p.stuff],['制球',p.control],['変化',Math.round((p.stuff+p.control)/2)],['体力',p.stamina],['精神',p.talent]]:[['巧打',p.contact],['長打',p.power],['走力',p.speed],['守備',p.defense],['精神',p.talent]];
    let body='';
    if(ui.playerDetailTab==='abilities')body=`<section class="panel"><div class="panel-head"><h3 class="panel-title">能力・適性</h3><span class="pill">総合評価 ${rating(p)}</span></div>${abilities.map(([label,v])=>`<div class="ability-progress"><span>${label}</span><div class="ability-track"><i style="width:${v}%;background:${rankColor(v)}"></i></div><b style="color:${rankColor(v)}">${grade(v)}</b><em>${v}</em></div>`).join('')}<p class="tiny">試作版では表示用ランクに変換。試合計算は引き続き元の能力値を使用します。</p></section>`;
    if(ui.playerDetailTab==='growth'){
      const ys=p.overallHistory||[],min=30,max=100,n=Math.max(1,ys.length-1);
      const pts=ys.map((s,i)=>({x:40+i*280/n,y:187-(s.overall-min)/(max-min)*141,...s}));
      body=`<section class="panel"><h3 class="panel-title">総合能力の推移</h3><div class="chart-holder"><svg class="growth-svg" viewBox="0 0 360 235" role="img" aria-label="年度別総合能力の推移">${[40,60,80,100].map(v=>`<line x1="36" y1="${187-(v-min)/(max-min)*141}" x2="333" y2="${187-(v-min)/(max-min)*141}" stroke="#3c4e63" stroke-width="1"/><text x="339" y="${190-(v-min)/(max-min)*141}" fill="#9daabd" font-size="10">${v}</text>`).join('')}<polyline points="${pts.map(v=>`${v.x},${v.y}`).join(' ')}" fill="none" stroke="#efb83d" stroke-width="3" stroke-linejoin="round"/>${pts.map(v=>`<circle cx="${v.x}" cy="${v.y}" r="5.5" fill="#38c8a8"/><text x="${v.x}" y="${v.y-13}" text-anchor="middle" font-size="12" fill="#e8edfa" font-weight="700">${v.overall}</text><text x="${v.x}" y="216" text-anchor="middle" font-size="11" fill="#a6b6c9">${v.year}</text>`).join('')}</svg></div><p class="tiny">今後のシーズン経過時に、総合能力の推移を記録します。</p></section>`;
    }
    if(ui.playerDetailTab==='stats'){
      const rows=[...p.seasonHistory,{year:game.year,teamId:p.teamId,stats:p.stats}].filter((s,i,a)=>a.findIndex(r=>r.year===s.year)===i);
      body=`<section class="panel"><h3 class="panel-title">年度別成績</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>年度</th><th>球団</th>${pitch?'<th>登板</th><th>投球回</th><th>防御率</th><th>勝</th><th>敗</th><th>奪三振</th>':'<th>試合</th><th>打率</th><th>安打</th><th>本塁打</th><th>打点</th><th>盗塁</th>'}</tr></thead><tbody>${rows.map(s=>{const st=s.stats,tm=getTeam(s.teamId);return `<tr><td>${s.year}</td><td>${tm?h(tm.short):'FA'}</td>${pitch?`<td>${st.g}</td><td>${Math.floor(st.outs/3)}.${st.outs%3}</td><td>${st.outs?(st.er*27/st.outs).toFixed(2):'--.--'}</td><td>${st.w}</td><td>${st.l}</td><td>${st.k}</td>`:`<td>${st.g}</td><td>${st.ab?(st.h/st.ab).toFixed(3).replace(/^0/,''):'---'}</td><td>${st.h}</td><td>${st.hr}</td><td>${st.rbi}</td><td>${st.sb}</td>`}</tr>`}).join('')}</tbody></table></div><p class="tiny">v0.1以前に終了した年度の成績は保存されていないため、復元できません。</p></section>`;
    }
    if(ui.playerDetailTab==='memo')body=`<section class="panel"><h3 class="panel-title">GMメモ</h3><p class="small">この選手について残したメモはセーブデータに保存されます。</p><textarea class="player-memo" data-change="player-memo" data-id="${p.id}" placeholder="来季の構想・育成方針・補強候補などを記録">${h(p.memo)}</textarea><div class="tiny">入力欄から離れると保存されます。</div></section>`;
    return `<div class="detail-back"><button class="ghost-btn" data-action="close-player">‹ 戻る</button></div><div class="player-profile"><div class="player-club">${t?h(t.name):'自由契約選手'} <span>${namePos(p.pos)}</span></div><div class="profile-row">${portrait(p)}<div><h2>${h(p.name)} <small>(${p.age})</small></h2><div class="profile-meta">${namePos(p.pos)} · ${p.hand}投 · ${p.salary.toFixed(2)}億円</div><div class="profile-meta">総合 ${rating(p)} · 愛着 ♥${p.affinity}</div></div></div></div><div class="subtabs detail-tabs">${[['abilities','能力'],['growth','能力推移'],['stats','成績'],['memo','メモ']].map(([key,label])=>`<button class="subtab ${ui.playerDetailTab===key?'active':''}" data-action="detail-tab" data-sub="${key}">${label}</button>`).join('')}</div>${body}`;
  }

  function navbar(){return gameNav()}
  function header(){return gameHeader()}
  function renderStart(){return titleScreen()}
  function teamChoice(t){return `<button class="team-card" data-action="select-team" data-id="${t.id}">${teamBadge(t)}<div style="min-width:0"><strong>${h(t.name)}</strong><br><span>${t.league==='E'?'東':'西'}リーグ</span></div></button>`}
  function progressButtons(){
    if(game.day>=120)return `<button class="btn primary full" data-action="next-season">🏆 表彰・精算して${game.year+1}年へ進む</button>`;
    return `<div class="actions"><button class="btn primary" data-action="advance" data-days="1">▶ 1試合</button><button class="btn soft" data-action="advance" data-days="7">7試合</button><button class="btn soft" data-action="advance" data-days="30">30試合</button></div><button class="btn outline full" style="margin-top:9px" data-action="advance" data-days="120">シーズン終了まで一括進行</button>`;
  }
  function lastGamePanel(){
    const t=myTeam(),g=gameByTeam(t.id);
    if(!g)return `<div class="empty">シーズンはまだ始まっていません。</div>`;
    const opp=getTeam(g.home===t.id?g.away:g.home);
    const myScore=g.home===t.id?g.homeScore:g.awayScore;
    const otherScore=g.home===t.id?g.awayScore:g.homeScore;
    const tone=myScore>otherScore?'green':myScore<otherScore?'red':'';
    const result=myScore>otherScore?'勝利':myScore<otherScore?'敗戦':'引分';
    return `<div class="box-result"><div class="card-flex"><div><span class="tag ${tone}">${result}</span> <span class="small">${g.year}年 第${g.day}戦 / vs ${h(opp.name)}</span><div class="score-big">${myScore} - ${otherScore}</div></div><button class="btn sm outline" data-action="game-details" data-id="${g.id}">詳細を見る</button></div></div>`;
  }
  function homeScreen(){
    const t=myTeam(),ranking=rankings(t.league),position=ranking.findIndex(x=>x.id===t.id)+1;
    const next=game.day>=120?null:game.schedule[game.day].find(m=>m.home===t.id||m.away===t.id);
    const opp=next?getTeam(next.home===t.id?next.away:next.home):null;
    return `<h2 class="page-title">球団ホーム</h2><p class="page-sub">${game.year}年・第${game.day}試合終了 / 全120試合 <span class="tag ${game.day>=120?'yellow':'blue'}">${game.day===120?'シーズン終了':'レギュラーシーズン'}</span></p>
    <div class="grid3" style="margin-bottom:13px"><div class="metric"><div class="lab">順位</div><div class="val">${position}<small style="font-size:13px">位</small></div><div class="sub">${t.league==='E'?'東':'西'}リーグ</div></div><div class="metric"><div class="lab">勝敗</div><div class="val" style="font-size:18px">${t.wins}-${t.losses}</div><div class="sub">${t.ties}分 / 勝率 ${pct(t.wins,t.losses)}</div></div><div class="metric"><div class="lab">球団資金</div><div class="val" style="font-size:18px">${r2(t.cash).toFixed(2)}<small style="font-size:12px">億</small></div><div class="sub">年俸総額 ${fmtMoney(payroll(t))}</div></div></div>
    <div class="main-cols"><div><section class="panel"><div class="panel-head"><h3 class="panel-title">${next?'次の対戦':'ペナント終了'}</h3><span class="pill">${getDayText()}</span></div>${next?`<div class="next-match"><div class="match-team">${teamBadge(t)}<strong>${h(t.short)}</strong></div><div class="vs">VS</div><div class="match-team">${teamBadge(opp)}<strong>${h(opp.short)}</strong></div></div><div class="small" style="text-align:center;margin-bottom:13px">${next.home===t.id?'ホーム':'ビジター'}　/　先発予定：${h(getPlayer(t.rotation[t.starterIndex%t.rotation.length])?.name||'未定')}</div>`:`<p class="small">シーズン終了。順位が確定しました。翌シーズンに進むと選手が成長・引退し、新人が補充されます。</p>`}<div class="progress-bar" style="margin-bottom:14px"><div class="progress-inner" style="width:${game.day/120*100}%"></div></div>${progressButtons()}</section>
    <section class="panel"><div class="panel-head"><h3 class="panel-title">直近の試合</h3></div>${lastGamePanel()}</section></div>
    <div><section class="panel"><div class="panel-head"><h3 class="panel-title">${t.league==='E'?'東':'西'}リーグ順位表</h3><button class="btn sm outline" data-action="tab" data-tab="standings">すべて見る</button></div>${standingTable(t.league,true)}</section><section class="panel"><div class="panel-head"><h3 class="panel-title">リーグニュース</h3></div>${game.news.slice(0,5).map(e=>`<div class="event">${h(e)}</div>`).join('')}</section></div></div>`;
  }
  function standingTable(league,compact=false){
    const rows=rankings(league);
    return `<div class="table-wrap"><table class="data-table"><thead><tr><th>順位・球団</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th>${compact?'':'<th>得点</th><th>失点</th><th>得失点差</th>'}</tr></thead><tbody>${rows.map((t,i)=>`<tr class="${t.id===game.selectedId?'focus':''}"><td class="name">${i+1}. ${h(t.short)}${i===0&&game.day>0?' 👑':''}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.ties}</td><td class="num-strong">${pct(t.wins,t.losses)}</td>${compact?'':`<td>${t.rs}</td><td>${t.ra}</td><td>${t.rs-t.ra>0?'+':''}${t.rs-t.ra}</td>`}</tr>`).join('')}</tbody></table></div>`;
  }
  function standingsScreen(){

  function financeScreen(){

" data-action="ask-reset">最初からやり直す</button></div></section>`;

  function matchReportBody(g){
    const home=getTeam(g.home),away=getTeam(g.away),n=Math.max(g.inningsH.length,g.inningsA.length);
    const tbody=[[away,g.inningsA,g.awayScore],[home,g.inningsH,g.homeScore]].map(([t,a,total])=>`<tr><td class="name">${h(t.short)}</td>${Array.from({length:n},(_,i)=>`<td>${a[i]==null?'–':a[i]}</td>`).join('')}<td class="num-strong">${total}</td></tr>`).join('');

    if(g.box){
      const hitterRows=(teamId)=>g.box.bat.filter(v=>v.teamId===teamId).map(v=>`<tr><td class="name">${h(getPlayer(v.id)?.name||'選手')}</td><td>${v.ab}</td><td>${v.h}</td><td>${v.hr}</td><td>${v.rbi}</td><td>${v.bb}</td></tr>`).join('');

      const cards=[ownId,ownId===home.id?away.id:home.id].filter(id=>id===home.id||id===away.id);
      box=cards.map((tid,index)=>`<${index?'details':'section'} class="panel"><${index?'summary':'h3'} class="panel-title">${h(getTeam(tid).name)} · 今日の個人成績 ${index?'（タップして表示）':''}</${index?'summary':'h3'}><div class="section-label" style="margin-top:9px">打撃</div><div class="table-wrap"><table class="data-table review-stat-table"><thead><tr><th>選手</th><th>打数</th><th>安打</th><th>本</th><th>打点</th><th>四球</th></tr></thead><tbody>${hitterRows(tid)||'<tr><td colspan="6">出場なし</td></tr>'}</tbody></table></div><div class="section-label">投手</div><div class="table-wrap"><table class="data-table review-stat-table"><thead><tr><th>選手</th><th>投球回</th><th>被安打</th><th>自責</th><th>奪三振</th><th>四球</th></tr></thead><tbody>${pitcherRows(tid)||'<tr><td colspan="6">出場なし</td></tr>'}</tbody></table></div></${index?'details':'section'}>`).join('');
    }else box='<p class="small">旧バージョンの試合には個別の試合成績が保存されていません。</p>';

  }
  function matchReviewScreen(){
    const r=game.pendingReview,g=game.games.find(v=>v.id===r?.gameId&&v.year===r.year);
    if(!r||!g)return `<section class="panel"><h2>試合結果を読み込めませんでした</h2><button class="btn primary full" data-action="finish-review">本部へ進む</button></section>`;

    return `<div class="review-screen"><div class="review-kicker">${h(game.year)} SEASON · MATCH REPORT</div><div class="review-score"><h2>第${g.day}戦 · 試合結果</h2><span class="match-outcome">${outcome}</span><div class="score-pair"><div>${teamBadge(me)}<small>${h(me.short)}</small><b>${myRuns}</b></div><span class="mid-score">–</span><div>${teamBadge(opp)}<small>${h(opp.short)}</small><b>${oppRuns}</b></div></div><div class="review-games-count">${r.count>1?`${r.count}試合まとめて進行 · 最後の試合を表示中`:'この試合の結果を確認してから、次の日に進みます'}</div></div>${matchReportBody(g)}<button class="btn primary review-game-btn" data-action="finish-review">${game.day>=120?'結果を確認してシーズン終了へ':'結果を確認して次の日へ　›'}</button><p class="review-help">結果確認中は日付を切り替えません。下のボタンで進んでください。</p></div>`;

  function teamSwitchModal(){
    if(ui.confirm?.type!=='switch')return '';
    return `<div class="overlay" data-action="close-overlay"><div class="dialog" style="max-width:630px;max-height:90vh;overflow:auto" data-stop="true"><div class="panel-head"><h3 class="panel-title">操作する球団を選択</h3><button class="btn sm outline" data-action="close-modal">閉じる</button></div><p>同じセーブデータの中で担当球団を切り替えます。</p><div class="team-choice">${game.teams.map(teamChoice).join('')}</div></div></div>`;
  }
  function render(){
    const app=$('#app');if(!app)return;
    if(ui.page==='title'){app.innerHTML=titleScreen();return}
    if(ui.page==='setup'){app.innerHTML=setupScreen();return}
    const screens={hq:frontOfficeScreen,team:teamScreen,roster:rosterScreen,business:businessScreen,records:recordScreen,home:frontOfficeScreen,standings:standingsScreen,stats:statScreen,market:marketScreen,finance:financeScreen};
    app.innerHTML=`<div class="app-shell">${header()}<main class="main">${game.pendingReview?matchReviewScreen():(ui.playerDetail!=null?playerDetails():(screens[ui.tab]||frontOfficeScreen)())}</main>${game.pendingReview?'':navbar()}</div>${ui.confirm?.type==='switch'?teamSwitchModal():confirmModal()}${game.pendingReview?'':resultModal()}${ui.busy?'<div class="loading"><div class="loading-inner"><span class="spinner"></span>全試合を計算しています…</div></div>':''}<input id="import-save-file" type="file" accept=".json,application/json" hidden>`;
  }
  function showToast(message,error=false){
    document.querySelector('.message')?.remove();
    const e=document.createElement('div');e.className='message'+(error?' err':'');e.textContent=message;document.body.appendChild(e);
    setTimeout(()=>e.remove(),3000);
  }
  async function advance(days){
    if(ui.busy||game.pendingReview)return;
    if(game.day>=120){showToast('今季は終了しています');return}
    ui.busy=true;render();
    await new Promise(resolve=>setTimeout(resolve,35));
    const count=Math.min(Math.max(1,Number(days)||1),120-game.day);
    for(let i=0;i<count;i++)processDay();
    const g=gameByTeam(game.selectedId);
    if(g)game.pendingReview={year:game.year,day:g.day,gameId:g.id,count};
    save();ui.busy=false;ui.detail=null;ui.playerDetail=null;render();
    window.scrollTo({top:0,behavior:'instant'});
    if(!g)showToast('試合結果を取得できませんでした',true);
  }
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b)return;
    if(event.target.closest('[data-stop]')&&b.dataset.action==='close-overlay')return;
    const act=b.dataset.action;
    if(ui.busy)return;
    if(ui.page==='game'&&game?.pendingReview){
      if(act==='finish-review'){
        game.pendingReview=null;ui.tab='hq';ui.playerDetail=null;ui.detail=null;save();render();window.scrollTo({top:0,behavior:'instant'});
        if(game.day===120)showToast(`${game.year}年の全日程が終了しました`);
      }
      return;
    }
    if(act==='back-to-hq'){ui.tab='hq';ui.playerDetail=null;render();window.scrollTo({top:0,behavior:'instant'});return}
    if(act==='new-slot'){openSlot(b.dataset.slot,true);return}
    if(act==='continue-slot'){openSlot(b.dataset.slot,false);return}
    if(act==='title'){save();ui.page='title';ui.playerDetail=null;ui.detail=null;ui.confirm=null;render();window.scrollTo(0,0);return}
    if(act==='setup-league'){ui.setupLeague=b.dataset.league;ui.selectedTeam=leagueTeams(ui.setupLeague)[0].id;render();return}
    if(act==='pick-setup-team'){ui.selectedTeam=Number(b.dataset.id);render();return}
    if(act==='team-color'){getTeam(ui.selectedTeam).color=b.dataset.color;save();render();return}
    if(act==='finish-setup'){
      game.selectedId=Number(ui.selectedTeam);game.started=true;ui.page='game';ui.tab='hq';ui.playerDetail=null;
      save();render();window.scrollTo(0,0);showToast('GM就任、おめでとうございます');return;
    }
    if(act==='select-team'){
      game.selectedId=Number(b.dataset.id);game.started=true;ui.confirm=null;ui.tab='hq';ui.page='game';save();render();window.scrollTo({top:0});return;
    }
    if(act==='team-sub'){ui.teamSub=b.dataset.sub;render();return}
    if(act==='record-sub'){ui.recordSub=b.dataset.sub;render();return}
    if(act==='business-sub'){ui.businessSub=b.dataset.sub;render();return}
    if(act==='player-detail'){ui.playerDetail=Number(b.dataset.id);ui.playerDetailTab='abilities';render();window.scrollTo(0,0);return}
    if(act==='detail-tab'){ui.playerDetailTab=b.dataset.sub;render();window.scrollTo(0,0);return}
    if(act==='close-player'){ui.playerDetail=null;render();return}
    if(act==='tab'){
      ui.playerDetail=null;ui.tab=b.dataset.tab;if(b.dataset.roster)ui.rosterMode=b.dataset.roster;
      if(ui.tab==='market'){ui.businessSub='market';ui.tab='business'}
      render();window.scrollTo({top:0,behavior:'instant'});return;
    }
    if(act==='roster-mode'){ui.rosterMode=b.dataset.mode;render();return}
    if(act==='league'){ui.league=b.dataset.league;render();return}
    if(act==='stats-mode'){ui.statsMode=b.dataset.mode;render();return}
    if(act==='advance'){void advance(b.dataset.days);return}
    if(act==='next-season'){
      if(game.day!==120)return;
      ui.confirm={type:'next',title:`${game.year+1}年へ進みますか？`,body:'選手の成長・衰退・引退、新人補充、年俸精算を実行します。このシーズンの個人成績はリセットされます。',danger:false};render();return;
    }
    if(act==='lineup-move'||act==='rotation-move'){
      const arr=act==='lineup-move'?myTeam().lineup:myTeam().rotation;
      const a=Number(b.dataset.slot),c=a+Number(b.dataset.direction);
      if(c<0||c>=arr.length)return;
      [arr[a],arr[c]]=[arr[c],arr[a]];save();render();return;
    }
    if(act==='game-details'){ui.detail=Number(b.dataset.id);render();return}
    if(act==='close-modal'||act==='close-overlay'){ui.detail=null;ui.confirm=null;pendingImport=null;render();return}
    if(act==='switch-team'){ui.confirm={type:'switch'};render();return}
    if(act==='sign'){signPlayer(b.dataset.id);return}
    if(act==='ask-release'){
      const p=getPlayer(b.dataset.id);
      ui.confirm={type:'release',id:p.id,title:'選手を自由契約にしますか？',body:`${p.name}を放出します。獲得時の契約金は戻りません。`,danger:true};render();return;
    }
    if(act==='export-save'){
      const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const anchor=document.createElement('a');anchor.href=url;anchor.download=`PENNANT_LAB_${game.year}_day${game.day}_save.json`;
      document.body.appendChild(anchor);anchor.click();anchor.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast('バックアップを保存しました');return;
    }
    if(act==='import-save'){
      $('#import-save-file')?.click();return;
    }
    if(act==='ask-reset'){
      ui.confirm={type:'reset',title:'ゲームを最初からやり直しますか？',body:'現在のセーブデータ（シーズン成績、選手、球団資金など）がすべて消えます。元には戻せません。',danger:true};render();return;
    }
    if(act==='confirm'){
      const c=ui.confirm;ui.confirm=null;
      if(c?.type==='release')releasePlayer(c.id);
      else if(c?.type==='reset'){localStorage.removeItem(KEY());buildFresh();ui.page='setup';ui.tab='hq';ui.selectedTeam=2;ui.detail=null;render();showToast('このスロットで新しい球団を選べます')}
      else if(c?.type==='next'){nextSeason();ui.tab='hq';render();showToast(`${game.year}年シーズンが開幕しました`)}
      else if(c?.type==='import'&&pendingImport){game=pendingImport;pendingImport=null;ensureGameExtras();save();ui.page=game.started?'game':'setup';ui.tab='hq';ui.detail=null;render();showToast('バックアップを復元しました')}
      else render();
      return;
    }
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.id==='import-save-file'){
      const f=el.files?.[0];if(!f)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const d=JSON.parse(reader.result);
          if(d?.v!==VERSION||!Array.isArray(d.teams)||d.teams.length!==12||!Array.isArray(d.players)||!Array.isArray(d.schedule)||d.schedule.length!==120||!(d.day>=0&&d.day<=120))throw new Error('invalid save');
          pendingImport=d;
          ui.confirm={type:'import',title:'バックアップを読み込みますか？',body:`${d.year}年・第${d.day}戦の状態に復元します。現在のセーブデータは上書きされます。`,danger:true};render();
        }catch(e){pendingImport=null;showToast('読み込めないセーブファイルです',true)}
      };
      reader.readAsText(f);return;
    }
    if(!el.dataset.change)return;
    const mode=el.dataset.change;
    if(mode==='gm-name'){game.gmName=el.value.trim().slice(0,22)||'GM';save();return}
    if(mode==='team-name'){const team=getTeam(ui.selectedTeam);team.name=el.value.trim().slice(0,30)||team.name;team.short=team.name.slice(0,4);save();return}
    if(mode==='player-memo'){const player=getPlayer(el.dataset.id);if(player){player.memo=el.value.slice(0,2000);save()}return}
    if(mode==='stats-scope'){ui.statsScope=el.value;render();return}
    if(mode==='lineup'||mode==='rotation'){
      const t=myTeam(),arr=mode==='lineup'?t.lineup:t.rotation;
      const slot=Number(el.dataset.slot),old=arr[slot],next=Number(el.value),other=arr.indexOf(next);
      if(other>=0)arr[other]=old;
      arr[slot]=next;
      save();render();return;
    }
  });
  load();ensureGameExtras();ui.page='title';render();
  // Small read-only inspection surface for automated tests in development.
  window.PennantLab={getSnapshot:()=>({year:game.year,day:game.day,selectedId:game.selectedId,teams:game.teams.map(t=>({id:t.id,name:t.name,league:t.league,w:t.wins,l:t.losses,t:t.ties,cash:t.cash,lineup:[...t.lineup],rotation:[...t.rotation]})),playerCount:game.players.length,games:game.games.length,history:[...game.history],schedule:game.schedule.map(day=>day.map(m=>({...m})))}),advance,reset:()=>{localStorage.removeItem(KEY());buildFresh();ui.page='title';render()}};
})();

</script></body>
</html>
