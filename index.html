/* PENNANT LAB 0.2 · Navy / gold GM interface */
:root{--bg:#060c17;--paper:#15243a;--ink:#f4f6fc;--muted:#9daabf;--border:#344358;--blue:#399bd7;--blueDark:#101e36;--green:#36c9a7;--red:#ee6767;--gold:#d7aa34;--shadow:0 9px 28px #0003}
*{box-sizing:border-box}
html{background:#060c17;scroll-padding-top:85px}
body{background:#060c17;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif}
button,input,textarea,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #edca5f;outline-offset:2px}
.app-shell{max-width:850px;padding-bottom:calc(90px + env(safe-area-inset-bottom));background:#070b12}
.top{position:sticky;top:0;z-index:35;padding:0;background:linear-gradient(118deg,#12203d,#1d3157 54%,#101c44);border-bottom:1px solid #775d1d;box-shadow:0 6px 18px #0007}
.top-in{max-width:850px}
.top-high{padding:13px 16px 11px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:70px}
.app-brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{font-size:25px;border-radius:50%;width:37px;height:37px;display:grid;place-items:center;color:#fbf3d0;border:1px solid #d3a334;background:#18294d;box-shadow:inset 0 0 14px #ddad3526}
.app-brand b{font-size:16.6px;letter-spacing:-.5px;line-height:1.1;white-space:nowrap;font-weight:950}
.app-brand small{font-size:7.3px;letter-spacing:1.3px;color:#88aed7;display:block;white-space:nowrap;font-weight:800;margin-top:4px}
.brand-gold,.gold-text{color:#e8bd4b}
.head-metrics{display:flex;align-items:center;justify-content:flex-end;gap:13px;text-align:center}
.head-metrics div{display:flex;flex-direction:column;gap:1px;white-space:nowrap}
.head-metrics small{font-size:9.4px;color:#d5c5a1;font-weight:800}
.head-metrics strong{font-size:14.6px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.head-metrics i{font-style:normal;font-size:9.4px;color:#9aa3c7}
.top-low{background:#0b1630ad;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:6px 15px;font-size:11.4px;white-space:nowrap}
.head-link{border:0;background:transparent;color:#cad6e8;font-size:10.4px;min-width:0;padding:4px 0}
.top-low strong{font-size:12.5px;font-weight:800}
.top-low .gold-text{font-weight:800;font-size:12.5px}
.main{padding:15px 14px 30px;min-height:calc(100vh - 205px)}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;max-width:850px;width:100%;border-top:1px solid #323c54;box-shadow:0 -8px 18px #0008;background:linear-gradient(180deg,#141e35,#050913);padding:7px 4px calc(5px + env(safe-area-inset-bottom));z-index:50}
.nav-btn{min-width:0;flex:1;font-size:11.4px;color:#a1a4b2;font-weight:750;padding:3px 0;gap:2px}
.nav-btn .nav-ico{font-size:23.9px;line-height:25px;width:42px;height:32px;display:grid;place-items:center;color:#9aa1ae;filter:grayscale(1)}
.nav-btn.active{color:#e7ba42}
.nav-btn.active .nav-ico{background:#7e632331;border:1px solid #846d35;border-radius:999px;color:#f4c342;filter:none;padding:0}
@media(min-width:850px){.app-shell{padding-bottom:100px}.top{padding:0}.bottom-nav{position:fixed;border-radius:0;padding:7px 4px 6px;max-width:850px;box-shadow:0 -8px 18px #0008}.nav-btn{font-size:11.4px;padding:3px 0;flex-direction:column}.nav-btn .nav-ico{font-size:23.9px}}
.page-title,.screen-top h2{font-size:22.9px;font-weight:900;color:#fff;margin:0 0 5px}
.screen-top{padding:11px 5px 10px}
.screen-top .small{margin:0}
.eyebrow{font-size:10.4px;color:#d4a93b;letter-spacing:2.3px;font-weight:900;margin-bottom:5px}
.panel{background:linear-gradient(147deg,#192a43,#122137);border:1px solid #364963;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:0 5px 18px #0002;color:#edf2fc}
.panel h2,.panel h3{color:#f4f5fa}
.panel-head{margin-bottom:13px}
.panel-title{color:#fff;font-size:15.6px}
.small,.tiny,.page-sub{color:#aab8cc}
.page-sub{margin-bottom:13px}
.pill{background:#193b45;color:#54dbbb;border:1px solid #2b5c61}
.metric{background:#1e324a;border:1px solid #31465b;color:#f7f8fb}
.metric .lab,.metric .sub{color:#a9b5c9}
.metric .val{color:#f3f6fe}
.divider{background:#33465c}
.btn{background:#20324a;color:#f1f3f9;border-radius:9px}
.btn.primary{background:linear-gradient(130deg,#f0c34f,#c99b21);color:#172139;box-shadow:0 0 13px #daa83422}
.btn.soft{background:#183652;color:#92c9f4}
.btn.outline{background:#17263b;border:1px solid #42556c;color:#d7e2f0}
.btn.danger{background:#422b37;color:#f499a1}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.actions{gap:7px}
.grid3,.grid2{gap:8px}
.grid3 .metric{padding:10px}
.grid3 .metric .val{font-size:19.8px}
.table-wrap{overflow-x:auto;border-radius:8px;max-width:100%}
.data-table{color:#eef1f9}
.data-table th{background:#101d30;color:#9aaabd;border-color:#344356}
.data-table td{border-bottom:1px solid #354459}
.data-table tr.focus{background:#263748}
.data-table tr.focus td:first-child{border-left:3px solid #dda52c}
.data-table .num-strong{color:#e6ba4e}
.chip,.subtab{background:#152339;color:#aebad1;border:1px solid #283a55;font-weight:800}
.chip.active,.subtab.active{background:linear-gradient(140deg,#deb13e,#bd8d23);color:#101829;border-color:#d4a635}
.select{border-color:#405470;background:#14273e;color:#eef3fc;max-width:100%}
.lineup-item{border-color:#34435b;gap:8px}
.lineup-n{background:#253e5b;color:#e8b842}
.lineup-meta{color:#a6b4c8}
.notice{background:#0e2a31!important;color:#a8e4d3!important;border-color:#215c5e!important}
.event{border-color:#31435b;color:#c6d2e5}
.empty{color:#a4b1c6}
.box-result{background:#111f33;border:1px solid #33445f;border-radius:9px;padding:12px}
.score-big{color:#fff}
.tag{background:#263958!important;color:#d0e5fa!important}
.tag.green{background:#153d35!important;color:#60d7b1!important}
.tag.red{background:#502c3b!important;color:#f38c9c!important}
.progress-bar{background:#2f3d55}.progress-inner{background:linear-gradient(90deg,#ce9326,#f4cc5e)}
.overlay{background:#050917c7;z-index:90}.dialog{background:#15243b;border:1px solid #50617a;color:#f5f6fa}.dialog h3{color:#fff}.dialog p{color:#b1c0d5}.loading{background:#0b1323e8;color:#eac15b}
.team-choice{grid-template-columns:repeat(2,minmax(0,1fr))}
.team-card{background:#182a43;border-color:#384b64;color:#f2f6fa}
.team-card span{color:#adc0d8}
/* 5-tab screens */
.subtabs{display:flex;gap:5px;overflow-x:auto;padding:0 0 11px;margin-bottom:8px;scrollbar-width:thin;white-space:nowrap}
.subtab{border-radius:7px;padding:10px 12px;min-height:39px;font-size:12.5px;flex:0 0 auto}
.stack{display:flex;flex-direction:column;gap:0}
.roster-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 16px;padding:15px 9px;border:1px solid #354e67;background:#162941;border-radius:13px}
.roster-summary>div{text-align:center;min-width:0;display:flex;flex-direction:column;gap:7px}
.roster-summary small{font-size:9.4px;color:#a1b2c7}
.roster-summary b{font-size:14.6px;color:#e1b947;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roster-summary b span{color:#75889f;font-size:10.4px}
.section-label{font-size:13.5px;font-weight:900;color:#e8b747;border-bottom:1px solid #534520;padding:17px 3px 11px;margin-bottom:12px}
.player-card{background:linear-gradient(150deg,#1e3450,#14243c);border:1px solid #40516b;border-radius:14px;margin-bottom:11px;padding:11px 13px;color:#f4f6fc;box-shadow:0 4px 13px #0003}
.player-row{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:0;color:inherit;text-align:left;padding:0}
.avatar{flex:0 0 54px;width:54px;height:54px;border:3px solid var(--avatar-color);background:radial-gradient(circle at 45% 35%,#496b79,#14263b 72%);color:#f3dfb0;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;font-size:25px}
.avatar b{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border-radius:13px;background:var(--avatar-color);color:#0a182a;padding:0 8px;font-size:13.5px;min-width:32px;text-align:center}
.player-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.player-name{font-size:16.6px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-name small{font-size:11.4px;color:#b5bfd0}
.player-caption{font-size:11.4px;color:#a6b9ce;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-affinity{font-weight:950;font-size:15.6px;color:#e8af4c;white-space:nowrap}
.chev{font-size:25px;color:#8394ad;margin-left:1px}

<body><div id="app"></div><script>
/* PENNANT LAB v0.2 — original v0.1 simulation retained with a new mobile GM interface. */
(() => {
  'use strict';
  const LEGACY_KEY='pennant_lab_v01_save';
  const SLOT_PREFIX='pennant_lab_v04_slot_';
  let activeSlot=Number(localStorage.getItem('pennant_lab_v02_active')||1);
  if(![1,2,3].includes(activeSlot))activeSlot=1;
  const KEY=()=>SLOT_PREFIX+activeSlot;
  // Local storage stores small slot summaries only; full saves live in IndexedDB.
  const DB_NAME='pennant_lab_v04_saves',DB_STORE='slots';
  let dbPromise=null,saveQueue=Promise.resolve(),storageFailure=false;
  function openDatabase(){
    if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
      if(!window.indexedDB){reject(new Error('This browser does not support IndexedDB'));return;}
      const req=window.indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'slot'});};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error||new Error('Cannot open database'));
      req.onblocked=()=>reject(new Error('Database upgrade is blocked'));
    }).catch(err=>{dbPromise=null;throw err});
    return dbPromise;
  }
  async function readDatabaseSlot(slot){
    const db=await openDatabase();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,'readonly'),req=tx.objectStore(DB_STORE).get(Number(slot));
      req.onsuccess=()=>resolve(req.result?.data??null);
      req.onerror=()=>reject(req.error||new Error('Failed to read save'));
      tx.onabort=()=>reject(tx.error||new Error('Read transaction aborted'));
    });
  }
  async function writeDatabaseSlot(slot,data){
    const db=await openDatabase();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put({slot:Number(slot),data});
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error('Failed to save'));
      tx.onabort=()=>reject(tx.error||new Error('Save transaction aborted'));
    });
  }
  function validateSave(data){
    return !!(data&&data.v===VERSION&&Array.isArray(data.teams)&&data.teams.length===12
      &&Array.isArray(data.players)&&Array.isArray(data.schedule)
      &&data.schedule.length===SEASON_GAMES&&Number.isInteger(data.day)
      &&data.day>=0&&data.day<=SEASON_GAMES);
  }
  function slotPreview(data){

  function waitForDailyDisplay(duration){

      let remaining=duration,timer=null,started=0,settled=false;
      const stop=()=>{
        if(timer!==null){
          clearTimeout(timer);timer=null;
          remaining=Math.max(0,remaining-(Date.now()-started));

      };
      const finish=()=>{
        if(settled)return;
        stop();settled=true;clearPendingNewsTap();ui.autoWait=null;resolve();
      };
      const play=()=>{
        if(settled)return;
        started=Date.now();
        timer=setTimeout(finish,remaining);
      };
      ui.autoWait={
        pause(){
          if(settled||ui.autoPaused)return;
          stop();ui.autoPaused=true;render();
        },
        resume(){
          if(settled||!ui.autoPaused)return;
          ui.autoPaused=false;render();play();
        },
        skip(){
          if(settled)return;
          ui.autoPaused=false;finish();
        }
      };

    });

  function choosePitcher(t,inning,starter,lead){
    const pen=pitchers(t).filter(p=>p.pos==='RP'&&availableForGame(p)).sort((a,b)=>
      rating(b)*fatigueFactor(b)-rating(a)*fatigueFactor(a)||b.energy-a.energy);
    const closer=pitchers(t).find(p=>p.pos==='CP'&&availableForGame(p));
    if(inning<=5||!pen.length)return starter;
    if(inning===6)return pen[2]||pen[0];
    if(inning===7)return pen[1]||pen[0];
    if(inning===8)return pen[0];
    if(lead>=1&&lead<=3&&closer&&closer.energy>=35)return closer;
    return pen[(inning-9)%pen.length]||starter;

  function halfInning(batTeam,fieldTeam,pitcher,batters,indexes,inning,targetScore,appear,events){
    let out=0,run=0,bases=[null,null,null],pa=0,walkOff=false;
    const bst=batTeam.id,field=fieldTeam.id;
    const defense=teamDefenseScore(fieldTeam);
    const pstat=pitcher.stats;
    if(!appear.pitch.has(pitcher.id)){pstat.g++;appear.pitch.add(pitcher.id)}
    const scoreRunner=(runner)=>{run++;if(runner)runner.stats.r++;pstat.er++};
    while(out<3&&pa<35){
      pa++;const batter=batters[indexes[bst]%batters.length];indexes[bst]++;
      if(!batter)break;
      const st=batter.stats;
      if(!appear.bat.has(batter.id)){st.g++;appear.bat.add(batter.id)}
      st.pa++;
      const contact=effectiveSkill(batter,'contact'),power=effectiveSkill(batter,'power');
      const stuff=effectiveSkill(pitcher,'stuff'),control=effectiveSkill(pitcher,'control');
      const pWalk=clamp(.078+(contact-55)*.00035-(control-55)*.0008,.035,.15);
      const pStrike=clamp(.213-(contact-55)*.0010+(stuff-55)*.0014,.085,.34);
      // Defense is part of batted-ball outcomes, not the batter's base skill.
      // Excellent defenders suppress hits; unsuitable positions reduce efficiency.
      const pHit=clamp(.245+(contact-55)*.00175-(stuff-55)*.0010
        +(60-defense)*.00135,.115,.42);
      let r=rand(),rbi=0;
      if(r<pWalk){
        st.bb++;pstat.bb++;
        if(bases[0]){
          if(bases[1]){
            if(bases[2]){scoreRunner(bases[2]);rbi++}
            bases[2]=bases[1];
          }
          bases[1]=bases[0];
        }
        bases[0]=batter;
      }else if(r<pWalk+pStrike){
        st.ab++;st.k++;pstat.k++;pstat.outs++;out++;
      }else if(r<pWalk+pStrike+pHit){
        st.ab++;st.h++;pstat.h++;
        const old=bases.slice();bases=[null,null,null];
        const hrChance=clamp(.055+(power-50)*.0020-(stuff-55)*.0004,.01,.21);
        const extr=rand();
        if(extr<hrChance){
          st.hr++;
          for(const runner of old)if(runner){scoreRunner(runner);rbi++}
          scoreRunner(batter);rbi++;
          if(events.length<20)events.push(`${inning}回 ${batTeam.short} ${batter.name}が${rbi}ラン本塁打`);
        }else if(extr<hrChance+.022){
          st.triples++;
          for(const runner of old)if(runner){scoreRunner(runner);rbi++}
          bases[2]=batter;
        }else if(extr<hrChance+.23){
          st.doubles++;
          for(const runner of [old[2],old[1]])if(runner){scoreRunner(runner);rbi++}
          if(old[0]){if(rand()<.50){scoreRunner(old[0]);rbi++}else bases[2]=old[0]}
          bases[1]=batter;
        }else{
          if(old[2]){scoreRunner(old[2]);rbi++}
          if(old[1]){
            if(rand()<clamp(.38+effectiveSkill(old[1],'speed')*.004, .4,.83)){scoreRunner(old[1]);rbi++}
            else bases[2]=old[1];
          }
          if(old[0]){
            if(!bases[2]&&rand()<.16+effectiveSkill(old[0],'speed')*.0024)bases[2]=old[0];
            else bases[1]=old[0];
          }
          bases[0]=batter;
        }
      }else{
        st.ab++;
        if(bases[0]&&out<2&&rand()<.075){out+=2;pstat.outs+=2;bases[0]=null}
        else{
          if(bases[2]&&out<2&&rand()<.085){scoreRunner(bases[2]);rbi++;bases[2]=null}
          out++;pstat.outs++;
        }
      }
      st.rbi+=rbi;
      if(bases[0]&&!bases[1]&&effectiveSkill(bases[0],'speed')>=63&&rand()<(effectiveSkill(bases[0],'speed')-57)*.00125){
        bases[1]=bases[0];bases[0]=null;bases[1].stats.sb++;
      }
      if(targetScore!=null && run+targetScore.current > targetScore.away){walkOff=true;break}
    }
    return {run,walkOff};
  }
  function simulateGame(match){
    const home=getTeam(match.home),away=getTeam(match.away);
    const lineupH=lineUpOf(home),lineupA=lineUpOf(away);
    const readyStarter=t=>{
      repairTeam(t);
      const pool=t.rotation.map(getPlayer).filter(availableForGame);
      const backup=pitchers(t).filter(availableForGame).sort((a,b)=>rating(b)-rating(a));
      return pool.length?pool[t.starterIndex%pool.length]:backup[0];
    };
    const spHome=readyStarter(home),spAway=readyStarter(away);
    if(!spHome||!spAway)throw Error('No available pitcher: injury roster protection failed');
    home.starterIndex++;away.starterIndex++;
    const watchBox=(home.id===game.selectedId||away.id===game.selectedId);
    const watchPlayers=watchBox?[...new Map([...lineupH,...lineupA,...pitchers(home),...pitchers(away)].map(p=>[p.id,p])).values()]:[];
    const preStats=watchBox?new Map(watchPlayers.map(p=>[p.id,{...p.stats}])):null;
    const startOutsH=spHome.stats.outs,startOutsA=spAway.stats.outs;
    const outsBefore=new Map([...pitchers(home),...pitchers(away)].map(p=>[p.id,p.stats.outs]));
    spHome.stats.gs++;spAway.stats.gs++;
    const appear={bat:new Set(),pitch:new Set()};

    let homeScore=0,awayScore=0;
    let closerH=null,closerA=null;
    for(let i=1;i<=12;i++){
      const awayPitcher=choosePitcher(home,i,spHome,homeScore-awayScore);
      const top=halfInning(away,home,awayPitcher,lineupA,indexes,i,null,appear,events);
      inningsA.push(top.run);awayScore+=top.run;
      if(awayPitcher.pos==='CP')closerH=awayPitcher;

      const homePitcher=choosePitcher(away,i,spAway,awayScore-homeScore);
      const bot=halfInning(home,away,homePitcher,lineupH,indexes,i,{current:homeScore,away:awayScore},appear,events);
      inningsH.push(bot.run);homeScore+=bot.run;

      if(i>=9&&(homeScore!==awayScore||bot.walkOff))break;
    }
    home.rs+=homeScore;home.ra+=awayScore;away.rs+=awayScore;away.ra+=homeScore;
    let outcome='draw';
    if(homeScore>awayScore){home.wins++;away.losses++;outcome='home'}
    else if(awayScore>homeScore){away.wins++;home.losses++;outcome='away'}
    else{home.ties++;away.ties++}
    if(outcome!=='draw'){
      const winner=outcome==='home'?home:away,loser=outcome==='home'?away:home;
      const wSP=outcome==='home'?spHome:spAway,lSP=outcome==='home'?spAway:spHome;
      const reliever=pitchers(winner).find(p=>p.pos==='RP'&&appear.pitch.has(p.id));
      const wPitch=(wSP.stats.outs-(outcome==='home'?startOutsH:startOutsA)>=15 ? wSP : reliever)||wSP;
      wPitch.stats.w++;lSP.stats.l++;
      const clos=outcome==='home'?closerH:closerA;
      if(clos&&clos.id!==wPitch.id&&Math.abs(homeScore-awayScore)<=3)clos.stats.sv++;
    }
    const result={id:game.games.length+1,year:game.year,day:game.day+1,
      date:calendarNextDay()?.date||null,home:home.id,away:away.id,homeScore,awayScore,inningsH,inningsA,events:events.slice(0,8),outcome,spHome:spHome.id,spAway:spAway.id};
    if(watchBox){
      const delta=(p,k)=>Number(p.stats[k]||0)-Number(preStats.get(p.id)?.[k]||0);

  function teamScreen(){

    else content=`<div class="roster-summary"><div><small>支配下</small><b>${own(t).length}<span> / 30</span></b></div><div><small>投手</small><b>${pitchers(t).length}</b></div><div><small>野手</small><b>${hitters(t).length}</b></div><div><small>年俸総額</small><b>${fmtSalary(payroll(t))}</b></div></div><div class="section-label">野手 ${hitters(t).length}名</div>${hitters(t).sort((a,b)=>rating(b)-rating(a)).map(p=>playerCard(p)).join('')}<div class="section-label">投手 ${pitchers(t).length}名</div>${pitchers(t).sort((a,b)=>rating(b)-rating(a)).map(p=>playerCard(p)).join('')}`;

  function frontOfficeScreen(){
    const t=myTeam(),last=gameByTeam(t.id),next=game.day<143?game.schedule[game.day].find(m=>m.home===t.id||m.away===t.id):null;

    <section class="panel desk-panel"><div class="desk-heading"><div><div class="eyebrow">GM DESK</div><h3>業務一覧</h3><small>判断と決断が球団の未来を変える</small></div><button class="btn primary" data-action="advance-day" ${game.day>=143?'disabled':''}>▶ 1日進める</button></div><button class="desk-task" data-action="tab" data-tab="roster" data-roster="lineup"><span>⚾</span><span><b>スタメン・先発の確認</b><small>打順とローテーションを組む</small></span><em> › </em></button><button class="desk-task" data-action="tab" data-tab="market"><span>✦</span><span><b>自由契約選手の獲得</b><small>${freeAgents().length}名が所属先を探しています</small></span><em> › </em></button><button class="desk-task" data-action="tab" data-tab="business"><span>¥</span><span><b>予算・年俸をチェック</b><small>今季の支払予定を確認する</small></span><em> › </em></button></section>
    <section class="panel"><div class="panel-head"><h3 class="panel-title">日程を進める</h3><span class="pill">${getDayText()}</span></div>${progressButtons()}</section><section class="panel"><div class="panel-head"><h3 class="panel-title">直近の試合結果</h3></div>${lastGamePanel()}</section><section class="panel"><div class="panel-head"><h3 class="panel-title">リーグ順位</h3><button class="btn sm outline" data-action="tab" data-tab="records">順位表を見る</button></div>${standingTable(t.league,true)}</section><section class="panel"><h3 class="panel-title">クラブニュース</h3>${game.news.slice(0,6).map(n=>`<div class="event">${h(n)}</div>`).join('')}</section>`;
  }
  function businessScreen(){return `<div class="screen-top"><div class="eyebrow">BUSINESS & FINANCE</div><h2>球団経営</h2></div><div class="subtabs">${[['finance','収支・予算'],['market','補強市場']].map(([key,label])=>`<button class="subtab ${ui.businessSub===key?'active':''}" data-action="business-sub" data-sub="${key}">${label}</button>`).join('')}</div>${ui.businessSub==='market'?marketScreen():financeScreen()}`}
  function injuryAlertScreen(){
    const e=game.pendingEvent,p=e&&getPlayer(e.playerId),club=e&&getTeam(e.teamId);
    if(!e)return '';
    return `<div class="injury-alert-screen">
      <div class="eyebrow">CLUB MEDICAL REPORT · IMPORTANT</div>
      <h2>⚕ ${e.level==='serious'?'長期離脱の速報':'選手負傷のお知らせ'}</h2>
      <div class="injury-alert-date">${formatCalendarDate(e.date,true)} · ${club?h(club.name):''}</div>
      <div class="injury-alert-name">${p?h(p.name):'選手'} <span class="injury-alert-level">${h(e.label)}</span></div>
      <p class="injury-alert-copy">試合後のコンディション確認で負傷が判明。復帰の目安は約<strong>${e.days}日</strong>です。回復まで試合に出場できません。</p>
      <p class="small">代替の健康な選手をスタメン候補へ自動補充します。必要なら打順・ローテーションを編成画面で見直してください。</p>
      <button class="btn primary full" data-action="injury-ack">報告を確認して本部へ</button>

  function monthlyReviewScreen(history=false){
    const requested=history?ui.monthHistory:game.pendingMonth;
    const r=game.monthlyArchive?.find(v=>v.year===requested?.year&&v.id===requested?.id);
    if(!r)return `<section class="panel"><h3>月次報告</h3><button class="btn primary full" data-action="finish-month">確認</button></section>`;
    return `<div class="month-review"><div class="eyebrow">MONTHLY REPORT</div><h2>${r.year}年${Number(r.month.slice(-2))}月の月次報告</h2>
      <p class="small">${formatCalendarDate(r.date)}締め</p>
      <div class="grid3"><div class="metric"><div class="lab">勝利</div><div class="val">${r.wins}</div></div><div class="metric"><div class="lab">敗戦</div><div class="val">${r.losses}</div></div><div class="metric"><div class="lab">引分</div><div class="val">${r.ties}</div></div></div>
      <section class="panel"><h3 class="panel-title">月次収支（暫定見込み）</h3>
        <p class="small">収入見込み ${fmtMoney(r.estimatedRevenue)} ／ 年俸負担見込み ${fmtMoney(r.estimatedPayroll)}</p>
        <p class="small">※現在は入出金しません。融資・支払不能の判定は未実装で、精算は従来どおり年末です。</p></section>
      <section class="panel"><h3 class="panel-title">選手能力の月間変動</h3>
        ${r.changes?.length?r.changes.map(x=>`<div class="monthly-skill-row"><b>${h(x.name)}</b><span>${h(x.label)}</span><span>${x.from} → ${x.to}</span><strong class="${x.delta>0?'up':'down'}">${x.delta>0?'+':''}${x.delta}</strong></div>`).join(''):'<p class="small">今月は能力値の変動がありませんでした。</p>'}</section>
      <section class="panel"><h3 class="panel-title">今月の主なニュース</h3>
        ${r.news?.length?r.news.map(n=>`<div class="event">${h(n)}</div>`).join(''):'<p class="small">今月の主なニュースはありません。</p>'}
      </section>
      <button class="btn primary full" data-action="${history?'monthly-history-close':'finish-month'}">${history?'履歴を閉じる':'月次報告を確認する ›'}</button></div>`;
  }
  function calendarScreen(){
    const cal=game.calendar||calendarForSeason(game.year);
    const midName={allstar:'オールスター',world:'世界シリーズ',international:'国際代表大会'}[cal.midseason];
    const groups=new Map();
    for(const d of cal.days){const m=monthKey(d.date);if(!groups.has(m))groups.set(m,[]);groups.get(m).push(d)}
    const next=calendarNextDay(),myId=game.selectedId;
    return `<section class="panel"><h3 class="panel-title">${game.year}年 年間日程</h3>
      <p class="small">${formatCalendarDate(cal.startDate)}〜${formatCalendarDate(cal.endDate)} ／ 143試合（リーグ125＋交流18）</p>
      <div class="year-record"><b>${game.day}/143試合</b></div>
      <p class="small">次の日：${next?formatCalendarDate(next.date):'全日程終了'}</p>
      <p class="small">交流戦：第56〜73戦 ／ 中盤：${midName}の休止期間 ※大会試合は未実装</p>
      <div class="calendar-months">
      ${[...groups.entries()].map(([key,days])=>`<details class="calendar-month" ${key===(next?monthKey(next.date):monthKey(cal.endDate))?'open':''}>
        <summary>${Number(key.slice(-2))}月　${days.filter(d=>d.type==='game').length}試合${game.monthlyArchive?.some(x=>x.year===game.year&&x.id===key)?' ✓月次報告':''}</summary>
        ${days.map(d=>{
          const match=d.type==='game'?game.schedule[d.gameNo-1]?.find(m=>m.home===myId||m.away===myId):null;
          const opp=match?getTeam(match.home===myId?match.away:match.home):null;
          const result=d.type==='game'&&d.gameNo<=game.day?game.games.find(g=>g.day===d.gameNo&&(g.home===myId||g.away===myId)):null;
          return `<div class="calendar-day ${d.type}"><span>${formatCalendarDate(d.date)}</span><span>${d.type==='game'?'第'+d.gameNo+'戦　'+(opp?`<span class="league-club-name ${leagueClass(opp.league)}">${h(opp.short)}</span>`:''):d.type==='midseason'?midName+'休止':d.reason}</span><strong>${result?result.homeScore+'-'+result.awayScore:''}</strong></div>`;
        }).join('')}
      </details>`).join('')}</div></section>`;
  }
  function archiveScreen(){
    const items=(game.seasonArchive||[]).slice().sort((a,b)=>b.year-a.year);
    if(!items.length)return `<section class="panel"><h3 class="panel-title">歴代球団史</h3><p class="small">最初のシーズンを終えると年度別記録が蓄積されます。過去年度は削除しません。</p></section>`;
    const first=items[items.length-1].year;
    const decades=new Map();
    for(const item of items){
      const group=Math.floor((item.year-first)/10);
      if(!decades.has(group))decades.set(group,[]);
      decades.get(group).push(item);
    }
    const groups=[...decades.entries()].sort((a,b)=>b[0]-a[0]);
    return `<section class="panel"><h3 class="panel-title">歴代球団史</h3><p class="small">${items.length}シーズン保存済み。10年ごとに振り返れます。</p>
      ${groups.map(([group,years],i)=>`<details class="panel" ${i===0?'open':''}><summary style="cursor:pointer;font-weight:800">${first+group*10}〜${first+group*10+9}年　(${years.length}シーズン)</summary>
      ${years.map(s=>{
        const me=s.standings?.E?.concat(s.standings?.W||[]).find(t=>t.id===s.myTeamId);
        const east=s.standings?.E?.[0],west=s.standings?.W?.[0];
        const champion=s.postseason?.championId;
        const final=champion==null?'記録なし':(s.standings?.E||[]).concat(s.standings?.W||[]).find(t=>t.id===champion)?.name||'不明';
        return `<div class="event"><b>${s.year}年　${me?h(me.name):'球団不明'}　${me?me.rank+'位':'—'}</b><p class="small" style="margin:4px 0"> ${me?me.wins+'勝 '+me.losses+'敗 '+me.ties+'分':''}</p><p class="tiny" style="margin:0">${leagueTag('E',true)} 優勝：${east?h(east.name):'—'} ／ ${leagueTag('W',true)} 優勝：${west?h(west.name):'—'}<br>日本一：${h(final)}／個人表彰：${s.awards?.length||0}件</p></div>`;
      }).join('')}</details>`).join('')}
      </section>`;
  }
  function recordScreen(){return `<div class="screen-top"><div class="eyebrow">LEAGUE ARCHIVE</div><h2>記録・順位</h2></div><div class="subtabs">${[['standings','順位表'],['stats','個人成績'],['calendar','日程'],['archive','球団史']].map(([key,label])=>`<button class="subtab ${ui.recordSub===key?'active':''}" data-action="record-sub" data-sub="${key}">${label}</button>`).join('')}</div>${ui.recordSub==='archive'?archiveScreen():ui.recordSub==='calendar'?calendarScreen():ui.recordSub==='stats'?statScreen():standingsScreen()}`}
  function playerDetails(){
    const p=getPlayer(ui.playerDetail);if(!p){ui.playerDetail=null;return teamScreen()}
    ensurePlayerExtras(p);
    const t=p.teamId>=0?getTeam(p.teamId):null,pitch=isPitch(p);
    const abilities=pitch?[['球威',p.stuff],['制球',p.control],['変化',Math.round((p.stuff+p.control)/2)],['体力',p.stamina],['精神',p.talent]]:[['巧打',p.contact],['長打',p.power],['走力',p.speed],['守備',p.defense],['精神',p.talent]];
    let body='';
    if(ui.playerDetailTab==='abilities')body=`<section class="panel"><div class="panel-head"><h3 class="panel-title">能力・適性</h3><span class="pill">総合評価 ${rating(p)}</span></div>${abilities.map(([label,v])=>`<div class="ability-progress"><span>${label}</span><div class="ability-track"><i style="width:${v}%;background:${rankColor(v)}"></i></div><b style="color:${rankColor(v)}">${grade(v)}</b><em>${v}</em></div>`).join('')}<p class="tiny">試作版では表示用ランクに変換。試合計算は引き続き元の能力値を使用します。</p></section>`;
    if(ui.playerDetailTab==='growth'){
      const ys=p.overallHistory||[],min=30,max=100,n=Math.max(1,ys.length-1);
      const pts=ys.map((s,i)=>({x:40+i*280/n,y:187-(s.overall-min)/(max-min)*141,...s}));
      body=`<section class="panel"><h3 class="panel-title">総合能力の推移</h3><div class="chart-holder"><svg class="growth-svg" viewBox="0 0 360 235" role="img" aria-label="年度別総合能力の推移">${[40,60,80,100].map(v=>`<line x1="36" y1="${187-(v-min)/(max-min)*141}" x2="333" y2="${187-(v-min)/(max-min)*141}" stroke="#3c4e63" stroke-width="1"/><text x="339" y="${190-(v-min)/(max-min)*141}" fill="#9daabd" font-size="10">${v}</text>`).join('')}<polyline points="${pts.map(v=>`${v.x},${v.y}`).join(' ')}" fill="none" stroke="#efb83d" stroke-width="3" stroke-linejoin="round"/>${pts.map(v=>`<circle cx="${v.x}" cy="${v.y}" r="5.5" fill="#38c8a8"/><text x="${v.x}" y="${v.y-13}" text-anchor="middle" font-size="12" fill="#e8edfa" font-weight="700">${v.overall}</text><text x="${v.x}" y="216" text-anchor="middle" font-size="11" fill="#a6b6c9">${v.year}</text>`).join('')}</svg></div><p class="tiny">今後のシーズン経過時に、総合能力の推移を記録します。</p></section>`;
    }
    if(ui.playerDetailTab==='stats'){
      const rows=[...p.seasonHistory,{year:game.year,teamId:p.teamId,stats:p.stats}].filter((s,i,a)=>a.findIndex(r=>r.year===s.year)===i);
      body=`<section class="panel"><h3 class="panel-title">年度別成績</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>年度</th><th>球団</th>${pitch?'<th>登板</th><th>投球回</th><th>防御率</th><th>勝</th><th>敗</th><th>奪三振</th>':'<th>試合</th><th>打率</th><th>安打</th><th>本塁打</th><th>打点</th><th>盗塁</th>'}</tr></thead><tbody>${rows.map(s=>{const st=s.stats,tm=getTeam(s.teamId);return `<tr><td>${s.year}</td><td>${tm?h(tm.short):'FA'}</td>${pitch?`<td>${st.g}</td><td>${Math.floor(st.outs/3)}.${st.outs%3}</td><td>${st.outs?(st.er*27/st.outs).toFixed(2):'--.--'}</td><td>${st.w}</td><td>${st.l}</td><td>${st.k}</td>`:`<td>${st.g}</td><td>${st.ab?(st.h/st.ab).toFixed(3).replace(/^0/,''):'---'}</td><td>${st.h}</td><td>${st.hr}</td><td>${st.rbi}</td><td>${st.sb}</td>`}</tr>`}).join('')}</tbody></table></div><p class="tiny">v0.1以前に終了した年度の成績は保存されていないため、復元できません。</p></section>`;
    }
    if(ui.playerDetailTab==='memo')body=`<section class="panel"><h3 class="panel-title">GMメモ</h3><p class="small">この選手について残したメモはセーブデータに保存されます。</p><textarea class="player-memo" data-change="player-memo" data-id="${p.id}" placeholder="来季の構想・育成方針・補強候補などを記録">${h(p.memo)}</textarea><div class="tiny">入力欄から離れると保存されます。</div></section>`;
    return `<div class="detail-back"><button class="ghost-btn" data-action="close-player">‹ 戻る</button></div><div class="player-profile"><div class="player-club">${t?h(t.name):'自由契約選手'} <span>${namePos(p.pos)}</span></div><div class="profile-row">${portrait(p)}<div><h2>${h(p.name)} <small>(${p.age})</small></h2><div class="profile-meta">${positionFull(p.pos)} · ${throwBat(p)} · ${fmtSalary(p.salary)}</div><div class="profile-meta">総合 ${rating(p)} · 愛着 ♥${p.affinity}</div></div></div></div><div class="player-detail-condition">${conditionBar(p)}<p class="tiny">コンディションは現在の疲労度です。投手能力の「体力」とは別に管理されます。</p></div><div class="subtabs detail-tabs">${[['abilities','能力'],['growth','能力推移'],['stats','成績'],['memo','メモ']].map(([key,label])=>`<button class="subtab ${ui.playerDetailTab===key?'active':''}" data-action="detail-tab" data-sub="${key}">${label}</button>`).join('')}</div>${body}`;
  }

  function teamChoice(t){return `<button class="team-card ${leagueClass(t.league)}" data-action="select-team" data-id="${t.id}">${teamBadge(t)}<div style="min-width:0"><strong>${h(t.name)}</strong><br>${leagueTag(t.league)}</div></button>`}
  function progressButtons(){
    if(game.day>=143)return `<button class="btn primary full" data-action="next-season">🏆 表彰・精算して${game.year+1}年へ進む</button>`;
    const mode=game.playbackMode||'normal',options=[['normal','通常 2秒/日'],['fast','倍速 1秒/日'],['skip','日程スキップ']];
    return `<div class="calendar-playback">
      <div class="small">日程の進行速度（休養日も日付が進みます）</div>
      <div class="calendar-speed">${options.map(([v,text])=>`<button class="chip ${mode===v?'active':''}" data-action="playback-mode" data-mode="${v}" aria-pressed="${mode===v}">${text}</button>`).join('')}</div>
      </div>

      <div class="actions" style="margin-top:9px"><button class="btn primary" data-action="advance-day">▶ 1日進める</button><button class="btn soft" data-action="advance" data-days="7">7試合</button><button class="btn soft" data-action="advance" data-days="30">30試合</button></div>
      <button class="btn outline full" style="margin-top:9px" data-action="advance" data-days="143">シーズン終了まで進行</button>`;

  function lastGamePanel(){
    const t=myTeam(),g=gameByTeam(t.id);
    if(!g)return `<div class="empty">シーズンはまだ始まっていません。</div>`;
    const opp=getTeam(g.home===t.id?g.away:g.home);
    const myScore=g.home===t.id?g.homeScore:g.awayScore;
    const otherScore=g.home===t.id?g.awayScore:g.homeScore;
    const tone=myScore>otherScore?'green':myScore<otherScore?'red':'';
    const result=myScore>otherScore?'勝利':myScore<otherScore?'敗戦':'引分';
    return `<div class="box-result"><div class="card-flex"><div><span class="tag ${tone}">${result}</span> <span class="small">${g.year}年 第${g.day}戦 / vs ${h(opp.name)}</span><div class="score-big">${myScore} - ${otherScore}</div></div><button class="btn sm outline" data-action="game-details" data-id="${g.id}">詳細を見る</button></div></div>`;
  }
  function homeScreen(){
    const t=myTeam(),ranking=rankings(t.league),position=ranking.findIndex(x=>x.id===t.id)+1;
    const next=game.day>=143?null:game.schedule[game.day].find(m=>m.home===t.id||m.away===t.id);
    const opp=next?getTeam(next.home===t.id?next.away:next.home):null;
    return `<h2 class="page-title">球団ホーム</h2><p class="page-sub">${game.year}年・第${game.day}試合終了 / 全143試合 <span class="tag ${game.day>=143?'yellow':'blue'}">${game.day===143?'シーズン終了':'レギュラーシーズン'}</span></p>
    <div class="grid3" style="margin-bottom:13px"><div class="metric"><div class="lab">順位</div><div class="val">${position}<small style="font-size:13.5px">位</small></div><div class="sub">${leagueTag(t.league)}</div></div><div class="metric"><div class="lab">勝敗</div><div class="val" style="font-size:18.7px">${t.wins}-${t.losses}</div><div class="sub">${t.ties}分 / 勝率 ${pct(t.wins,t.losses)}</div></div><div class="metric"><div class="lab">球団資金</div><div class="val" style="font-size:18.7px">${fmtMoney(t.cash)}</div><div class="sub">年俸総額 ${fmtSalary(payroll(t))}</div></div></div>
    <div class="main-cols"><div><section class="panel"><div class="panel-head"><h3 class="panel-title">${next?'次の対戦':'ペナント終了'}</h3><span class="pill">${getDayText()}</span></div>${next?`<div class="next-match"><div class="match-team">${teamBadge(t)}<strong>${h(t.short)}</strong></div><div class="vs">VS</div><div class="match-team">${teamBadge(opp)}<strong>${h(opp.short)}</strong></div></div><div class="small" style="text-align:center;margin-bottom:13px">${next.home===t.id?'ホーム':'ビジター'}　/　先発予定：${h(getPlayer(t.rotation[t.starterIndex%t.rotation.length])?.name||'未定')}</div>`:`<p class="small">シーズン終了。順位が確定しました。翌シーズンに進むと選手が成長・引退し、新人が補充されます。</p>`}<div class="progress-bar" style="margin-bottom:14px"><div class="progress-inner" style="width:${game.day/143*100}%"></div></div>${progressButtons()}</section>
    <section class="panel"><div class="panel-head"><h3 class="panel-title">直近の試合</h3></div>${lastGamePanel()}</section></div>
    <div><section class="panel"><div class="panel-head"><h3 class="panel-title league-heading ${leagueClass(t.league)}">${leagueName(t.league)}順位表</h3><button class="btn sm outline" data-action="tab" data-tab="standings">すべて見る</button></div>${standingTable(t.league,true)}</section><section class="panel"><div class="panel-head"><h3 class="panel-title">リーグニュース</h3></div>${game.news.slice(0,5).map(e=>`<div class="event">${h(e)}</div>`).join('')}</section></div></div>`;
  }
  function standingTable(league,compact=false){
    const rows=rankings(league);
    return `<div class="table-wrap league-table ${leagueClass(league)}"><table class="data-table"><thead><tr><th>順位・球団</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th>${compact?'':'<th>得点</th><th>失点</th><th>得失点差</th>'}</tr></thead><tbody>${rows.map((t,i)=>`<tr class="${t.id===game.selectedId?'focus':''}"><td class="name"><span class="league-stand-rank">${i+1}.</span> <span class="league-club-name ${leagueClass(t.league)}">${h(t.short)}</span>${i===0&&game.day>0?' 👑':''}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.ties}</td><td class="num-strong">${pct(t.wins,t.losses)}</td>${compact?'':`<td>${t.rs}</td><td>${t.ra}</td><td>${t.rs-t.ra>0?'+':''}${t.rs-t.ra}</td>`}</tr>`).join('')}</tbody></table></div>`;
  }
  function standingsScreen(){
    return `<h2 class="page-title">順位表</h2><p class="page-sub">${game.year}年　第${game.day}/143試合終了</p><div class="control-bar"><div class="chips"><button class="chip league-tab league-east ${ui.league==='E'?'active':''}" data-action="league" data-league="E">東リーグ</button><button class="chip league-tab league-west ${ui.league==='W'?'active':''}" data-action="league" data-league="W">西リーグ</button></div></div><section class="panel league-panel ${leagueClass(ui.league)}"><div class="panel-head"><h3 class="panel-title league-heading ${leagueClass(ui.league)}">${leagueName(ui.league)}</h3><span class="pill">各球団143試合</span></div>${standingTable(ui.league)}<p class="tiny" style="margin:12px 0 0">勝率順、同率時は勝数と得失点差で順位を決定。延長12回で同点の場合は引き分け。</p></section><section class="panel"><h3 class="panel-title">過去のリーグ優勝</h3>${game.history.length?game.history.slice(0,10).map(s=>`<div class="event league-history-row"><b>${s.year}年</b>　${leagueTag('E',true)} ${h(s.east)}　/　${leagueTag('W',true)} ${h(s.west)}</div>`).join(''):'<div class="empty">最初のシーズン終了後に記録されます。</div>'}</section>`;
  }
  function currentSeasonLine(p){
    const st=p.stats;
    return isPitch(p)?`<div class="player-season-line is-pitcher" aria-label="今季投手成績">
      <span class="season-title">今季成績</span><span>登板 <strong>${st.g}</strong></span><span>防御率 <strong>${era(p)}</strong></span><span>勝敗 <strong>${st.w}-${st.l}</strong></span><span>投球回 <strong>${Math.floor(st.outs/3)}.${st.outs%3}</strong></span><span>K <strong>${st.k}</strong></span>
    </div>`:
      `<div class="player-season-line is-batter" aria-label="今季野手成績">
      <span class="season-title">今季成績</span><span>試合 <strong>${st.g}</strong></span><span>打率 <strong>${avg(p)}</strong></span><span>本塁打 <strong>${st.hr}</strong></span><span>打点 <strong>${st.rbi}</strong></span><span>盗塁 <strong>${st.sb}</strong></span>
    </div>`;
  }
  function abilityShort(label,value){return `<span class="quick-ability">${label} <b style="color:${gradeBriefColor(value)}">${gradeBrief(value)}</b></span>`}
  function nextStarterInfo(t){
    repairTeam(t);
    const next=t.rotation.length?getPlayer(t.rotation[t.starterIndex%t.rotation.length]):null;
    return next?`<div class="next-start-alert"><strong>⚾ 次の先発予定：${h(next.name)}（${gradeBrief(rating(next))}）</strong>${currentSeasonLine(next)}<small>ローテーション順を変更すると、次の先発にも反映されます。</small></div>`:'';
  }
  function rosterActions(){return `<div class="roster-fast-actions"><button class="btn outline" data-action="back-to-hq">‹ 本部に戻る</button><button class="btn primary" data-action="advance-day" ${game.day>=143?'disabled':''}>▶ この編成で次の日へ</button></div>`}
  function rosterScreen(){
    const t=myTeam();repairTeam(t);
    const menus=[['lineup','打順'],['rotation','先発'],['players','全選手']];
    return `<div class="roster-screen"><div class="roster-intro"><div><h2 class="page-title">選手・チーム編成</h2><p class="page-sub">${game.year}年 · ${game.day}試合終了時点の今季成績</p></div><button class="btn sm outline" data-action="back-to-hq">‹ 戻る</button></div><div class="control-bar"><div class="chips">${menus.map(([tab,label])=>`<button class="chip ${ui.rosterMode===tab?'active':''}" data-action="roster-mode" data-mode="${tab}">${label}</button>`).join('')}</div><span class="pill">所属 ${own(t).length}/30人</span></div>${ui.rosterMode==='lineup'?lineupScreen(t):ui.rosterMode==='rotation'?rotationScreen(t):playersScreen(t)}${rosterActions()}</div>`;
  }
  function lineupScreen(t){
    const arr=hitters(t).filter(availableForGame).sort((a,b)=>rating(b)-rating(a));
    const fielding=syncLineupFielding(t);
    return `<section class="panel lineup-wrap"><div class="panel-head"><h3 class="panel-title">スターティングメンバー</h3><span class="small">DH制・9人</span></div><p class="small">名前を押すと選手入れ替え、番号横の守備位置を押すと守備変更、▲ ▼で打順変更。能力はS〜F表示。</p>${t.lineup.map((id,i)=>{
      const p=getPlayer(id);
      if(!p)return '';
      const options=arr.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${h(x.name)}（${namePos(x.pos)}）総合${gradeBrief(rating(x))}</option>`).join('');
      return `<div class="lineup-item"><button type="button" class="lineup-n fielding-trigger tier-${fieldingTier(p,fielding[id])}" data-action="fielding-open" data-id="${id}" title="守備位置を変更：${positionFull(fielding[id]||p.pos)}" aria-label="${i+1}番 ${h(p.name)} の守備位置を変更">${i+1}<em>${namePos(fielding[id]||p.pos)}</em></button><div class="lineup-info"><select class="select" aria-label="${i+1}番打者" data-change="lineup" data-slot="${i}">${options}</select><div class="quick-abilities">${abilityShort('総合',rating(p))}${abilityShort('巧打',p.contact)}${abilityShort('長打',p.power)}${abilityShort('走力',p.speed)}${abilityShort('守備',p.defense)}</div></div><div class="lineup-buttons"><button class="btn icon sm outline" data-action="lineup-move" data-slot="${i}" data-direction="-1" ${i===0?'disabled':''} aria-label="打順を上げる">▲</button><button class="btn icon sm outline" data-action="lineup-move" data-slot="${i}" data-direction="1" ${i===8?'disabled':''} aria-label="打順を下げる">▼</button></div>${currentSeasonLine(p)}${conditionBar(p)}</div>`;
    }).join('')}<p class="tiny" style="margin:13px 0 0">※守備適性はメイン100%・サブ82%・適性外55%。DHは守備しません。守備力は相手の安打確率に影響します。</p></section>`;
  }
  function rotationScreen(t){
    const all=pitchers(t).filter(p=>p.pos==='SP'&&availableForGame(p)).sort((a,b)=>rating(b)-rating(a));
    return `${nextStarterInfo(t)}<section class="panel lineup-wrap"><div class="panel-head"><h3 class="panel-title">先発ローテーション</h3><span class="pill">5人制</span></div><p class="small">投手ごとの今季防御率・登板・勝敗を確認しながら、登板順を変更できます。</p>${t.rotation.map((id,i)=>{
      const p=getPlayer(id);if(!p)return '';

      return `<div class="lineup-item"><span class="lineup-n" title="先発投手">${i+1}<em>先</em></span><div class="lineup-info"><select class="select" data-change="rotation" data-slot="${i}" aria-label="先発${i+1}番手">${all.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${h(x.name)}（${gradeBrief(rating(x))}）</option>`).join('')}</select><div class="quick-abilities">${abilityShort('総合',rating(p))}${abilityShort('球威',p.stuff)}${abilityShort('制球',p.control)}${abilityShort('体力',p.stamina)}${active?'<span class="tag green">次戦登板</span>':''}</div></div><div class="lineup-buttons"><button class="btn icon sm outline" data-action="rotation-move" data-slot="${i}" data-direction="-1" ${i===0?'disabled':''} aria-label="登板順を上げる">▲</button><button class="btn icon sm outline" data-action="rotation-move" data-slot="${i}" data-direction="1" ${i===t.rotation.length-1?'disabled':''} aria-label="登板順を下げる">▼</button></div>${currentSeasonLine(p)}${conditionBar(p)}</div>`;
    }).join('')}</section>`;
  }
  function playersScreen(t){

  function playerTable(players,pitch,withRelease=false){
    return `<div class="table-wrap"><table class="data-table"><thead><tr><th>選手名</th><th>年齢</th><th>守備</th><th>総合</th>${pitch?'<th>球威</th><th>制球</th><th>スタミナ</th>':'<th>ミート</th><th>パワー</th><th>走力</th><th>守備力</th>'}<th>年俸</th>${withRelease?'<th>操作</th>':''}</tr></thead><tbody>${players.map(p=>`<tr><td class="name">${h(p.name)}</td><td>${p.age}</td><td>${namePos(p.pos)}</td><td class="num-strong">${rating(p)}</td>${pitch?`<td>${p.stuff}</td><td>${p.control}</td><td>${p.stamina}</td>`:`<td>${p.contact}</td><td>${p.power}</td><td>${p.speed}</td><td>${p.defense}</td>`}<td>${fmtSalary(p.salary)}</td>${withRelease?`<td><button class="btn sm danger" data-action="ask-release" data-id="${p.id}">放出</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;

  function statScreen(){
    const selectable=[['all','全12球団'],['mine','自球団'],['E','東リーグ'],['W','西リーグ']];
    const players=game.players.filter(p=>p.teamId>=0 && (ui.statsScope==='all'||(ui.statsScope==='mine'?p.teamId===game.selectedId:getTeam(p.teamId).league===ui.statsScope)));
    const batting=ui.statsMode==='bat';
    let filtered=players.filter(p=>batting?!isPitch(p):isPitch(p));
    if(batting)filtered.sort((a,b)=>b.stats.hr-a.stats.hr || b.stats.h-a.stats.h || btrRating(b)-btrRating(a));
    else filtered.sort((a,b)=>b.stats.w-a.stats.w || b.stats.k-a.stats.k || rating(b)-rating(a));
    filtered=filtered.slice(0,30);
    return `<h2 class="page-title">個人成績ランキング</h2><p class="page-sub">毎試合の打席結果を集計して更新します。</p><div class="control-bar"><div class="chips"><button class="chip ${batting?'active':''}" data-action="stats-mode" data-mode="bat">打者</button><button class="chip ${!batting?'active':''}" data-action="stats-mode" data-mode="pitch">投手</button></div><select class="select" data-change="stats-scope">${selectable.map(([id,label])=>`<option value="${id}" ${ui.statsScope===id?'selected':''}>${id==='E'?'🔵 ':id==='W'?'🟡 ':''}${label}</option>`).join('')}</select></div><section class="panel"><div class="panel-head"><h3 class="panel-title">${batting?'打撃成績（本塁打順）':'投手成績（勝利数順）'}</h3><span class="pill">${game.day}/143 試合</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>選手</th><th>球団</th>${batting?'<th>打率</th><th>試合</th><th>打席</th><th>安打</th><th>本塁打</th><th>打点</th><th>盗塁</th>':'<th>防御率</th><th>試合</th><th>投球回</th><th>勝</th><th>敗</th><th>セーブ</th><th>奪三振</th>'}</tr></thead><tbody>${filtered.map(p=>`<tr><td class="name">${h(p.name)}</td><td><span class="league-club-name ${leagueClass(getTeam(p.teamId).league)}">${h(getTeam(p.teamId).short)}</span></td>${batting?`<td>${avg(p)}</td><td>${p.stats.g}</td><td>${p.stats.pa}</td><td>${p.stats.h}</td><td class="num-strong">${p.stats.hr}</td><td>${p.stats.rbi}</td><td>${p.stats.sb}</td>`:`<td>${era(p)}</td><td>${p.stats.g}</td><td>${(p.stats.outs/3).toFixed(1)}</td><td class="num-strong">${p.stats.w}</td><td>${p.stats.l}</td><td>${p.stats.sv}</td><td>${p.stats.k}</td>`}</tr>`).join('')}</tbody></table></div><p class="tiny" style="margin:13px 0 0">打率・防御率などは試作版の簡略ルールに基づく計算です。投球回の端数は内部ではアウト数で管理。</p></section>`;
  }
  function marketScreen(){

    return `<h2 class="page-title">FA補強市場</h2><p class="page-sub">候補選手を獲得し、戦力を強化。契約金は即時に球団資金から支払われます。</p><div class="grid3" style="margin-bottom:13px"><div class="metric"><div class="lab">現在の資金</div><div class="val finance-market-money">${fmtMoney(t.cash)}</div></div><div class="metric"><div class="lab">所属選手</div><div class="val">${own(t).length}<small style="font-size:12.5px">/30</small></div></div><div class="metric"><div class="lab">FA候補</div><div class="val">${agents.length}<small style="font-size:12.5px">人</small></div></div></div><div class="notice">獲得した選手は「編成」で打順や先発に設定できます。年俸は翌シーズンへの移行時に支払います。</div><section class="panel"><div class="panel-head"><h3 class="panel-title">自由契約選手</h3><span class="small">総合能力順</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>選手</th><th>年齢</th><th>守備</th><th>総合</th><th>年俸</th><th>契約金</th><th>獲得</th></tr></thead><tbody>${agents.map(p=>`<tr><td class="name">${h(p.name)}</td><td>${p.age}</td><td>${namePos(p.pos)}</td><td class="num-strong">${rating(p)}</td><td>${fmtSalary(p.salary)}</td><td>${fmtMoney(signingCost(p))}</td><td><button class="btn sm primary" data-action="sign" data-id="${p.id}" ${t.cash<signingCost(p)||own(t).length>=30?'disabled':''}>獲得</button></td></tr>`).join('')}</tbody></table></div></section>`;

    ${[...new Set((game.monthlyArchive||[]).map(m=>m.year))].sort((a,b)=>b-a).map(year=>`<details class="month-history-year" ${year===game.year?'open':''}>

    ui.busy=false;ui.pauseRequested=false;ui.autoPaused=false;ui.autoExitToHQ=false;ui.autoWait=null;
    clearPendingNewsTap();
    const games=game.games.slice(startId).filter(g=>g.year===game.year&&(g.home===game.selectedId||g.away===game.selectedId));
    const last=games[games.length-1];
    const completedSeason=game.day===SEASON_GAMES&&!oneDay;
    // Fast skip keeps the legacy batch report. Continuous playback has
    // already shown the daily report, so don't duplicate the final match.
    const showReview=!!last&&!game.pendingEvent&&(skip||completedSeason);
    if(showReview)game.pendingReview={year:game.year,day:last.day,gameId:last.id,
      count:game.day-startGame,gameIds:games.map(g=>g.id),
      mode:completedSeason?'season':game.day-startGame>=30?'30':game.day-startGame>=7?'7':'single'};
    if(!hasMore())game.advanceTarget=null;
    // Single-day results stay on screen until dismissed; the same applies to
    // the final visible result of a timed batch outside monthly boundaries.
    if(game.pendingEvent||showReview||(!oneDay&&game.pendingMonth)||skip||returnToHQ)ui.autoDay=null;
    if(returnToHQ)ui.tab='hq';
    save();render();window.scrollTo({top:0,behavior:'instant'});
    if(interrupted&&!returnToHQ&&!game.pendingReview&&!game.pendingMonth)
      showToast('日程の進行を停止しました。タップで再開できます');
  };
  function offseasonExperience(phase){
    const value=phase==='winter'?25:phase==='self'?22:30;
    for(const p of game.players.filter(p=>p.teamId!==null&&p.teamId>=0)){
      const ageFactor=p.age<=26?1.2:p.age>=34?.65:1;
      p.expPoints+=value*(.7+(p.talent||60)/180)*ageFactor;spendExperience(p);
    }
  }
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action;
    if(!['playback-mode','pause-calendar','auto-return-hq','auto-day-close','resume-calendar','injury-ack','finish-month','monthly-history-open','monthly-history-close','fielding-open','fielding-close','fielding-set','swap-open','swap-close','swap-select','batch-expand','ceremony-start','ceremony-next'].includes(action))return;
    e.preventDefault();e.stopPropagation();
    if(action==='pause-calendar'){toggleAutoPause();return;}
    if(action==='auto-return-hq'){
      // Only a paused playback can exit this way. Release its pending timer
      // so the awaiting advance loop can finish and save the resume target.
      if(!ui.busy||!ui.autoPaused)return;
      ui.autoExitToHQ=true;
      ui.pauseRequested=true;
      clearPendingNewsTap();
      ui.autoWait?.skip();
      return;
    }
    if(action==='auto-day-close'){
      if(ui.busy||!ui.autoDay)return;
      ui.autoDay=null;ui.tab='hq';render();window.scrollTo({top:0,behavior:'instant'});return;
    }
    if(action==='playback-mode'){
      if(ui.busy||game.pendingMonth||game.pendingReview)return;
      if(['normal','fast','skip'].includes(el.dataset.mode)){
        game.playbackMode=el.dataset.mode;save();render();
      }
      return;
    }
    if(action==='resume-calendar'){
      if(ui.busy||game.pendingMonth||game.pendingReview||!advanceTargetRemaining())return;
      ui.autoDay=null;void advance('resume');return;
    }
    if(action==='injury-ack'){
      if(ui.busy||!game.pendingEvent)return;
      game.pendingEvent=null;ui.autoDay=null;ui.tab='hq';save();render();
      window.scrollTo({top:0,behavior:'instant'});return;
    }
    if(action==='finish-month'){
      if(ui.busy||!game.pendingMonth)return;
      game.pendingMonth=null;ui.tab='hq';save();render();window.scrollTo({top:0,behavior:'instant'});return;
    }
    if(action==='monthly-history-open'){
      if(ui.busy||game.pendingReview||game.pendingMonth)return;
      const report=game.monthlyArchive?.find(m=>m.year===Number(el.dataset.year)&&m.id===el.dataset.month);
      if(!report)return;
      ui.monthHistory={year:report.year,id:report.id};render();window.scrollTo({top:0,behavior:'instant'});return;
    }
    if(action==='monthly-history-close'){ui.monthHistory=null;render();window.scrollTo({top:0,behavior:'instant'});return;}
    if(action==='fielding-open'){
      if(game.pendingReview||ui.busy)return;
      const id=Number(el.dataset.id);
      if(!myTeam().lineup.includes(id))return;
      ui.swap=null;ui.fielding={id};render();return;
    }
    if(action==='fielding-close'){
      // Tapping an explanatory part inside the dialog must not dismiss it.
      if(el.classList?.contains('fielding-overlay')&&e.target.closest('[data-stop="true"]'))return;
      ui.fielding=null;render();return;
    }
    if(action==='fielding-set'){
      if(!ui.fielding||game.pendingReview||ui.busy)return;
      const id=Number(el.dataset.id),role=el.dataset.role;
      if(id!==ui.fielding.id)return;
      const changed=assignFieldingRole(myTeam(),id,role);
      ui.fielding=null;
      if(changed)save();
      render();
      if(changed)showToast('守備位置を変更しました');
      return;
    }
    if(action==='swap-open'){ui.fielding=null;ui.swap={kind:el.dataset.kind,slot:Number(el.dataset.slot)};render();return;}
    if(action==='swap-close'){ui.swap=null;document.querySelector('.overlay:has(.swap-dialog)')?.remove();return;}
    if(action==='swap-select'){
      if(!ui.swap||!availableForGame(getPlayer(el.dataset.id)))return;
      const arr=ui.swap.kind==='lineup'?myTeam().lineup:myTeam().rotation,slot=ui.swap.slot,id=Number(el.dataset.id),old=arr[slot],other=arr.indexOf(id);
      if(other>=0)arr[other]=old;
      arr[slot]=id;if(ui.swap.kind==='lineup')syncLineupFielding(myTeam());ui.swap=null;save();render();return;
    }
    if(action==='batch-expand'){ui.batchExpanded=!ui.batchExpanded;render();return;}
    if(action==='ceremony-start'){if(game.day!==143)return;game.ceremonyStage='awards-all';ui.tab='hq';save();render();window.scrollTo(0,0);return;}
    if(action==='ceremony-next'){
      if(game.day!==143)return;
      const stage=game.ceremonyStage;
      if(stage==='awards-all')game.ceremonyStage='awards-mine';
      else if(stage==='awards-mine')game.ceremonyStage='settlement';
      else if(stage==='settlement')game.ceremonyStage='winter';
      else if(stage==='winter'){offseasonExperience('winter');game.ceremonyStage='self';}
      else if(stage==='self'){offseasonExperience('self');game.ceremonyStage='camp';}
      else if(stage==='camp'){
        offseasonExperience('camp');game.ceremonyStage=null;nextSeason();
      }
      save();ui.tab='hq';render();window.scrollTo(0,0);return;
    }
  },true);
  document.addEventListener('change',e=>{
    if(e.target.dataset.change==='training-focus'){const p=getPlayer(e.target.dataset.id);if(p&&p.teamId===game.selectedId){p.trainFocus=e.target.value;save();showToast('育成方針を保存しました');}}
  },true);

  // In the background, abort the active timer and retain the progress target
  // for an explicit resume when the user returns to the tab.
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&ui.busy){
      ui.pauseRequested=true;
      ui.autoWait?.skip();
    }
  });
  document.addEventListener('click',e=>{
    if(!ui.busy||!ui.autoDay||!ui.autoWait||game.playbackMode==='skip')return;
    if(!e.target.closest('.app-shell'))return;
    if(e.target.closest('[data-action],button,a,input,select,textarea,[role="button"]'))return;
    if(ui.autoDay.type==='game'){
      clearPendingNewsTap();
      toggleAutoPause();
      return;
    }
    if(pendingNewsTap!==null){
      clearPendingNewsTap();
      ui.autoWait?.skip();
      return;
    }
    const date=ui.autoDay.date;
    pendingNewsTap=setTimeout(()=>{
      pendingNewsTap=null;
      if(ui.busy&&ui.autoDay?.date===date)toggleAutoPause();
    },NEWS_DOUBLE_TAP_MS);
  });
  const appRoot=document.querySelector('#app');
  if(appRoot)appRoot.innerHTML='<div class="title-screen"><h2>セーブデータを読み込んでいます…</h2></div>';
  (async()=>{
    try{await load();ensureGameExtras();ui.page='title';render();}
    catch(e){
      console.warn('Unable to initialize saved data:',e);
      if(appRoot)appRoot.innerHTML='<div class="title-screen"><h2>セーブを読み込めません</h2><p>ブラウザの保存領域にアクセスできないか、データ形式が一致しません。データは自動削除されていません。</p></div>';
    }
  })();
  // Small read-only inspection surface for automated tests in development.
  window.PennantLab={getSnapshot:()=>({year:game.year,day:game.day,selectedId:game.selectedId,teams:game.teams.map(t=>({id:t.id,name:t.name,league:t.league,w:t.wins,l:t.losses,t:t.ties,cash:t.cash,lineup:[...t.lineup],rotation:[...t.rotation]})),playerCount:game.players.length,games:game.games.length,history:[...game.history],schedule:game.schedule.map(day=>day.map(m=>({...m})))}),advance,reset:()=>{localStorage.removeItem(KEY());buildFresh();ui.page='title';render()}};
})();

</script></body>
</html>
